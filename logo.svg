<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Maisya Logo">
  <!-- Hard shadow -->
  <rect x="14" y="14" width="108" height="108" fill="#191b19" />
  <!-- Warm Millennium beige chassis -->
  <rect x="8" y="8" width="108" height="108" fill="#ebe6da" stroke="#232624" stroke-width="3" />
  <!-- Bevel highlight & bottom shade -->
  <path d="M11 113V11H113" fill="none" stroke="#faf8f2" stroke-width="2" />
  <path d="M113 11V113H11" fill="none" stroke="#b9b19f" stroke-width="2" />

  <!-- Top chassis tricolor hardware badge & vent slits -->
  <rect x="16" y="16" width="12" height="10" fill="#e06d53" stroke="#232624" stroke-width="1.5" />
  <rect x="28" y="16" width="12" height="10" fill="#e2a83c" stroke="#232624" stroke-width="1.5" />
  <rect x="40" y="16" width="12" height="10" fill="#5ec4b8" stroke="#232624" stroke-width="1.5" />
  <line x1="84" y1="18" x2="108" y2="18" stroke="#7d7668" stroke-width="2" />
  <line x1="84" y1="23" x2="108" y2="23" stroke="#7d7668" stroke-width="2" />

  <!-- Sunken dark phosphor LCD bezel -->
  <rect x="16" y="32" width="92" height="62" fill="#1b2421" stroke="#232624" stroke-width="2.5" />
  <line x1="18" y1="92" x2="106" y2="92" stroke="#364842" stroke-width="1.5" />
  <line x1="106" y1="34" x2="106" y2="92" stroke="#364842" stroke-width="1.5" />

  <!-- Subtle scope grid inside LCD -->
  <line x1="18" y1="52" x2="106" y2="52" stroke="#263631" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="18" y1="73" x2="106" y2="73" stroke="#263631" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="47" y1="34" x2="47" y2="92" stroke="#263631" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="77" y1="34" x2="77" y2="92" stroke="#263631" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Signature Maisya fish silhouette -->
  <g transform="translate(26, 44)">
    <!-- Tail fin -->
    <polygon points="18,19 2,7 6,19 2,31" fill="#e06d53" stroke="#ebe6da" stroke-width="1.5" stroke-linejoin="miter" />
    <!-- Dorsal fin -->
    <polygon points="32,8 46,0 50,9" fill="#e2a83c" stroke="#ebe6da" stroke-width="1.5" stroke-linejoin="miter" />
    <!-- Fish body -->
    <path d="M16,19 C22,7 44,5 62,13 C70,16 74,19 74,19 C74,19 70,22 62,25 C44,33 22,31 16,19 Z" fill="#5ec4b8" stroke="#ebe6da" stroke-width="2" />
    <!-- Stripes -->
    <path d="M35,10 C37,16 37,22 35,28" fill="none" stroke="#1b2421" stroke-width="2.5" stroke-linecap="round" />
    <path d="M46,9 C48,16 48,22 46,29" fill="none" stroke="#ebe6da" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <!-- Eye -->
    <circle cx="59" cy="17" r="3.2" fill="#1b2421" />
    <circle cx="60" cy="16" r="1.2" fill="#faf8f2" />
    <!-- Telemetry bubbles -->
    <rect x="78" y="8" width="4" height="4" fill="#5ec4b8" />
    <rect x="83" y="2" width="3" height="3" fill="#e2a83c" />
  </g>

  <!-- Bottom mechanical keycap strip -->
  <rect x="16" y="100" width="56" height="10" fill="#232624" />
  <text x="44" y="108" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#ebe6da" text-anchor="middle">MAISYA</text>
  <rect x="76" y="100" width="14" height="10" fill="#92d4a8" stroke="#232624" stroke-width="1.5" />
  <rect x="94" y="100" width="14" height="10" fill="#d8d1c2" stroke="#232624" stroke-width="1.5" />
</svg>
