name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Keep browser cache outside the checkout
        run: >-
          python -c "import os; from pathlib import Path;
          cache = Path(os.environ['RUNNER_TEMP']) / 'maisya-playwright';
          f = open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8');
          f.write('PLAYWRIGHT_BROWSERS_PATH=' + str(cache) + '\n'); f.close()"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          "maibot-plugin-sdk>=2.8.1,<=2.23.99"
          pytest pytest-asyncio
          "cryptography>=46,<51" "jsonschema>=4.23,<5"
          pydantic playwright pillow
      - name: Install Chromium for Playwright
        if: matrix.os == 'ubuntu-latest'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for Playwright
        if: matrix.os != 'ubuntu-latest'
        run: python -m playwright install chromium
      - name: Check WebUI build consistency
        run: python webui/build.py --check
      - name: Run unit and UI tests
        run: python -m pytest tests -q -rs -p no:cacheprovider
