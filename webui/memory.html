/* Maisya WebUI · 双主题设计系统
   1. 默认主题：MaiBot 千禧机械风 [data-ui-style="millennium"]（0px 直角 / 塑料机壳凹凸导角与纹理 / 百叶散热窗与丝印 / 下沉液晶屏与深色示波器 / 立体机械键帽 / 高可读系统无衬线正文）
   2. 可选主题：MaiWork 清朗手账风 [data-ui-style="maiwork"]（白底/深黑画布、发丝分割线、胶囊按键、毛玻璃导航条、清晰可读留白，为 :root 基础层） */

  --ctx-memory: #dcfce7;

  --mil-accent: #5b8cff;

  --mil-on: #f2f2f5;

  --mil-danger-ink: #ff6961;
  --mil-led: #30d158;
  --mil-led-run: #5b8cff;
  --mil-led-bad: #ff453a;
  --mil-meter: #5b8cff;

  --mil-raise: 0 2px 16px rgba(0, 0, 0, 0.32);

  --ctx-system: #1d3557;
  --ctx-memory: #164430;
  --ctx-user: #583f14;
  --ctx-assistant: #134e4a;
  --ctx-tool: #5c2f18;
  --ctx-free: #232328;
  --ctx-tile-ink: #f2f2f5;
  color-scheme: dark;
}

  /* 英文丝印、数字与徽章保留像素/等宽机箱质感；中文正文保持高可读无衬线体 */

  --mil-font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mil-font-mono: var(--maibot-font-mono, "Departure Mono", "JetBrains Mono", ui-monospace, monospace);

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background-color: var(--mil-shell);
  color: var(--mil-ink);
  font-family: var(--mil-font-body);
  font-size: 14px;
  line-height: 1.56;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root[data-ui-style="millennium"],
:root[data-ui-style="millennium"] body {
  background-image: var(--mil-grain-shell);
  background-size: 5px 5px;
}

button, input, select, textarea {
  font: inherit;
}

[hidden] {
  display: none !important;
}

h1, h2, h3, h4, p {
  margin: 0;
}

pre, code, .mono, .num {
  font-family: var(--mil-font-mono);
  font-variant-numeric: tabular-nums;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--mil-lo);
  border-radius: 999px;
}
:root[data-ui-style="millennium"] ::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}
:root[data-ui-style="millennium"] ::-webkit-scrollbar-track {
  background: var(--mil-well);
  border-left: 1px solid var(--mil-line);
}
:root[data-ui-style="millennium"] ::-webkit-scrollbar-thumb {
  background: var(--mil-lo);
  border: 2px solid var(--mil-line);
  border-radius: 0;
}

/* ───────────── 页面外壳与顶栏 ───────────── */

.mil-shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 18px 28px 56px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
:root[data-ui-style="millennium"] .mil-shell {
  max-width: 1380px;
  padding: 16px 20px 44px;
  gap: 18px;
}

.mil-topbar {
  position: sticky;
  top: 12px;
  z-index: 30;
  background: var(--mil-glass);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--mil-line);
  border-radius: 999px;
  box-shadow: 0 6px 24px rgba(17, 17, 20, 0.04);
  padding: 8px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
:root[data-ui-style="millennium"] .mil-topbar {
  position: static;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background-color: var(--mil-panel);
  background-image: var(--mil-grain-panel);
  background-size: 5px 5px;
  border: 2px solid var(--mil-line);
  border-radius: 0;
  box-shadow: var(--mil-raise);
  padding: 11px 16px;
}

.mil-brand {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.ms-wordmark {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.mil-spectrum {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.mil-spectrum i {
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.mil-spectrum i:nth-child(1) { background: var(--mil-accent); }
.mil-spectrum i:nth-child(2) { background: var(--mil-ok); }
.mil-spectrum i:nth-child(3) { background: var(--mil-warn); }

:root[data-ui-style="millennium"] .mil-spectrum {
  display: inline-grid;
  grid-template-columns: repeat(3, 8px);
  align-items: stretch;
  gap: 0;
  height: 22px;
  border: 2px solid var(--mil-line);
}
:root[data-ui-style="millennium"] .mil-spectrum i {
  width: 100%;
  height: 100%;
  border-radius: 0;
}
:root[data-ui-style="millennium"] .mil-spectrum i:nth-child(1) { background: var(--mil-on); }
:root[data-ui-style="millennium"] .mil-spectrum i:nth-child(2) { background: var(--mil-warn); }
:root[data-ui-style="millennium"] .mil-spectrum i:nth-child(3) { background: var(--mil-hot); }

.mil-nameplate {
  font-family: var(--mil-font-display);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mil-ink);
  flex-shrink: 0;
}
:root[data-ui-style="millennium"] .mil-nameplate {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 3px 8px;
  background: #5a544a;
  color: #f3eee1;
}
:root.dark[data-ui-style="millennium"] .mil-nameplate {
  background: #ebe4d2;
  color: #25221f;
}

.mil-page-title {
  font-family: var(--mil-font-body);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.01em;
  line-height: 1.2;
  color: var(--mil-ink);
  white-space: nowrap;
  flex-shrink: 0;
}
:root[data-ui-style="millennium"] .mil-page-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.mil-nav {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px;
  background: var(--mil-well);
  border: 0;
  border-radius: 999px;
  overflow-x: auto;
  max-width: 100%;
}
.mil-nav .mil-key {
  min-height: 30px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--mil-muted);
  box-shadow: none;
  font-size: 13.5px;
  font-weight: 600;
}
.mil-nav .mil-key[aria-current="page"] {
  background: var(--mil-panel);
  color: var(--mil-ink);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

:root[data-ui-style="millennium"] .mil-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  overflow-x: visible;
}
:root[data-ui-style="millennium"] .mil-nav .mil-key {
  min-height: 29px;
  padding: 3px 11px 7px;
  border: 2px solid var(--mil-line);
  border-radius: 0;
  background: var(--mil-key);
  color: var(--mil-ink);
  box-shadow: inset 0 -4px 0 var(--mil-key-side), inset 2px 2px 0 var(--mil-key-hi);
  font-size: 12.5px;
  font-weight: 700;
}
:root[data-ui-style="millennium"] .mil-nav .mil-key[aria-current="page"] {
  background: var(--mil-on);
  color: var(--mil-on-ink);
  padding-top: 5px;
  padding-bottom: 5px;
  transform: translateY(2px);
  box-shadow: inset 0 -1px 0 var(--mil-on-side), inset 1px 1px 0 rgba(255, 255, 255, 0.35);
}

.mil-top-right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.mil-led-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  background: var(--mil-well);
  border: 0;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mil-ink-2);
}
:root[data-ui-style="millennium"] .mil-led-pill {
  padding: 4px 10px;
  background-color: var(--mil-screen);
  background-image: var(--mil-lcd-grid);
  background-size: 3px 3px;
  border: 2px solid var(--mil-line);
  border-radius: 0;
  box-shadow: inset 2px 2px 0 var(--mil-screen-shade);
  font-family: var(--mil-font-mono);
  font-size: 12px;
  font-weight: 700;
}

.mil-led {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--mil-led);
  box-shadow: 0 0 0 3px var(--mil-ok-soft);
  flex-shrink: 0;
}
.mil-led--run {
  background: var(--mil-led-run);
  box-shadow: 0 0 0 3px var(--mil-accent-soft);
  animation: mil-pulse 1.6s ease-in-out infinite;
}
.mil-led--bad {
  background: var(--mil-led-bad);
  box-shadow: 0 0 0 3px var(--mil-danger-soft);
}
.mil-led--off {
  background: var(--mil-muted);
  box-shadow: none;
}

:root[data-ui-style="millennium"] .mil-led {
  width: 10px;
  height: 10px;
  border-radius: 0;
  border: 2px solid var(--mil-line);
  box-shadow: 0 0 0 1px var(--mil-lo);
}
:root[data-ui-style="millennium"] .mil-led--run {
  animation: mil-pulse-step 1.1s steps(2, end) infinite;
}
:root[data-ui-style="millennium"] .mil-led--off {
  background: var(--mil-well);
}

@keyframes mil-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.88); }
}
@keyframes mil-pulse-step {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ───────────── 模块面板、丝印标头、百叶散热窗 ───────────── */

.mil-panel {
  background: transparent;
  border: 0;
  border-top: 1px solid var(--mil-line);
  border-radius: 0;
  box-shadow: none;
  padding: 22px 0 4px;

function fishHashSeed(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}

function fishRng(seed) {
  let a = fishHashSeed(String(seed));
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const FISH_SPECIES = Object.fromEntries(Object.entries(FISH_SPECIES_SPEC).map(([k, v]) => [k, v.name]));

function fishTailPoints(t, xr) {
  const { L, S } = t;
  const P = (fx, fy) => [xr - L * fx, S * fy];
  switch (t.type) {
    case "fork": return [P(0.95, 1), P(0.5, 0.05), P(0.95, -1)];
    case "fan": return [P(0.65, 1), P(1, 0.5), P(0.82, 0), P(1, -0.5), P(0.65, -1)];
    case "round": return [P(0.55, 0.85), P(1, 0), P(0.55, -0.85)];
    case "spade": return [P(0.45, 0.6), P(1, 0), P(0.45, -0.6)];
    case "none": return [P(0.4, 0.75), P(0.7, 0.3), P(0.45, 0), P(0.7, -0.3), P(0.4, -0.75)];
    case "shark": return [P(0.7, 0.75), P(0.35, 0), P(1, -1.1)];
    case "ribbon": return [P(0.35, 1.25), P(0.95, 1.05), P(1.1, 0.25), P(0.9, -0.45), P(0.5, -1.05)];
    default: return [];
  }
}

function fishBuildGeometry(spec) {
  const { a, b, n = 2, taper = 0, tailW, fins = [], ripple } = spec;
  const e = 2 / n;
  const sp = (v) => Math.sign(v) * Math.abs(v) ** e;
  const P = (th, withFins = true) => {
    const c = Math.cos(th), s = Math.sin(th);
    let f = 1;
    if (withFins) for (const fin of fins) f += fin.h * Math.exp(-(((th - fin.at) / fin.w) ** 2));
    if (ripple) f += ripple.s * (0.5 + 0.5 * Math.cos(ripple.k * th)) ** 3;
    return [a * sp(c) * f, b * sp(s) * (1 + taper * c) * f];
  };
  const N = 26, pts = [];
  for (let i = 0; i <= N; i++) pts.push(P((FISH_PI - tailW) * (i / N)));
  const bot = P(FISH_PI - tailW), top = P(FISH_PI + tailW);
  pts.push(...fishTailPoints(spec.tail, Math.min(bot[0], top[0])));
  for (let i = 0; i < N; i++) pts.push(P(FISH_PI + tailW + (FISH_PI - tailW) * (i / N)));
  const eyeP = P(spec.eye.t, false);
  const eye = [eyeP[0] * spec.eye.k + a * 0.12, eyeP[1] * spec.eye.k];
  let lure = null;
  if (spec.lure) {
    const root = P(2 * FISH_PI - 0.95, false);
    lure = { root, tip: [a * spec.lure.reach + 4, -b * spec.lure.lift - 6] };
  }
  return { pts, eye, lure };
}

function fishSmoothPath(pts, digits = 1) {
  const n = pts.length, f = (v) => v.toFixed(digits);
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + "Z";
}

const fishF1 = (v) => v.toFixed(1);
const fishEyeSlash = (len, lean, w = 4.6) => {
  const dx = (Math.sin(lean) * len) / 2, dy = (Math.cos(lean) * len) / 2;
  return `<line x1="${fishF1(-dx)}" y1="${fishF1(-dy)}" x2="${fishF1(dx)}" y2="${fishF1(dy)}" fill="none" stroke-width="${w}"/>`;
};
const fishEyeArc = (w, h, sw = 3.6) => `<path d="M${fishF1(-w)} ${fishF1(h / 2)}Q0 ${fishF1(-h * 1.3)} ${fishF1(w)} ${fishF1(h / 2)}" fill="none" stroke-width="${sw}"/>`;
const FISH_DEG = FISH_PI / 180;
const FISH_EYES_SPEC = {
  slash:   { name: "斜眼", weight: 6, draw: (ev) => fishEyeSlash(ev(7.5, 9.5), -ev(12, 22) * FISH_DEG) },
  upright: { name: "直眼", weight: 2, draw: (ev) => fishEyeSlash(ev(7.5, 9.5), ev(-3, 3) * FISH_DEG) },

  happy:   { name: "笑眼", weight: 2, draw: (ev) => fishEyeArc(ev(3.2, 3.8), ev(3, 3.6)) },

  flat:    { name: "眯眼", weight: 1, draw: (ev) => `<line x1="-2.4" y1="0" x2="2.4" y2="0" fill="none" stroke-width="3.6"/>` },

const FISH_EYES = Object.fromEntries(Object.entries(FISH_EYES_SPEC).map(([k, v]) => [k, v.name]));

function fishEyeTraits(seed, opts = {}) {
  const E = fishRng(`${seed}#eyes`);
  const total = Object.values(FISH_EYES_SPEC).reduce((n, e) => n + e.weight, 0);
  let x = E() * total, eyes = "slash";
  for (const [k, e] of Object.entries(FISH_EYES_SPEC)) { if ((x -= e.weight) < 0) { eyes = k; break; } }
  if (opts.eyes && FISH_EYES_SPEC[opts.eyes]) eyes = opts.eyes;
  return { eyes, E };
}

const FISH_CUSTOM_RE = /(^|:)c-([a-z]+)-(\d{1,2})-([a-z]+)-([A-Za-z0-9_]{0,10})$/;
const FISH_BASE_RE = /^[A-Za-z0-9_]{0,10}$/;
function parseFishCustom(seed) {
  const s = String(seed == null ? "" : seed);
  const m = s.match(FISH_CUSTOM_RE);
  if (!m || !FISH_SPECIES_SPEC[m[2]] || !FISH_EYES_SPEC[m[4]] || Number(m[3]) >= FISH_COLORS.length) return null;
  return { species: m[2], color: Number(m[3]), eyes: m[4], base: m[5], baseSeed: s.slice(0, m.index + m[1].length) + m[5] };
}
const customFishSeed = ({ species, color, eyes, base = "" }) => `c-${species}-${Number(color) || 0}-${eyes}-${base}`;
const newFishSeed = () => "f" + Math.random().toString(36).slice(2, 9);
const roleFishSeed = (roleId, seed = "") => `agent:${roleId || "scout"}:${seed || ""}`;

function fishTraits(seed, opts = {}) {
  const c = parseFishCustom(seed);
  const base = c ? c.baseSeed : seed;
  const R = fishRng(base);
  const keys = Object.keys(FISH_SPECIES_SPEC);
  let species;
  if (c) { R(); species = c.species; }
  else species = opts.species && FISH_SPECIES_SPEC[opts.species] ? opts.species : keys[Math.floor(R() * keys.length)];
  if (c && opts.species && FISH_SPECIES_SPEC[opts.species]) species = opts.species;
  let color = FISH_COLORS[Math.floor(R() * FISH_COLORS.length)];
  if (c) color = FISH_COLORS[c.color];
  const colorIdx = Math.max(0, FISH_COLORS.indexOf(color));
  const { eyes } = fishEyeTraits(base, c && !opts.eyes ? { ...opts, eyes: c.eyes } : opts);
  return {
    species,
    name: FISH_SPECIES_SPEC[species].name,
    color,
    colorName: FISH_COLOR_NAMES[colorIdx] || "",
    eyes,
    eyeName: FISH_EYES_SPEC[eyes].name,
    R,
    base,
    custom: !!c,
  };
}

const FISH_SWIM = {
  pebble:   { amp: 3.6, pow: 2.2, waves: 0.55, hz: 1.5 },
  classic:  { amp: 4.2, pow: 2.0, waves: 0.6,  hz: 1.3 },
  eel:      { amp: 4.2, pow: 1.0, waves: 1.15, hz: 1.0 },
  disc:     { amp: 3.0, pow: 2.6, waves: 0.5,  hz: 1.2 },
  drop:     { amp: 4.2, pow: 2.4, waves: 0.6,  hz: 1.4 },
  goldfish: { amp: 3.8, pow: 2.4, waves: 0.6,  hz: 1.0 },
  puffer:   { amp: 2.6, pow: 4.0, waves: 0.4,  hz: 2.2 },
  sunfish:  { amp: 2.4, pow: 3.5, waves: 0.4,  hz: 0.9 },
  shark:    { amp: 4.0, pow: 1.8, waves: 0.7,  hz: 1.0 },
  betta:    { amp: 4.6, pow: 2.2, waves: 0.8,  hz: 0.8 },
  angler:   { amp: 3.2, pow: 2.6, waves: 0.55, hz: 1.2 },
  boxfish:  { amp: 2.6, pow: 4.0, waves: 0.4,  hz: 2.0 },
};

function fishSwimPose(g, time) {
  const t = time + g.lag, st = g.style, TAU = 2 * FISH_PI;
  const W = TAU / g.surge, c = 0.55;
  const phase = TAU * st.hz * g.beat * (t + (c * Math.sin(W * t)) / W);
  const effort = 0.5 + 0.5 * Math.cos(W * t);
  const A = st.amp * (0.45 + 0.55 * effort);
  const env = (u) => 0.05 + 0.95 * u ** st.pow;
  const sway = (u) => env(u) * A * Math.sin(phase - st.waves * TAU * u);
  const pts = g.pts.map((p, i) => {
    const w = sway(g.ts[i]);
    return [p[0] + g.n[0] * w, p[1] + g.n[1] * w];
  });
  const hw = sway(g.eyeT);
  const b = (TAU * t) / g.bob;
  const y = 1.8 * Math.sin(b), pitch = 2.2 * Math.cos(b), x = 0.9 * (effort - 0.5);
  return {
    d: fishSmoothPath(pts, 2),
    head: `translate(${(g.n[0] * hw).toFixed(2)} ${(g.n[1] * hw).toFixed(2)})`,
    body: `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${pitch.toFixed(2)} ${g.cx} ${g.cy})`,
  };
}

const FISH_SWIM_GEOMS = new Map();
const FISH_SWIM_IDS = new Map();
function registerFishSwim(key, geom) {
  let id = FISH_SWIM_IDS.get(key);
  if (id == null) { id = FISH_SWIM_IDS.size + 1; FISH_SWIM_IDS.set(key, id); }
  FISH_SWIM_GEOMS.set(id, geom);
  return id;
}
const fishSwimGeom = (id) => FISH_SWIM_GEOMS.get(Number(id));

let fishSwimOn = false;
let fishSwimFrame = 0;
const _fishReduceMotion = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
function stopFishSwimLoop() {
  if (fishSwimFrame && typeof cancelAnimationFrame === "function") cancelAnimationFrame(fishSwimFrame);
  fishSwimFrame = 0;
  fishSwimOn = false;
  if (typeof document === "undefined") return;
  for (const el of document.querySelectorAll("svg.fish-swim[data-fish-id]")) {
    const g = fishSwimGeom(el.dataset.fishId);
    const body = el.querySelector(".fish-body");
    if (g && body) body.setAttribute("d", fishSmoothPath(g.pts));
    el.querySelector(".fish-bob")?.removeAttribute("transform");
    for (const head of el.querySelectorAll(".fish-head")) head.removeAttribute("transform");
  }
}
if (typeof matchMedia === "function") {
  matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", (e) => {
    if (e.matches) stopFishSwimLoop();
    else startFishSwimLoop();
  });
}
function startFishSwimLoop() {
  if (fishSwimOn || typeof requestAnimationFrame !== "function" || typeof document === "undefined" || typeof document.querySelectorAll !== "function") return;
  if (_fishReduceMotion()) return;
  fishSwimOn = true;
  let items = [], lastScan = -1e9, empty = 0;
  const tick = (now) => {
    fishSwimFrame = 0;
    if (!fishSwimOn || _fishReduceMotion()) { stopFishSwimLoop(); return; }
    if (now - lastScan > 400 || items.some((x) => !x.body.isConnected)) {
      lastScan = now;
      items = [...document.querySelectorAll("svg.fish-swim[data-fish-id]")].map((el) => ({
        g: fishSwimGeom(el.dataset.fishId), body: el.querySelector(".fish-body"), bob: el.querySelector(".fish-bob"),
        heads: [...el.querySelectorAll(".fish-head")],
      })).filter((x) => x.g && x.body);
      empty = items.length ? 0 : empty + 1;
      if (empty > 5) { fishSwimOn = false; return; }
    }
    const sec = now / 1000;
    for (const x of items) {
      const p = fishSwimPose(x.g, sec);
      x.body.setAttribute("d", p.d);
      if (x.bob) x.bob.setAttribute("transform", p.body);
      for (const h of x.heads) h.setAttribute("transform", p.head);
    }
    fishSwimFrame = requestAnimationFrame(tick);
  };
  fishSwimFrame = requestAnimationFrame(tick);
}

function fishSvg(seed, opts = {}) {
  const { species, color, R, base, custom } = fishTraits(seed, opts);
  const c = custom ? parseFishCustom(seed) : null;
  const eyeOpts = c && !opts.eyes ? { ...opts, eyes: c.eyes } : opts;
  const u = (lo, hi) => lo + (hi - lo) * R();
  const ok = (p) => R() < p;
  const spec = FISH_SPECIES_SPEC[species].make(u, ok);
  let { pts, eye, lure } = fishBuildGeometry(spec);

  if (spec.wave) {
    const fq = (2 * FISH_PI) / (spec.a * 1.7);
    const wv = (p) => [p[0], p[1] + spec.wave.amp * Math.sin(p[0] * fq + spec.wave.ph)];
    pts = pts.map(wv); eye = wv(eye);
  }
  const rot = u(-8, 8) * (FISH_PI / 180), cr = Math.cos(rot), sr = Math.sin(rot);
  const rt = (p) => [p[0] * cr - p[1] * sr, p[0] * sr + p[1] * cr];
  pts = pts.map(rt); eye = rt(eye);
  if (lure) lure = { root: rt(lure.root), tip: rt(lure.tip) };

  const all = lure ? [...pts, [lure.tip[0] + 5, lure.tip[1] - 5], [lure.tip[0] - 5, lure.tip[1] + 5]] : pts;
  const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const sc = Math.min(84 / (maxx - minx), 76 / (maxy - miny));
  const tx = 50 - ((minx + maxx) / 2) * sc, ty = 50 - ((miny + maxy) / 2) * sc;
  const T = (p) => [p[0] * sc + tx, p[1] * sc + ty];
  pts = pts.map(T);

  const f = (v) => v.toFixed(1);
  const [ex, ey] = T(eye);
  const { eyes: eyeStyle, E } = fishEyeTraits(base, eyeOpts);
  const ev = (lo, hi) => lo + (hi - lo) * E();
  const gap = ev(9, 11.5) * (eyeStyle === "dots" || eyeStyle === "beads" ? 0.95 : 1);
  const one = FISH_EYES_SPEC[eyeStyle].draw(ev);
  const drawn = eyeStyle === "wink" ? [one[0], one[1]] : [one, one];
  const deg = (rot * 180) / FISH_PI;
  const place = (x, y, g) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(deg)})">${g}</g>`;
  const e2 = [ex - gap * cr, ey - gap * sr];
  const eyesSvg = place(ex, ey, drawn[0]) + place(e2[0], e2[1], drawn[1]);

  const size = opts.size || 64;
  let lureSvg = "";
  if (lure) {
    const r0 = T(lure.root), r1 = T(lure.tip);
    const mid = [(r0[0] + r1[0]) / 2 - 2, Math.min(r0[1], r1[1]) - 6];
    lureSvg = `<path d="M${f(r0[0])} ${f(r0[1])}Q${f(mid[0])} ${f(mid[1])} ${f(r1[0])} ${f(r1[1])}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/><circle cx="${f(r1[0])}" cy="${f(r1[1])}" r="4.2" fill="${color}"/>`;
  }
  const label = opts.title ? `<title>${String(opts.title).replace(/[<&>"]/g, "")}</title>` : "";

  const ax = [cr, sr], nrm = [-sr, cr];
  const along = (p) => p[0] * ax[0] + p[1] * ax[1];
  const ss = pts.map(along), sHead = Math.max(...ss), sTail = Math.min(...ss), span = sHead - sTail || 1;
  const M = fishRng(`${base}#swim`);
  const geom = {
    pts, ts: ss.map((s) => (sHead - s) / span), n: nrm, eyeT: (sHead - along([ex, ey])) / span,
    style: FISH_SWIM[species] || FISH_SWIM.classic, cx: 50, cy: 50,
    beat: 0.9 + M() * 0.35, bob: 2.8 + M() * 1.4, surge: 5.5 + M() * 3, lag: M() * 20,
  };
  const id = opts.still ? 0 : registerFishSwim(`${seed}|${opts.species || ""}|${opts.eyes || ""}`, geom);
  if (id) startFishSwimLoop();
  return `<svg class="fish${id ? " fish-swim" : ""}"${id ? ` data-fish-id="${id}"` : ""} viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="${opts.title ? "false" : "true"}">${label}`
    + `<g class="fish-bob">`
    + (lureSvg ? `<g class="fish-head">${lureSvg}</g>` : "")
    + `<path class="fish-body" d="${fishSmoothPath(pts)}" fill="${color}"/>`
    + `<g class="fish-head" fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">${eyesSvg}</g>`
    + `</g></svg>`;
}

  let inflight = 0;

  async function acquire() {
    if (inflight >= 2) await new Promise((res) => waiters.push(res));
    inflight++;
  }
  function release() {
    inflight--;
    if (waiters.length) waiters.shift()();
  }
  async function rpc(op, key, body) {
    await acquire();
    try {
      const arg = op === "read"
        ? { section: key, payload: JSON.stringify(body || {}) }
        : { action: key, payload: JSON.stringify(body || {}) };
      const res = op === "read" ? await window.maibot.query("read", arg) : await window.maibot.action("write", arg);

    function parseSimpleToml(text) {
      const out = { tools: [], skills: [], allow_chats: [], allow_users: [] };
      String(text || "").split(/\r?\n/).forEach((line) => {
        const clean = line.trim();
        if (!clean || clean.startsWith("#")) return;
        const eq = clean.indexOf("=");
        if (eq < 1) return;
        const k = clean.slice(0, eq).trim();
        let v = clean.slice(eq + 1).trim();
        try {
          if (v.startsWith("[") && v.endsWith("]")) out[k] = JSON.parse(v);
          else if (v.startsWith("\"") && v.endsWith("\"")) out[k] = JSON.parse(v);
          else if (v === "true" || v === "false") out[k] = v === "true";
          else if (!Number.isNaN(Number(v))) out[k] = Number(v);

      return out;

    function applyModelChainToToml(chain) {
      const clean = [];
      (chain || []).forEach((item) => {
        const s = String(item || "").trim();
        if (s && !clean.includes(s)) clean.push(s);
      });
      const limited = clean.slice(0, 16);
      setDirty(true);
      writeTomlKey("model_name", limited[0] ? tomlStr(limited[0]) : null);
      writeTomlKey("fallback_models", limited.length > 1 ? tomlArr(limited.slice(1)) : null);
      writeTomlKey("model", null);
      writeTomlKey("model_list", null);
      renderModelChainEditor();
    }

    function addModelToChain(rawName) {
      const name = String(rawName || "").trim();
      if (!name) return false;
      const cur = getTomlModelChain();
      if (!cur.includes(name)) cur.push(name);
      applyModelChainToToml(cur);
      return true;
    }

    function scopeKnownName(spec) {
      const known = Array.isArray(catalog.known_chats) ? catalog.known_chats : [];
      const hit = known.find((k) => k.stream_spec === spec || k.chat_id === spec);
      const m = String(spec || "").match(/^([a-z0-9_-]+):(group|private):(.+)$/i);
      if (hit?.name && hit.name !== spec && (!m || hit.name !== m[3])) return hit.name;
      return m ? `${m[1].toUpperCase()} ${m[2].toLowerCase() === "group" ? "群聊" : "私聊"} · ${m[3]}` : spec;
    }

    function normalizeScopeChat(raw) {
      const s = String(raw || "").trim();
      if (!s) return "";
      const m = s.match(/^(?:chat:)?([a-z][a-z0-9_-]*):(group|private):([^\s:][^\s]*)$/i);
      if (m) return `${m[1].toLowerCase()}:${m[2].toLowerCase()}:${m[3].trim()}`;
      const known = Array.isArray(catalog.known_chats) ? catalog.known_chats : [];
      const hit = known.find((k) => k.chat_id === s || k.stream_spec === s);
      return hit?.stream_spec || s;
    }

    function writeTomlKey(key, formatted) {
      if (loadingConfig) return;
      const lines = $("#content").value.split(/\r?\n/);
      const re = new RegExp(`^\\s*${key}\\s*=`);
      const idx = lines.findIndex((l) => re.test(l));
      if (formatted === null) {
        if (idx >= 0) lines.splice(idx, 1);
      } else if (idx >= 0) {
        lines[idx] = `${key} = ${formatted}`;
      } else {
        lines.push(`${key} = ${formatted}`);
      }
      $("#content").value = lines.filter((l, i, arr) => i < arr.length - 1 || l !== "").join("\n") + "\n";
    }

    function unquoteYamlVal(raw) {
      const v = String(raw || "").trim();
      if (v.length >= 2 && v.startsWith("\"") && v.endsWith("\"")) {
        try { return JSON.parse(v); } catch { return v.slice(1, -1); }
      }
      if (v.length >= 2 && v.startsWith("'") && v.endsWith("'")) return v.slice(1, -1);
      return v;
    }

    function parseSkillFrontmatter(text) {
      const m = String(text || "").match(/^\s*---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
      const out = { name: "", description: "" };
      if (!m) return out;
      m[1].split(/\r?\n/).forEach((line) => {
        const pair = line.match(/^\s*([A-Za-z0-9_-]+)\s*:\s*(.*?)\s*$/);
        if (pair) {
          const k = pair[1].toLowerCase();
          if (k === "name" || k === "description") out[k] = unquoteYamlVal(pair[2]);
        }
      });
      return out;
    }

    function writeSkillFrontmatter(field, value) {
      if (loadingSkillVisual) return;
      const text = $("#content").value || "";
      const val = String(value ?? "");
      const formatted = field === "description"
        ? `description: ${JSON.stringify(val)}`
        : `name: ${val.trim() || selectedSkill || ""}`;
      const re = /^(\s*---\r?\n)([\s\S]*?)(\r?\n---(?:\r?\n|$))/;
      const m = text.match(re);
      if (m) {
        const lines = m[2].split(/\r?\n/);
        const lineRe = new RegExp(`^\\s*${field}\\s*:`, "i");
        const idx = lines.findIndex((l) => lineRe.test(l));
        if (idx >= 0) lines[idx] = formatted;
        else lines.push(formatted);
        $("#content").value = m[1] + lines.join("\n") + m[3] + text.slice(m[0].length);
      } else {
        const curName = ($("#sk-meta-name").value || selectedSkill || "custom-skill").trim();
        const curDesc = $("#sk-meta-desc").value || "";
        const head = `---\nname: ${curName}\ndescription: ${JSON.stringify(curDesc)}\n---\n\n`;
        $("#content").value = head + text;
      }
    }

      if (doc === "skill") return { kind: "skill", target: selectedSkill || $("#skill-id").value.trim() };
      if (doc === "config") return { kind: "profile", target: selectedProfile, document: "profile.toml" };
      if (doc === "profile") return { kind: "profile", target: selectedProfile, document: "PROFILE.md" };
      return { kind: doc, target: selectedProfile };

    let assetLoadSeq = 0;
    let hostModelsProbed = false;
    async function loadAsset(preserveDraft = false) {
      const seq = ++assetLoadSeq;
      renderDocModeUI();
      if (viewMode === "skills-gallery" || viewMode === "discovery") return;
      const q = targetQuery();
      if (!q.target) {
        $("#content").value = "";
        $("#content").disabled = false;
        $("#save").disabled = false;
        $("#version").textContent = "未选择";
        return;
      }
      const prevDraft = $("#content").value;
      $("#content").disabled = true;
      $("#save").disabled = true;
      try {
        const r = await rpc("read", "asset", q);
        if (seq !== assetLoadSeq) return;
        if (!r?.success) return say(r?.error || "读取资产失败", true);
        if ($("#feedback")?.classList.contains("mil-feedback--err")) say("");
        if (preserveDraft && prevDraft !== (r.content || "")) {
          $("#local-draft").value = prevDraft;
          $("#draft-panel").hidden = false;
        }
        $("#content").value = r.content || "";
        expectedVersion = Number(r.version || 0);
        $("#version").textContent = `v${expectedVersion}`;
        setDirty(false);
        versionHistory(r.history, expectedVersion);
        if (viewMode === "roles" && $("#document").value === "config") {
          syncVisualFromToml();
          if (!hostModelsProbed && !(catalog.available_models || []).length) {
            hostModelsProbed = true;
            await refreshDiscovery();
            if (seq === assetLoadSeq && viewMode === "roles" && $("#document").value === "config") {
              renderModelChainEditor();
            }
          }
        }
        if (viewMode === "skill-editor" && $("#document").value === "skill") syncSkillVisualFromMarkdown();
      } finally {
        if (seq === assetLoadSeq) {
          $("#content").disabled = false;
          $("#save").disabled = false;
        }
      }
    }

    function uint8ToB64(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i += 8192) {
        bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
      }
      return btoa(bin);
    }
    async function uploadSkillBytes(bytes, filename, targetOverride = "") {
      const target = (targetOverride || $("#import-skill-id")?.value || "").trim();
      let token = "", offset = 0, lastResult = null;
      const chunkBytes = 18432;
      for (let i = 0; i < bytes.length || i === 0; i += chunkBytes) {
        const slice = bytes.subarray(i, i + chunkBytes);
        const done = i + chunkBytes >= bytes.length;
        const r = await rpc("write", "import_skill", {
          target,
          filename: filename || "",
          token,
          offset,
          data: uint8ToB64(slice),
          done,
          overwrite: true,
        });
        if (!r?.success) return say(r?.error || "导入技能包失败", true);
        token = r.token || token;
        offset = r.offset ?? offset;
        lastResult = r;
      }
      if ($("#import-skill-id")) $("#import-skill-id").value = "";
      $("#skill-add-drawer").hidden = true;
      await loadCatalog();
      if ((lastResult?.count || 0) > 1) {
        const names = (lastResult.imported || []).map((x) => x.id).join("、");
        viewMode = "skills-gallery";
        renderCatalog();
        renderDocModeUI();
        say(`已从压缩包批量导入 ${lastResult.count} 项技能：${names}`);
      } else if (lastResult?.id) {
        selectedSkill = lastResult.id;
        $("#skill-id").value = selectedSkill;
        $("#document").value = "skill";
        viewMode = "skill-editor";
        renderCatalog();
        const compCount = lastResult.imported?.[0]?.companions || 0;
        await loadAsset(false);
        say(compCount > 0 ? `已导入技能 ${selectedSkill}（含 ${compCount} 个附属文件）` : `已导入技能 ${selectedSkill}`);
      }
    }
    async function uploadSkillB64(b64, filename = "package.zip", targetOverride = "") {
      const clean = String(b64 || "").replace(/\s+/g, "");
      if (!clean) return say("请先粘贴技能包 Base64 文本", true);
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      await uploadSkillBytes(bytes, filename, targetOverride);
    }
    $("#import-skill-b64").onclick = async () => {

      viewMode = "roles";
      if ($("#document").value === "skill") $("#document").value = "profile";
      renderCatalog();
      await loadAsset(false);
      await refreshRecipeDraft();
      $("#role-package-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });

    $("#rcp-draft-btn").onclick = refreshRecipeDraft;
    ["rcp-inc-skills", "rcp-inc-notes", "rcp-inc-presets", "rcp-inc-routines"].forEach((cid) => {
      $(`#${cid}`)?.addEventListener("change", () => {
        if (!$("#rcp-draft-box")?.hidden) refreshRecipeDraft();
      });
    });

    $("#export").onclick = async () => {
      revokeRecipeBlob();
      let token = "", offset = 0, chunks = [], meta = null;
      const opts = recipeDraftOptions();
      for (let guard = 0; guard < 200; guard++) {
        const r = await rpc("read", "recipe_package", { target: selectedProfile, token, offset, ...(token ? {} : opts) });
        if (!r?.success) return say(r?.error || "导出配方失败", true);
        token = r.token;
        if (r.meta) meta = r.meta;
        chunks.push(r.data);
        offset = r.offset;
        if (offset >= r.total) break;
      }
      const b64 = chunks.join("");
      $("#package-text").value = b64;
      $("#package-panel").open = true;
      if (meta) renderDraftCheckup(meta);
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: "application/zip" });
        activeRecipeBlobUrl = URL.createObjectURL(blob);
        const dl = $("#rcp-download-link");
        if (dl) {
          dl.href = activeRecipeBlobUrl;
          dl.download = `${selectedProfile}-recipe.zip`;
          dl.hidden = false;
        }
      } catch {}
      say(`已导出角色 ${selectedProfile} 配方包（已自动剥离白名单与会话号）`);
    };
    async function copyRecipePackageText(fromSandboxFallback = false) {
      const text = $("#package-text")?.value?.trim() || "";
      if (!text) return say("请先点击「导出配方包」生成配方包文本", true);
      let copied = false;
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch {}
      $("#package-panel").open = true;
      $("#package-text").focus();
      $("#package-text").select();
      if (fromSandboxFallback) {
        say(copied
          ? "当前宿主沙箱限制直接下载文件，已自动复制配方包文本到剪贴板。"
          : "当前宿主沙箱限制直接下载文件，已全选配方包文本，请按 Ctrl/Cmd + C 复制。");
      } else {
        say(copied ? "已复制配方包文本到剪贴板。" : "已全选配方包文本，请按 Ctrl/Cmd + C 复制。");
      }
    }
    $("#copy-package").onclick = () => copyRecipePackageText(false);
    $("#select-package").onclick = () => { $("#package-text").select(); };
    $("#rcp-download-link").addEventListener("click", async (ev) => {
      if (window.origin === "null") {
        ev.preventDefault();
        await copyRecipePackageText(true);

    async function previewRecipeBytes(bytes, filename = "recipe.zip") {
      if (!bytes?.length) return say("配方包内容为空", true);
      say("");
      const target = $("#import-id").value.trim();
      let token = "", offset = 0, last = null;
      const stepBytes = 18432;
      for (let i = 0; i < bytes.length || i === 0; i += stepBytes) {
        const slice = bytes.subarray(i, i + stepBytes);
        const done = i + stepBytes >= bytes.length;
        const r = await rpc("write", "recipe_preview", {
          target,
          filename,
          token,
          offset,
          data: uint8ToB64(slice),
          done,
        });
        if (!r?.success) return say(r?.error || "配方预览解析失败", true);
        token = r.token || token;
        offset = r.offset ?? offset;
        last = r;
      }
      if (last?.preview_token) {
        renderRecipePreview(last);
        say(`已生成配方「${last.profile?.title || last.source_id}」预览，确认对齐状态后点击「确认导入配方」`);
      }
    }

    $("#rcp-fetch-btn").onclick = async () => {
      const url = $("#rcp-url").value.trim();
      if (!url) return say("请先粘贴公开配方链接", true);
      say("正在由后端安全拉取并校验配方包…");
      const r = await rpc("write", "recipe_preview", { url, target: $("#import-id").value.trim() });
      if (!r?.success) return say(r?.error || "公开链接拉取失败", true);
      renderRecipePreview(r);
      say(`已拉取并解析「${r.profile?.title || r.source_id}」，请核对缺件对齐状态后确认导入`);
    };

    $("#rcp-preview-btn").onclick = async () => {
      const clean = $("#package-text").value.replace(/\s+/g, "");
      if (!clean) return say("请先粘贴或导出配方包 Base64 文本", true);
      try {
        const bin = atob(clean);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        await previewRecipeBytes(bytes, "recipe-text.zip");
      } catch {
        say("配方包 Base64 文本格式无效", true);
      }
    };

    $("#rcp-mode-copy").addEventListener("change", () => {
      if ($("#rcp-mode-copy").checked && activeRecipePreview) {
        if (activeRecipePreview.existing_profile && $("#import-id").value.trim() === activeRecipePreview.existing_profile.id) {
          $("#import-id").value = activeRecipePreview.suggested_copy_id || `${activeRecipePreview.source_id}-copy`;

    $("#rcp-mode-update").addEventListener("change", () => {

        $("#import-id").value = activeRecipePreview.existing_profile.id;
      }
      syncRecipeRoutineGuard();
    });
    $("#import-id").addEventListener("input", syncRecipeImportModeUI);

    $("#rcp-confirm-import").onclick = async () => {
      if (!activeRecipePreview?.preview_token) return say("请先预览配方包", true);
      const target = $("#import-id").value.trim();
      if (!target) return say("请填写目标角色编号", true);
      const mode = $("#rcp-mode-update").checked && !$("#rcp-mode-update").disabled ? "update" : "copy";
      const routineChat = $("#rcp-routine-chat")?.value || "";
      const pickedRoutines = routineChat
        ? $$("[data-rcp-routine]:checked").map((x) => x.dataset.rcpRoutine)
        : [];
      say("");
      const r = await rpc("write", "recipe_import", {
        preview_token: activeRecipePreview.preview_token,
        target,
        mode,
        install_skills: $("#rcp-install-skills")?.checked !== false,
        overwrite_skills: mode === "update",
        mount_routines: pickedRoutines,
        routine_chat_id: routineChat,

      if (!r?.success) return say(r?.error || "配方导入失败", true);
      activeRecipePreview = null;
      $("#rcp-preview-card").hidden = true;
      $("#rcp-confirm-import").hidden = true;
      selectedProfile = r.id;
      viewMode = "roles";
      $("#document").value = "profile";
      await loadCatalog();

      const rtHint = (r.mounted_routines || []).length ? `，已挂载 ${r.mounted_routines.length} 项例行任务` : "";
      const bindHint = r.bound === false ? "（存在待绑定凭据/服务，当前设为待绑定保护态）" : "";
      say(mode === "update"
        ? `已平滑升级角色 ${r.id}${rtHint}${bindHint}，原白名单与工作区完整保留且可回滚`

    async function uploadB64(b64) {
      const target = $("#import-id").value.trim();
      if (!target) return say("请填写导入后的新角色编号", true);
      let token = "", offset = 0;
      const step = 16384;
      for (let i = 0; i < b64.length || i === 0; i += step) {
        const chunk = b64.slice(i, i + step);
        const done = i + step >= b64.length;
        const r = await rpc("write", "import", { target, token, offset, data: chunk, done });
        if (!r?.success) return say(r?.error || "导入失败", true);
        token = r.token || token;
        offset = r.offset || offset;
      }
      selectedProfile = target;
      $("#document").value = "profile";
      say("角色包已导入");
      await loadCatalog();
      await loadAsset(false);

    $("#package-file").addEventListener("change", () => {

      const reader = new FileReader();
      reader.onload = async () => {

  /* ════════════════════════════════════════════════════════════════
     1.5. 产物页 (outputs)
     ════════════════════════════════════════════════════════════════ */
  if (page === "outputs") {
    let outData = { items: [], workspaces: [], chats: [], chat_sources: {}, stats: {} };
    let filterChat = "";
    let filterKind = "all";
    let activeSpace = "all";
    let filterRole = "";
    let outLayout = "table";
    let visibleItems = [];
    let selectedItem = null;
    let curView = "preview";
    let curArtifact = null;
    let textAccumulator = "";
    let copyBuffer = "";
    let activeBlobUrl = "";
    let openSeq = 0;

    const KIND_LABELS = {
      attachment: "附件/图片",
      workspace_out: "工作区成品",
      workspace_file: "工作区文件",
      conclusion: "结论与出处",
    };

    const SPACE_HEADINGS = {
      all: "全部资料",
      pages: "页面与卡片",
      images: "图像与海报",
      docs: "文档与代码",
      conclusions: "结论与出处",
      workspaces: "持续工作区",
    };

    const MEDIA_LABELS = {
      image: "图片",
      html: "HTML",
      markdown: "Markdown",
      text: "文本",
      binary: "二进制",
      conclusion: "结论",
    };

    const fmtBytes = (n) => {
      const v = Number(n || 0);
      if (v >= 1024 * 1024) return `${(v / (1024 * 1024)).toFixed(2)} MB`;
      if (v >= 1024) return `${(v / 1024).toFixed(1)} KB`;
      return `${v} B`;
    };

    const fmtRelTime = (ts) => {
      const n = Number(ts || 0);
      if (!n) return "—";
      const diff = Math.max(0, Math.floor(Date.now() / 1000 - n));
      if (diff < 60) return "刚刚";
      if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
      if (diff < 2592000) return `${Math.floor(diff / 86400)} 天前`;
      const d = new Date(n * 1000);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };

    function fileTypeIcon(mediaKind) {
      if (mediaKind === "html") {
        return `<svg class="out-ico out-ico--page" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.4"/></svg>`;
      }
      if (mediaKind === "image") {
        return `<svg class="out-ico out-ico--img" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="6" r="1.1" fill="currentColor"/><path d="M3 12l3.4-3.4 2.3 2.2 2-2 2.3 3.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;
      }
      if (mediaKind === "conclusion") {
        return `<svg class="out-ico out-ico--con" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7.5H7.2l-3 2.5V11H2.5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 6.5h6M5 8.8h4" stroke="currentColor" stroke-width="1.3"/></svg>`;
      }
      return `<svg class="out-ico out-ico--doc" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h5.5L13 5.5V13.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 8h5M5.5 10.8h4" stroke="currentColor" stroke-width="1.3"/></svg>`;
    }

    const revokeBlob = () => {
      if (activeBlobUrl) {
        try { URL.revokeObjectURL(activeBlobUrl); } catch {}
        activeBlobUrl = "";
      }
    };

    const SAFE_HTML_TAGS = new Set([
      "H1", "H2", "H3", "H4", "P", "UL", "OL", "LI", "PRE", "CODE", "BLOCKQUOTE",
      "TABLE", "THEAD", "TBODY", "TR", "TH", "TD", "STRONG", "B", "EM", "I",
      "HR", "BR", "ARTICLE", "SECTION", "HEADER", "DIV", "SPAN", "A",
    ]);
    const SKIP_HTML_TAGS = new Set([
      "SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "SVG", "IMG",
      "NOSCRIPT", "TEMPLATE", "LINK", "META", "BASE",
    ]);

    function safeHtmlNode(node) {
      if (node.nodeType === 3) return esc(node.nodeValue || "");
      if (node.nodeType !== 1) return "";
      const tag = node.tagName.toUpperCase();
      if (SKIP_HTML_TAGS.has(tag)) return "";
      const inner = [...node.childNodes].map(safeHtmlNode).join("");
      if (!SAFE_HTML_TAGS.has(tag)) return inner;
      if (tag === "BR" || tag === "HR") return `<${tag.toLowerCase()}>`;
      if (tag === "A") {
        const href = String(node.getAttribute("href") || "").trim();
        if (/^https?:\/\//i.test(href)) {
          return `<span>${inner || esc(href)}</span> <span class="mil-tag mono">${esc(href)}</span>`;
        }
        return `<span>${inner}</span>`;
      }
      const lower = tag.toLowerCase();
      return `<${lower}>${inner}</${lower}>`;
    }

    function renderSafeHtml(src) {
      try {
        const doc = new DOMParser().parseFromString(String(src || ""), "text/html");
        return `<div class="out-doc">${safeHtmlNode(doc.body) || `<p class="mil-hint">空白文档</p>`}</div>`;
      } catch {
        return `<pre class="mil-pre">${esc(src || "")}</pre>`;
      }
    }

    function renderMarkdown(src) {
      const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let inCode = false;
      let codeBuf = [];
      let listOpen = false;
      const closeList = () => { if (listOpen) { out.push("</ul>"); listOpen = false; } };
      const inlineMd = (s) => esc(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<span>$1</span> <span class="mil-tag mono">$2</span>');
      for (const line of lines) {
        if (line.trim().startsWith("```")) {
          closeList();
          if (inCode) {
            out.push(`<pre class="mil-pre">${esc(codeBuf.join("\n"))}</pre>`);
            codeBuf = [];
            inCode = false;
          } else {
            inCode = true;
          }
          continue;
        }
        if (inCode) { codeBuf.push(line); continue; }
        const h = line.match(/^(#{1,4})\s+(.+)$/);
        if (h) { closeList(); out.push(`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`); continue; }
        const li = line.match(/^\s*[-*+]\s+(.+)$/);
        if (li) { if (!listOpen) { out.push("<ul>"); listOpen = true; } out.push(`<li>${inlineMd(li[1])}</li>`); continue; }
        closeList();
        if (line.startsWith(">")) { out.push(`<blockquote>${inlineMd(line.replace(/^>\s?/, ""))}</blockquote>`); continue; }
        if (!line.trim()) continue;
        out.push(`<p>${inlineMd(line)}</p>`);
      }
      closeList();
      if (inCode && codeBuf.length) out.push(`<pre class="mil-pre">${esc(codeBuf.join("\n"))}</pre>`);
      return `<div class="out-doc">${out.join("") || `<p class="mil-hint">空白文档</p>`}</div>`;
    }

    function renderFilterButtons() {
      $$("[data-out-space]").forEach((b) => b.setAttribute("aria-current", b.dataset.outSpace === activeSpace ? "page" : "false"));
      $$("[data-out-layout]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.outLayout === outLayout)));
      $$("[data-out-kind]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.outKind === filterKind)));
      $$("[data-out-role]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.outRole === filterRole)));
      $$("[data-out-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.outView === curView)));
      $$("[data-out-chat]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.outChat === filterChat)));
    }

    function spaceMatchesItem(item) {
      if (activeSpace === "pages") return item.media_kind === "html";
      if (activeSpace === "images") return item.media_kind === "image";
      if (activeSpace === "docs") return ["markdown", "text", "binary"].includes(item.media_kind);
      if (activeSpace === "conclusions") return item.kind === "conclusion";
