<div class="m-out-shell lib-shell" id="lib-shell" data-tab="library">
  <aside class="mil-panel m-out-aside lib-aside" aria-label="产物分类与来源筛选">
    <div class="mil-head">
      <div class="mil-head-l">
        <span data-icon-slot="artifacts"></span>
        <div class="mil-row" style="gap:6px;align-items:center">
          <div class="mil-silk">产物</div>
          <button type="button" class="mil-help" data-help="汇总各会话与角色生成的图文、网页简报、研究文档与交付结论，点击卡片即可在右侧预览或下载。" aria-label="产物说明">?</button>
        </div>
      </div>
      <div class="mil-head-r">
        <button type="button" class="mil-key mil-key--sm" id="lib-refresh">刷新</button>
      </div>
    </div>

    <div class="lib-aside-block">
      <input type="search" class="mil-input" id="lib-search" placeholder="搜索产物名称、角色或会话…" aria-label="搜索产物" />
    </div>

    <div class="lib-aside-block">
      <div class="mil-label">类型筛选</div>
      <div class="lib-cat-rail" id="lib-filters" role="group" aria-label="产物类型筛选">
        <button type="button" class="lib-cat-btn" data-lib-filter="all" aria-pressed="true">
          <span class="mil-row" style="gap:8px"><span class="lib-cat-ic" data-lib-cat-ic="all"></span><span>全部产物</span></span>
          <span class="mil-tag num" data-lib-cnt="all">0</span>
        </button>
        <button type="button" class="lib-cat-btn" data-lib-filter="html" aria-pressed="false">
          <span class="mil-row" style="gap:8px"><span class="lib-cat-ic" data-lib-cat-ic="html"></span><span>网页与简报</span></span>
          <span class="mil-tag num" data-lib-cnt="html">0</span>
        </button>
        <button type="button" class="lib-cat-btn" data-lib-filter="image" aria-pressed="false">
          <span class="mil-row" style="gap:8px"><span class="lib-cat-ic" data-lib-cat-ic="image"></span><span>图片与图表</span></span>
          <span class="mil-tag num" data-lib-cnt="image">0</span>
        </button>
        <button type="button" class="lib-cat-btn" data-lib-filter="markdown" aria-pressed="false">
          <span class="mil-row" style="gap:8px"><span class="lib-cat-ic" data-lib-cat-ic="markdown"></span><span>文档与报告</span></span>
          <span class="mil-tag num" data-lib-cnt="markdown">0</span>
        </button>
        <button type="button" class="lib-cat-btn" data-lib-filter="text" aria-pressed="false">
          <span class="mil-row" style="gap:8px"><span class="lib-cat-ic" data-lib-cat-ic="text"></span><span>代码与数据</span></span>
          <span class="mil-tag num" data-lib-cnt="text">0</span>
        </button>
        <button type="button" class="lib-cat-btn" data-lib-filter="conclusion" aria-pressed="false">
          <span class="mil-row" style="gap:8px"><span class="lib-cat-ic" data-lib-cat-ic="conclusion"></span><span>交付结论</span></span>
          <span class="mil-tag num" data-lib-cnt="conclusion">0</span>
        </button>
      </div>
    </div>

    <div class="lib-aside-block" id="lib-chat-filter-wrap" hidden>
      <div class="mil-label">来源会话</div>
      <div class="lib-chat-chips" id="lib-chat-chips"></div>
    </div>
  </aside>

  <main class="mil-panel m-out-main lib-main" aria-label="生成产物列表">
    <section id="lib-gallery-pane">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="artifacts"></span>
          <div class="mil-row" style="gap:6px;align-items:center">
            <div class="mil-silk" id="lib-heading">全部产物</div>
            <span class="mil-tag" id="lib-count-tag">0 项</span>
          </div>
        </div>
      </div>

      <div class="mil-feedback" id="lib-feedback" role="status" aria-live="polite"></div>
      <div class="lib-gallery" id="lib-gallery"></div>
    </section>
  </main>

  <!-- 宽幅产物预览检视器 -->
  <aside class="mil-panel lib-drawer" id="lib-drawer" hidden aria-label="产物详情预览">
    <div class="mil-head">
      <div class="mil-head-l" style="min-width:0;flex:1 1 0">
        <span id="lib-drawer-ic"></span>
        <div style="min-width:0;flex:1 1 0">
          <div class="mil-silk" id="lib-drawer-title" style="overflow-wrap:anywhere">产物详情</div>
          <div class="mil-hint" id="lib-drawer-meta">—</div>
        </div>
      </div>
      <div class="mil-head-r">
        <div class="mil-seg" id="lib-view-seg" role="group" aria-label="预览模式" hidden>
          <button type="button" class="mil-key mil-key--sm" data-lib-view="preview" aria-pressed="true">阅读</button>
          <button type="button" class="mil-key mil-key--sm" data-lib-view="raw" aria-pressed="false">源码</button>
        </div>
        <div class="mil-seg" id="lib-img-fit-seg" role="group" aria-label="图片缩放" hidden>
          <button type="button" class="mil-key mil-key--sm" data-lib-fit="contain" aria-pressed="true">缩览</button>
          <button type="button" class="mil-key mil-key--sm" data-lib-fit="wide" aria-pressed="false">适宽</button>
        </div>
        <button type="button" class="mil-key mil-key--sm" id="lib-drawer-close" aria-label="关闭预览">关闭</button>
      </div>
    </div>

    <div class="lib-drawer-actions">
      <button type="button" class="mil-key mil-key--sm" id="lib-jump-chat">查看生成过程</button>
      <button type="button" class="mil-key mil-key--sm" id="lib-copy">复制内容</button>
      <a class="mil-key mil-key--sm" id="lib-download" download="artifact.txt" hidden>下载</a>
      <button type="button" class="mil-key mil-key--sm mil-key--danger" id="lib-art-delete" hidden>删除产物</button>
    </div>

    <div class="lib-stage" id="lib-stage"></div>
  </aside>
</div>
