  <div class="m-out-shell" id="out-shell">
    <!-- 左栏：资料空间与来源筛选 -->
    <aside class="mil-panel m-out-aside" aria-label="资料空间目录">
      <div class="m-rail-group">
        <div class="m-rail-kicker">资料空间</div>
        <div class="m-rail-nav" role="tablist" aria-label="产物空间分类">
          <button type="button" class="m-rail-btn is-active" data-out-space="all" aria-pressed="true">
            <span class="m-rail-ic" data-m-mod="artifacts" data-m-size="22" aria-hidden="true"></span>
            <span class="m-rail-lbl">全部产物</span>
            <span class="m-rail-cnt num" id="out-st-total">0</span>
          </button>
          <button type="button" class="m-rail-btn" data-out-space="pages" aria-pressed="false">
            <span class="m-rail-ic" data-m-brand="html" data-m-size="20" aria-hidden="true"></span>
            <span class="m-rail-lbl">网页与简报</span>
            <span class="m-rail-cnt num" id="out-st-pages">0</span>
          </button>
          <button type="button" class="m-rail-btn" data-out-space="images" aria-pressed="false">
            <span class="m-rail-ic" data-m-brand="image" data-m-size="20" aria-hidden="true"></span>
            <span class="m-rail-lbl">图片与图表</span>
            <span class="m-rail-cnt num" id="out-st-images">0</span>
          </button>
          <button type="button" class="m-rail-btn" data-out-space="docs" aria-pressed="false">
            <span class="m-rail-ic" data-m-brand="markdown" data-m-size="20" aria-hidden="true"></span>
            <span class="m-rail-lbl">文档与代码</span>
            <span class="m-rail-cnt num" id="out-st-docs">0</span>
          </button>
          <button type="button" class="m-rail-btn" data-out-space="conclusions" aria-pressed="false">
            <span class="m-rail-ic" data-m-mod="journal" data-m-size="22" aria-hidden="true"></span>
            <span class="m-rail-lbl">结论摘要</span>
            <span class="m-rail-cnt num" id="out-st-conclusions">0</span>
          </button>
          <button type="button" class="m-rail-btn" data-out-space="workspaces" aria-pressed="false">
            <span class="m-rail-ic" data-m-mod="workspace" data-m-size="22" aria-hidden="true"></span>
            <span class="m-rail-lbl">持久工作区</span>
            <span class="m-rail-cnt num" id="out-st-ws">0</span>
          </button>
        </div>
      </div>

      <div class="m-rail-group">
        <div class="m-rail-kicker">来源会话</div>
        <select id="out-chat" class="mil-select" aria-label="按来源会话筛选产物">
          <option value="">全部来源会话</option>
        </select>
        <div id="out-chat-chips" class="out-filter-row" aria-label="常用会话快捷筛选"></div>
      </div>

      <div class="m-rail-group">
        <div class="m-rail-kicker">最近产出</div>
        <div id="out-recent-list" class="out-recent-list"></div>
      </div>
    </aside>

    <!-- 中栏：目录筛选列表 + 持久工作区 -->
    <div class="m-out-main">
    <section class="mil-panel m-out-catalog" id="out-catalog-panel" aria-label="产物索引列表">
      <div class="mil-head">
        <div class="mil-head-l">
          <span class="mil-silk" id="out-space-heading">全部产物</span>
          <button type="button" class="mil-help" data-help="可按资料空间、来源会话或产出角色筛选，右侧实时阅读、复制或回到现场" aria-label="查看产物列表说明" aria-expanded="false">?</button>
          <span class="mil-tag num" id="out-visible-count">0 项</span>
        </div>
        <div class="mil-head-r m-out-toolbar">
          <div class="m-search-box">
            <input id="out-search" class="mil-input" placeholder="搜索文件名、内容或会话…" aria-label="搜索产物" />
            <button type="button" class="mil-key mil-key--sm" id="out-search-btn" title="筛选产物">搜索</button>
          </div>
          <div class="m-seg-group" role="group" aria-label="列表布局">
            <button type="button" class="mil-key mil-key--sm" data-out-layout="table" aria-pressed="true">列表</button>
            <button type="button" class="mil-key mil-key--sm" data-out-layout="grid" aria-pressed="false">卡片</button>
          </div>
          <button type="button" class="mil-key mil-key--sm" id="out-refresh-btn" title="重新加载产物列表">刷新</button>
        </div>
      </div>

      <div class="m-filter-bar">
        <div class="out-filter-row" role="group" aria-label="产物类型筛选">
          <button type="button" class="mil-key mil-key--sm" data-out-kind="all" aria-pressed="true">全部来源</button>
          <button type="button" class="mil-key mil-key--sm" data-out-kind="attachment" aria-pressed="false">
            <span>发送附件</span>
            <span class="num" id="out-st-att">0</span>
          </button>
          <button type="button" class="mil-key mil-key--sm" data-out-kind="workspace_out" aria-pressed="false">
            <span>工作区成品</span>
            <span class="num" id="out-st-wsout">0</span>
          </button>
          <button type="button" class="mil-key mil-key--sm" data-out-kind="conclusion" aria-pressed="false">文字结论</button>
        </div>
        <div id="out-role-pills" class="out-filter-row" aria-label="按产出角色筛选"></div>
      </div>

      <div class="out-table-head" id="out-table-head">
        <span>名称与摘要</span>
        <span>来源角色</span>
        <span>大小</span>
        <span>更新</span>
      </div>
      <div id="out-list" class="out-list"></div>
    </section>

    <!-- 工作区目录浏览（全部空间或切换至持久工作区空间时展示） -->
    <section class="mil-panel m-out-ws-panel" id="out-ws-panel" aria-label="持久工作区文件浏览">
      <div class="mil-head">
        <div class="mil-head-l">
          <span class="m-head-ic" data-m-mod="workspace" data-m-size="22" aria-hidden="true"></span>
          <span class="mil-silk">持久工作区</span>
          <button type="button" class="mil-help" data-help="持久工作区保留长期活动的文件树；点击左侧工作区可检视输入、工程源码与产出文件" aria-label="查看工作区说明" aria-expanded="false">?</button>
        </div>
      </div>
      <div class="m-ws-split">
        <div class="m-ws-col">
          <div class="m-ws-col-h">工作区列表</div>
          <div id="workspaces" class="out-ws-list"></div>
        </div>
        <div class="m-ws-col">
          <div class="m-ws-col-h">目录文件</div>
          <div id="workspace-files" class="out-ws-files"></div>
        </div>
      </div>
      <div class="m-ws-preview-wrap">
        <div class="m-ws-col-h">文件内容预览</div>
        <pre id="workspace-content" class="mil-screen m-ws-pre">请先选择工作区及文件。</pre>
      </div>
    </section>
    </div>

    <!-- 右栏：产物阅读与检视器 -->
    <aside class="mil-panel m-out-inspector" id="out-inspector" aria-label="产物详情检视">
      <div class="mil-head m-out-ins-head">
        <div class="mil-head-l">
          <button type="button" class="mob-circle-btn m-mob-only" id="out-mob-back" aria-label="返回产物列表"><span data-m-ctrl="back" data-m-size="16" aria-hidden="true"></span></button>
          <span class="mil-tag" id="out-cur-badge">未选择</span>
          <span class="mil-tag num" id="out-cur-size">—</span>
        </div>
        <div class="mil-head-r m-out-ins-actions">
          <div class="m-seg-group" id="out-img-fit-seg" hidden role="group" aria-label="图片适配方式">
            <button type="button" class="mil-key mil-key--sm" data-img-fit="wide" aria-pressed="true">适宽阅读</button>
            <button type="button" class="mil-key mil-key--sm" data-img-fit="contain" aria-pressed="false">整张缩览</button>
          </div>
          <div class="m-seg-group" role="group" aria-label="内容展示模式">
            <button type="button" class="mil-key mil-key--sm" data-out-view="preview" aria-pressed="true">阅读预览</button>
            <button type="button" class="mil-key mil-key--sm" data-out-view="raw" aria-pressed="false">源码原文</button>
          </div>
        </div>
      </div>

      <div id="out-meta" class="m-out-meta"></div>
      <div id="out-stage" class="m-out-stage">
        <div class="m-empty">请从中间列表选择一项产物以阅读预览或查验细节。</div>
      </div>

      <div class="m-out-foot">
        <button type="button" class="mil-key mil-key--sm" id="out-copy-btn">复制内容</button>
        <button type="button" class="mil-key mil-key--sm" id="out-open-ws-btn" hidden>打开工作区</button>
        <button type="button" class="mil-key mil-key--sm" id="out-more-btn" hidden>完整详情</button>
        <button type="button" class="mil-key mil-key--sm mil-key--on" id="out-goto-now">前往现场</button>
      </div>

      <div id="out-copy-drawer" class="m-copy-drawer" hidden>
        <div class="m-copy-drawer-h">当前环境受限，请直接复制下方内容：</div>
        <textarea id="out-copy-box" class="mil-input mono" rows="4" readonly aria-label="待复制文本"></textarea>
      </div>
    </aside>
  </div>
