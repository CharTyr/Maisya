<div class="m-ab-shell" data-tab="profiles">
  <!-- 移动端无边框裸鱼轮播与首屏摘要卡片（<= 760px 展示） -->
  <section class="m-ab-mob-head" id="ab-mob-head" aria-label="档案快速切换">
    <div class="m-mob-carousel-wrap">
      <button type="button" class="mob-role-step prev" data-mob-step="-1" aria-label="上一个档案">&lt;</button>
      <div class="m-mob-carousel mob-role-carousel" id="mob-role-carousel" role="listbox" aria-label="档案小鱼轮播"></div>
      <button type="button" class="mob-role-step next" data-mob-step="1" aria-label="下一个档案">&gt;</button>
      <div class="mob-role-dots" id="mob-role-dots"></div>
    </div>
    <div class="mil-panel m-mob-role-card1" id="ab-mob-role-card1">
      <div class="m-mob-role-card1-head">
        <span class="m-mob-role-card1-title" id="ab-mob-role-title">—</span>
        <span class="mil-tag" id="ab-mob-role-env">待加载</span>
      </div>
      <div class="m-mob-role-card1-rows">
        <button type="button" class="m-mob-row" data-mob-role-jump="overview">
          <span class="m-mob-row-l"><span class="m-mob-row-ic" data-icon-slot="roles"></span><span>基础档案信息</span></span>
          <span class="m-mob-row-r"><span class="m-mob-row-val" id="mob-val-overview">—</span><span class="m-mob-row-arr">&gt;</span></span>
        </button>
        <button type="button" class="m-mob-row" data-mob-role-jump="advanced">
          <span class="m-mob-row-l"><span class="m-mob-row-ic" data-icon-slot="cpu"></span><span>常规与模型设定</span></span>
          <span class="m-mob-row-r"><span class="m-mob-row-val" id="mob-val-models">—</span><span class="m-mob-row-arr">&gt;</span></span>
        </button>
        <button type="button" class="m-mob-row" data-mob-role-jump="abilities">
          <span class="m-mob-row-l"><span class="m-mob-row-ic" data-icon-slot="skills"></span><span>技能 / 连接器 / 工具集</span></span>
          <span class="m-mob-row-r"><span class="m-mob-row-val" id="mob-val-skills">—</span><span class="m-mob-row-arr">&gt;</span></span>
        </button>
        <button type="button" class="m-mob-row" data-mob-role-jump="fish">
          <span class="m-mob-row-l"><span class="m-mob-row-ic" data-icon-slot="journal"></span><span>小鱼外形定制</span></span>
          <span class="m-mob-row-r"><span class="m-mob-row-val" id="mob-val-fish">—</span><span class="m-mob-row-arr">&gt;</span></span>
        </button>
      </div>
    </div>
  </section>

  <!-- 主工作区：左侧档案列表 + 右侧 Hermes 渐进式定制表单 -->
  <div class="m-ab-studio pr-studio">
    <aside class="mil-panel m-ab-roster" aria-label="档案列表">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="roles"></span>
          <div>
            <div class="mil-silk">能力档案</div>
            <div class="mil-silk-en">PROFILES</div>
          </div>
        </div>
        <div class="mil-head-r">
          <button type="button" class="mil-key mil-key--sm mil-key--hot" id="pr-btn-new">+ 新建档案</button>
        </div>
      </div>

      <div class="pr-roster-tools">
        <input type="search" class="mil-input" id="pr-search" placeholder="筛选档案标识、名称或描述…" aria-label="筛选档案" />
        <div class="mil-row">
          <button type="button" class="mil-key mil-key--sm" id="pr-btn-import">导入 .zip</button>
          <input type="file" id="pr-import-file" accept=".zip,application/zip" hidden />
        </div>
      </div>

      <div class="ab-roster" id="pr-roster" role="listbox" aria-label="全部档案"></div>
    </aside>

    <section class="mil-panel pr-editor" id="pr-editor" aria-label="档案详情编辑">
      <div class="mil-head">
        <div class="mil-head-l">
          <span id="pr-head-fish"></span>
          <div>
            <div class="mil-silk" id="pr-head-title">档案编辑</div>
            <div class="mil-silk-en" id="pr-head-sub">HERMES PROGRESSIVE PROFILE</div>
          </div>
        </div>
        <div class="mil-head-r pr-toolbar">
          <button type="button" class="mil-key mil-key--sm" id="pr-btn-export">导出 .zip</button>
          <button type="button" class="mil-key mil-key--sm mil-key--danger" id="pr-btn-delete">删除自定义档案</button>
          <button type="button" class="mil-key mil-key--sm mil-key--hot" id="pr-btn-save">保存档案</button>
        </div>
      </div>

      <div class="mil-feedback" id="pr-feedback" role="status" aria-live="polite"></div>

      <!-- 顶部小鱼与作用范围选择器 -->
      <div class="role-fish-box" id="pr-fish-box">
        <div class="role-fish-head">
          <div class="fish-preview-box">
            <div id="pr-fish-preview"></div>
            <div>
              <div class="mil-label">形象标识小鱼</div>
              <div class="mil-hint" id="pr-fish-summary">自动按档案名稳定生成像素鱼</div>
            </div>
          </div>
          <div class="mil-seg" id="pr-fish-mode" role="group" aria-label="小鱼外形模式">
            <button type="button" class="mil-key mil-key--sm" data-fish-mode="auto" aria-pressed="true">自动</button>
            <button type="button" class="mil-key mil-key--sm" data-fish-mode="random" aria-pressed="false">随机</button>
            <button type="button" class="mil-key mil-key--sm" data-fish-mode="lock" aria-pressed="false">锁定</button>
          </div>
        </div>
        <div class="fish-drawer" id="pr-fish-drawer" hidden>
          <div class="mil-label">鱼种外形</div>
          <div class="fish-opts" id="pr-fish-species"></div>
          <div class="mil-label">配色</div>
          <div class="fish-swatches" id="pr-fish-colors"></div>
        </div>
      </div>

      <!-- 首屏三项（id / name / description）+ 作用范围 -->
      <div class="pr-primary-grid">
        <div class="mil-field">
          <label class="mil-label" for="pr-id">档案标识 (id)</label>
          <input type="text" class="mil-input mono" id="pr-id" placeholder="例如 coder_review" autocomplete="off" />
        </div>
        <div class="mil-field">
          <label class="mil-label" for="pr-name">显示名称 (name)</label>
          <input type="text" class="mil-input" id="pr-name" placeholder="例如 代码审校助手" autocomplete="off" />
        </div>
        <div class="mil-field pr-span-2">
          <label class="mil-label" for="pr-desc">能力描述 (description)</label>
          <input type="text" class="mil-input" id="pr-desc" placeholder="用一句话说明主脑何时适合调度这个档案" />
        </div>
        <div class="mil-field">
          <label class="mil-label" for="pr-access">可用范围与权限层级</label>
          <select class="mil-select" id="pr-access">
            <option value="all">全部已启用会话（只读通用）</option>
            <option value="admins">仅核验管理员（可含高权服务与密钥）</option>
            <option value="chats">指定会话白名单</option>
          </select>
        </div>
        <div class="mil-field pr-enable-field">
          <span class="mil-label">启用状态</span>
          <label class="mil-switch">
            <input type="checkbox" id="pr-enabled" checked />
            <span class="mil-switch-track"></span>
            <span class="mil-switch-txt" id="pr-enabled-txt">已启用</span>
          </label>
        </div>
        <div class="mil-field pr-span-2" id="pr-chats-wrap" hidden>
          <label class="mil-label" for="pr-allowed-chats">允许会话列表（逗号分隔 &lt;platform&gt;:&lt;group|private&gt;:&lt;id&gt;）</label>
          <input type="text" class="mil-input mono" id="pr-allowed-chats" placeholder="例如 qq:group:100246809" />
        </div>
      </div>

      <!-- 折叠 高级 两栏：常规 | 能力 -->
      <div class="pr-adv-wrap">
        <button type="button" class="mil-key pr-adv-toggle" id="pr-adv-toggle" aria-expanded="false" aria-controls="pr-adv-body">
          <span id="pr-adv-chevron">⌄</span>
          <span>高级设置（常规设定与能力开关）</span>
        </button>

        <div class="pr-adv-body" id="pr-adv-body" hidden>
          <div class="mil-seg pr-subtabs" role="tablist" aria-label="高级分页">
            <button type="button" class="mil-key mil-key--sm" role="tab" data-pr-tab="general" aria-selected="true">常规</button>
            <button type="button" class="mil-key mil-key--sm" role="tab" data-pr-tab="abilities" aria-selected="false">能力</button>
          </div>

          <div class="pr-pane" id="pr-pane-general">
            <div class="mil-grid-2">
              <div class="mil-field">
                <label class="mil-label" for="pr-clone">克隆来源（可选）</label>
                <select class="mil-select" id="pr-clone">
                  <option value="">不从其他档案克隆</option>
                </select>
              </div>
              <div class="mil-field">
                <label class="mil-label" for="pr-model">首选模型</label>
                <select class="mil-select" id="pr-model"></select>
              </div>
              <div class="mil-field">
                <label class="mil-label" for="pr-exec-mode">执行环境 (execution_mode)</label>
                <select class="mil-select" id="pr-exec-mode">
                  <option value="host">宿主机线程（默认）</option>
                  <option value="sandbox">轻量沙箱环境</option>
                </select>
              </div>
              <div class="mil-field">
                <label class="mil-label" for="pr-session-mode">会话方式 (session_mode)</label>
                <select class="mil-select" id="pr-session-mode">
                  <option value="thread">持续线程上下文 (thread)</option>
                  <option value="ephemeral">单次临时任务 (ephemeral)</option>
                  <option value="persistent">固定持久工作区 (persistent)</option>
                </select>
              </div>
            </div>

            <label class="mil-chk">
              <input type="checkbox" id="pr-shared-secrets" checked />
              <span>与主档案共享安全存储与连接器</span>
            </label>

            <div class="mil-field">
              <div class="pr-md-head">
                <label class="mil-label" for="pr-md">档案说明 (PROFILE.md)</label>
                <span class="mil-tag" id="pr-md-count">0 / 150 行</span>
              </div>
              <textarea class="mil-textarea mil-textarea--code m-ab-textarea" id="pr-md" rows="8" placeholder="留空自动生成档案规则与人格提示词；如需手写请控制在 150 行以内"></textarea>
              <div class="mil-hint">留空自动生成；若自定义补充，建议简洁明确并控制在 150 行以内。</div>
            </div>
          </div>

          <div class="pr-pane" id="pr-pane-abilities" hidden>
            <div class="pr-ab-filter">
              <input type="search" class="mil-input" id="pr-ab-search" placeholder="搜索技能、连接器或工具集…" aria-label="搜索能力项" />
              <div class="mil-seg" id="pr-ab-kind" role="group" aria-label="能力分类">
                <button type="button" class="mil-key mil-key--sm" data-ab-kind="all" aria-pressed="true">全部</button>
                <button type="button" class="mil-key mil-key--sm" data-ab-kind="toolsets" aria-pressed="false">5 大工具集</button>
                <button type="button" class="mil-key mil-key--sm" data-ab-kind="skills" aria-pressed="false">技能</button>
                <button type="button" class="mil-key mil-key--sm" data-ab-kind="connectors" aria-pressed="false">连接器</button>
              </div>
            </div>
            <div class="pr-ability-grid" id="pr-ability-cards"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- 移动端底部快捷编辑抽屉 -->
  <div class="m-mob-scrim m-mob-sheet-scrim" id="profiles-mob-scrim" hidden>
    <div class="m-mob-sheet" role="dialog" aria-modal="true" aria-label="档案移动端快捷操作">
      <div class="m-mob-handle" aria-hidden="true"></div>
      <div class="m-mob-sheet-head">
        <strong id="profiles-mob-sheet-title">快速设定</strong>
        <button type="button" class="mil-key mil-key--sm" id="profiles-mob-sheet-close">完成</button>
      </div>
      <div id="profiles-mob-sheet-body" class="pr-mob-sheet-body"></div>
    </div>
  </div>
</div>
