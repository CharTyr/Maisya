          <span class="m-head-ic" data-m-mod="artifacts" data-m-size="22" aria-hidden="true"></span>

          <button type="button" class="mil-help" data-help="导出时自动剥离白名单与会话标识，绝不打包人设、保险箱凭据原文、手账或工作区内容" aria-label="查看配方隐私说明" aria-expanded="false">?</button>
        </div>
      </div>

            <button type="button" class="mil-key mil-key--sm" id="rcp-draft-btn">隐私自检</button>
            <button type="button" class="mil-key mil-key--sm mil-key--hot" id="export">导出配方包</button>
            <a id="rcp-download-link" class="mil-key mil-key--sm" hidden>下载配方文件</a>
          </div>
          <div id="rcp-secret-notes-box" class="m-rcp-box" hidden></div>
          <div id="rcp-draft-box" class="m-rcp-box" hidden></div>
        </div>

        <div class="mil-screen m-rcp-card" id="package-panel">

            <button type="button" class="mil-help" data-help="支持公开仓库地址或压缩包链接，拉取后先执行安全核验与缺件预检再确认落盘" aria-label="查看远程拉取说明" aria-expanded="false">?</button>
          </div>
          <div class="m-inline-row">
            <input id="rcp-url" class="mil-input mono" placeholder="粘贴公开配方地址（https://…）" aria-label="配方远程地址" />
            <button type="button" class="mil-key mil-key--sm" id="rcp-fetch-btn">拉取预览</button>
          </div>
          <div class="m-inline-row">
            <input id="package-file" type="file" accept=".zip,.maisya-recipe.zip" class="mil-input" aria-label="选择配方压缩包" />
          </div>
          <textarea id="package-text" class="mil-input mono" rows="3" placeholder="配方编码文本（导出后自动填入，或在此粘贴）…"></textarea>
          <div class="m-inline-row">
            <button type="button" class="mil-key mil-key--sm" id="copy-package">复制配方文本</button>
            <button type="button" class="mil-key mil-key--sm" id="select-package">全选文本</button>
            <button type="button" class="mil-key mil-key--sm mil-key--on" id="rcp-preview-btn">预检对齐</button>
          </div>

          <div id="rcp-preview-card" class="mil-screen m-rcp-preview" hidden>
            <div id="rcp-pv-source" class="m-rcp-line"></div>
            <div id="rcp-pv-summary" class="m-rcp-line"></div>
            <div id="rcp-pv-alignment" class="m-rcp-line"></div>
            <div id="rcp-pv-warnings" class="m-rcp-warn"></div>
            <div id="rcp-pv-routines-wrap" hidden>
              <label class="ms-field-label" for="rcp-routine-chat">推荐例行绑定会话</label>
              <select id="rcp-routine-chat" class="mil-select" aria-label="推荐例行绑定会话"></select>
              <div id="rcp-pv-routines" class="m-check-grid"></div>
            </div>
            <div class="m-inline-row">
              <label class="m-check-pill"><input type="radio" name="rcp-mode" id="rcp-mode-copy" value="copy" checked /><span>复制为新角色</span></label>
              <label class="m-check-pill"><input type="radio" name="rcp-mode" id="rcp-mode-update" value="update" /><span>更新已有角色</span></label>
              <label class="m-check-pill"><input type="checkbox" id="rcp-install-skills" checked /><span>同步导入技能</span></label>
            </div>
            <div class="m-inline-row">
              <input id="import-id" class="mil-input mono" placeholder="目标角色标识…" aria-label="导入目标角色标识" />
              <button type="button" class="mil-key mil-key--hot" id="rcp-confirm-import">确认导入</button>
              <button type="button" class="mil-key mil-key--sm" id="import" hidden>直接写入</button>
            </div>
          </div>
