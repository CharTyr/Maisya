  <div class="m-mem-shell" id="mem-shell">
    <!-- 左栏：会话选择、三册切换与容量标尺 -->
    <aside class="mil-panel m-mem-aside" aria-label="手账分册与会话选择">
      <div class="m-rail-group">
        <div class="m-rail-kicker">选择会话</div>
        <select id="chat" class="mil-select" aria-label="选择会话手账">
          <option value="">请先选择会话…</option>
        </select>
        <div id="chat-chips" class="out-filter-row" aria-label="快捷切换会话"></div>
      </div>

      <div class="m-rail-group">
        <div class="m-rail-kicker">三册档案</div>
        <div class="m-rail-nav" role="tablist" aria-label="手账三册">
          <button type="button" class="m-rail-btn is-active" data-kind-tab="memory" aria-pressed="true">
            <span class="m-rail-ic" data-m-mod="memory" data-m-size="22" aria-hidden="true"></span>
            <span class="m-rail-lbl">会话备忘</span>
          </button>
          <button type="button" class="m-rail-btn" data-kind-tab="journal" aria-pressed="false">
            <span class="m-rail-ic" data-m-mod="journal" data-m-size="22" aria-hidden="true"></span>
            <span class="m-rail-lbl">自身经历手账</span>
          </button>
          <button type="button" class="m-rail-btn" data-kind-tab="heartbeat" aria-pressed="false">
            <span class="m-rail-ic" data-m-mod="heartbeat" data-m-size="22" aria-hidden="true"></span>
            <span class="m-rail-lbl">主动探索节奏</span>
          </button>
        </div>
        <select id="kind" hidden aria-hidden="true">
          <option value="memory">会话备忘</option>
          <option value="journal">自身经历手账</option>
          <option value="heartbeat">主动探索节奏</option>
        </select>
      </div>

      <div class="m-rail-group">
        <div class="m-rail-kicker">本册边界说明</div>
        <div class="mil-screen m-mem-guide-card">
          <div class="m-mem-guide-title">本会话长期置顶的办事约定</div>
          <p class="m-mem-guide-desc">按会话独立记录称呼、偏好、群规与重要约定；普通对话记忆由宿主系统自动检索关联，不混入当前手账分册。</p>
          <div class="m-meter-wrap">
            <div class="m-meter-head">
              <span>篇幅估算</span>
              <span class="num" id="mem-char-count">0 字</span>
            </div>
            <div class="mil-meter"><i id="mem-meter-bar" style="width:0%"></i></div>
          </div>
        </div>
      </div>

      <div class="m-rail-group" id="mem-quota-card">
        <div class="m-rail-kicker">今日主动额度</div>
        <div class="mil-screen m-quota-box" id="mem-quota-box">
          <span class="m-quota-main num">加载中…</span>
        </div>
      </div>
    </aside>

    <!-- 中栏：手账正文编辑器 -->
    <section class="mil-panel m-mem-editor" aria-label="手账分册编辑器">
      <div class="mil-head">
        <div class="mil-head-l">
          <span class="m-head-ic" data-m-mod="memory" data-m-size="22" aria-hidden="true"></span>
          <span class="mil-silk" id="mem-layer-guide">会话备忘 · MEMORY.md</span>
          <button type="button" class="mil-help" id="mem-layer-help" data-help="按每个会话独立记录称呼、偏好、规则与重要约定；支持版本查看、恢复与实时保存。" aria-label="查看当前分册说明" aria-expanded="false">?</button>
          <span class="mil-tag num" id="version">v0</span>
          <span class="mil-tag mil-tag--warn" id="dirty-tag" hidden>未保存</span>
        </div>
        <div class="mil-head-r m-mem-actions">
          <button type="button" class="mil-key mil-key--sm" id="insert-heartbeat-example" hidden>填入示例模板</button>
          <button type="button" class="mil-key mil-key--sm" id="reload">重新读取</button>
          <select id="history" class="mil-select m-ver-select" aria-label="历史版本"></select>
          <button type="button" class="mil-key mil-key--sm" id="restore">恢复此版本</button>
          <button type="button" class="mil-key mil-key--sm mil-key--hot" id="save">保存手账</button>
        </div>
      </div>

      <div id="draft-panel" class="ms-draft-panel" hidden>
        <div class="ms-draft-banner">检测到远端版本已更新，当前编辑草稿已暂存于下方，请对照后合并保存：</div>
        <textarea id="local-draft" class="mil-input mono" rows="4" readonly aria-label="本地未合并草稿"></textarea>
      </div>

      <textarea id="content" class="mil-input m-mem-textarea" rows="18" placeholder="选择会话或分册后在此编辑内容…"></textarea>
    </section>

    <!-- 右栏：经历检索、计划队列与自动学习回执 -->
    <div class="m-mem-side">
      <section class="mil-panel" aria-label="历史经历搜索">
        <div class="mil-head">
          <div class="mil-head-l">
            <span class="m-head-ic" data-m-mod="journal" data-m-size="20" aria-hidden="true"></span>
            <span class="mil-silk">搜索记忆与经历</span>
          </div>
          <div class="mil-head-r">
            <button type="button" class="mil-key mil-key--sm" id="mem-goto-outputs">查看产物空间</button>
          </div>
        </div>
        <div class="m-search-box m-mem-search">
          <input id="search" class="mil-input" placeholder="搜索会话备忘或自身经历关键词…" aria-label="搜索记忆关键词" />
          <button type="button" class="mil-key mil-key--sm" id="search-button">搜索</button>
        </div>
        <div id="search-results" class="m-card-stack"></div>
        <div class="m-sub-kicker">近期自身经历摘要</div>
        <div id="experiences" class="m-card-stack"></div>
      </section>

      <section class="mil-panel" aria-label="后续唤醒与定时意图">
        <div class="mil-head">
          <div class="mil-head-l">
            <span class="m-head-ic" data-m-mod="routines" data-m-size="20" aria-hidden="true"></span>
            <span class="mil-silk">待唤醒计划</span>
          </div>
        </div>
        <div id="intent-list" class="m-card-stack"></div>
      </section>

      <section class="mil-panel" aria-label="自动经验沉淀笔记">
        <div class="mil-head">
          <div class="mil-head-l">
            <span class="m-head-ic" data-m-mod="skills" data-m-size="20" aria-hidden="true"></span>
            <span class="mil-silk">经验沉淀笔记</span>
          </div>
        </div>
        <div id="learning" class="m-card-stack"></div>
      </section>
    </div>
  </div>
