<div class="columns"><aside class="card maibot-card"><h2>记忆层</h2><label for="chat">会话</label><select id="chat" class="maibot-select"></select><label for="kind">正文</label><select id="kind" class="maibot-select"><option value="memory">会话关系记忆</option><option value="journal">MaiBot 近况</option><option value="heartbeat">主动性与节奏</option></select><p class="hint">会话记忆只在原会话使用。近况来自公开的自身活动，保留七天。</p></aside><div><section class="card maibot-card"><div class="toolbar"><h2>正文</h2><span class="version maibot-badge" id="version"></span></div><label for="content">内容</label><textarea id="content" class="maibot-input" maxlength="16000" spellcheck="false"></textarea><div class="toolbar"><button class="primary maibot-button maibot-button-primary" id="save" type="button">保存修改</button><button id="reload" class="maibot-button" type="button">读取最新</button><select id="history" class="maibot-select" aria-label="历史版本"></select><button id="restore" class="maibot-button" type="button">回滚到所选版本</button></div><details id="draft-panel" hidden><summary>读取最新版本前的草稿</summary><textarea id="local-draft" class="maibot-input" readonly aria-label="保留的本地草稿"></textarea></details><p class="hint">保存会保留版本；读取最新时，原草稿保留在下方。</p></section><section class="card maibot-card"><h2>查找经历</h2><div class="toolbar"><input id="search" class="maibot-input" style="flex:1 1 220px" aria-label="检索关键词" placeholder="地点、发现或线程编号"><button id="search-button" class="maibot-button maibot-button-primary" type="button">检索</button></div><div id="search-results"></div><h2>自身经历</h2><div id="experiences"></div></section><section class="card maibot-card"><h2>持续工作区</h2><div id="workspaces" class="toolbar"></div><div id="workspace-files" class="toolbar"></div><pre id="workspace-content"></pre><details><summary>意图与自动笔记</summary><div id="intent-list"></div><pre id="learning"></pre></details></section></div></div>
