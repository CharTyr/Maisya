<div class="m-set-shell set-v3-shell" data-tab="settings">
  <div class="mil-feedback" id="set-feedback" role="status" aria-live="polite"></div>

  <div class="set-blocks">
    <!-- 1. 会话开关 -->
    <section class="mil-panel set-block" id="set-block-chats">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="roles"></span>
          <div>
            <div class="mil-silk">会话开关</div>
            <div class="mil-silk-en">CHATS &amp; ALLOWLIST</div>
          </div>
        </div>
        <span class="mil-tag mil-tag--ok">管理员私聊自动放行</span>
      </div>

      <div class="mil-hint">已核验管理员在私聊发出的消息会自动放行且支持跨会话调度；普通群聊需在下方显式打开开关。</div>

      <div class="ms-entry-add">
        <input type="text" class="mil-input mono" id="set-chat-input" placeholder="手动添加，例如 qq:group:100246809" aria-label="添加群聊标识" />
        <button type="button" class="mil-key mil-key--sm mil-key--hot" id="set-chat-add">添加会话</button>
      </div>

      <div class="ms-entry-list" id="set-chat-list"></div>
    </section>

    <!-- 2. 权限与管理员 -->
    <section class="mil-panel set-block" id="set-block-auth">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="vault"></span>
          <div>
            <div class="mil-silk">权限与管理员</div>
            <div class="mil-silk-en">TRUST &amp; DUAL-SOURCE ADMINS</div>
          </div>
        </div>
        <button type="button" class="mil-key mil-key--sm" id="set-reopen-onb">重新打开新手引导</button>
      </div>

      <div class="mil-field">
        <label class="mil-label" for="set-perm-mode">默认授权策略</label>
        <select class="mil-select" id="set-perm-mode">
          <option value="ask_risky">仅高危操作确认 (ask_risky · 推荐)</option>
          <option value="autonomous">受托自主执行 (autonomous)</option>
          <option value="always_ask">每次写/命令操作都确认 (always_ask)</option>
        </select>
      </div>

      <div class="set-admins-split">
        <div class="set-subcard">
          <div class="mil-label">宿主授权管理员（只读 · 来自宿主配置）</div>
          <div class="set-admin-badges" id="set-host-admins"></div>
        </div>
        <div class="set-subcard">
          <div class="mil-label">插件内管理员（可增删 · 至少保留一位管理员）</div>
          <div class="mil-feedback mil-feedback--err" id="set-admin-err" role="alert"></div>
          <div class="set-admin-badges" id="set-plugin-admins"></div>
          <div class="ms-entry-add">
            <input type="text" class="mil-input mono" id="set-admin-input" placeholder="输入用户标识，例如 qq:private:10001" aria-label="添加插件管理员" />
            <button type="button" class="mil-key mil-key--sm" id="set-admin-add">加入管理员</button>
          </div>
        </div>
      </div>

      <div class="set-grants-wrap">
        <div class="mil-label">已记住的授权记录 (grants)</div>
        <div class="ms-entry-list" id="set-grants-list"></div>
      </div>
    </section>

    <!-- 3. 安全存储 -->
    <section class="mil-panel set-block" id="set-block-vault">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="vault"></span>
          <div>
            <div class="mil-silk">安全存储</div>
            <div class="mil-silk-en">VAULT METADATA ONLY</div>
          </div>
        </div>
        <span class="mil-tag">只存不显</span>
      </div>

      <div class="mil-hint">列表仅显示凭据句柄、标签与适用域名，永不回显任何秘密明文。</div>
      <div class="ms-entry-list" id="set-vault-list"></div>

      <div class="set-vault-form">
        <div class="mil-grid-2">
          <div class="mil-field">
            <label class="mil-label" for="set-vault-handle">凭据句柄 (handle)</label>
            <input type="text" class="mil-input mono" id="set-vault-handle" placeholder="例如 github_pat" autocomplete="off" />
          </div>
          <div class="mil-field">
            <label class="mil-label" for="set-vault-label">显示名称 (label)</label>
            <input type="text" class="mil-input" id="set-vault-label" placeholder="例如 GitHub 只读令牌" autocomplete="off" />
          </div>
          <div class="mil-field">
            <label class="mil-label" for="set-vault-domain">允许域名 (domain)</label>
            <input type="text" class="mil-input mono" id="set-vault-domain" placeholder="例如 api.github.com" autocomplete="off" />
          </div>
          <div class="mil-field">
            <label class="mil-label" for="set-vault-secret">秘密字段（每行 键=值，写入即清空输入框）</label>
            <textarea class="mil-textarea mil-textarea--code" id="set-vault-secret" rows="2" placeholder="TOKEN=..." autocomplete="off"></textarea>
          </div>
        </div>
        <button type="button" class="mil-key mil-key--sm mil-key--hot" id="set-vault-save">存入安全存储</button>
      </div>
    </section>

    <!-- 4. 基础运行 -->
    <section class="mil-panel set-block" id="set-block-runtime">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="gear"></span>
          <div>
            <div class="mil-silk">基础运行</div>
            <div class="mil-silk-en">RUNTIME &amp; THEME</div>
          </div>
        </div>
        <button type="button" class="mil-key mil-key--sm mil-key--hot" id="set-save-runtime">保存运行设置</button>
      </div>

      <div class="mil-grid-2">
        <div class="mil-field">
          <label class="mil-label" for="set-default-model">默认任务模型槽位</label>
          <select class="mil-select" id="set-default-model"></select>
        </div>

        <div class="mil-field">
          <label class="mil-label" for="set-daily-limit">每日主动搭话上限 (0 - 50)</label>
          <input type="number" class="mil-input num" id="set-daily-limit" min="0" max="50" step="1" value="1" />
        </div>

        <div class="mil-field">
          <label class="mil-label">免打扰时段（HH:MM）</label>
          <div class="mil-row" id="sleep-range-wrap">
            <input type="text" class="mil-input mono" id="set-sleep-start" placeholder="23:30" maxlength="5" aria-label="免打扰开始时间" />
            <span>~</span>
            <input type="text" class="mil-input mono" id="set-sleep-end" placeholder="08:00" maxlength="5" aria-label="免打扰结束时间" />
          </div>
        </div>

        <div class="mil-field">
          <span class="mil-label">轻量 Docker 沙箱</span>
          <label class="mil-switch">
            <input type="checkbox" id="set-sandbox-enabled" />
            <span class="mil-switch-track"></span>
            <span class="mil-switch-txt" id="set-sandbox-txt">未启用</span>
          </label>
        </div>
      </div>

      <div class="mil-field">
        <span class="mil-label">界面主题</span>
        <div class="mil-seg" id="set-theme-seg" role="group" aria-label="界面主题切换">
          <button type="button" class="mil-key mil-key--sm" data-theme-choice="millennium" aria-pressed="true">千禧机械</button>
          <button type="button" class="mil-key mil-key--sm" data-theme-choice="modern" aria-pressed="false">现代极简</button>
          <button type="button" class="mil-key mil-key--sm" data-theme-choice="auto" aria-pressed="false">自动跟随</button>
        </div>
      </div>
    </section>
  </div>
</div>
