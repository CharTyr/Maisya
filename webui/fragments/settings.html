          </div>
          <div class="m-form-row">
            <label class="ms-field-label" for="svc-d-name">服务代号</label>
            <input id="svc-d-name" class="mil-input mono" placeholder="如 github_mcp 或 fetch_api" />
          </div>
          <div class="m-form-row">
            <label class="ms-field-label" for="svc-d-desc">说明描述</label>
            <input id="svc-d-desc" class="mil-input" placeholder="简述该服务的用途" />
          </div>
          <div class="m-form-row">
            <label class="ms-field-label" for="svc-d-cmd">程序与参数（空格或换行分隔）</label>
            <textarea id="svc-d-cmd" class="mil-input mono" rows="2" placeholder="/usr/bin/npx -y @modelcontextprotocol/server-github"></textarea>
          </div>
          <div class="m-form-row" id="svc-d-tools-wrap">
            <label class="ms-field-label" for="svc-d-tools">开放工具名（逗号分隔）</label>
            <input id="svc-d-tools" class="mil-input mono" placeholder="search_issues, read_file" />
          </div>
          <div class="m-form-row" id="svc-d-targets-wrap" hidden>
            <label class="ms-field-label" for="svc-d-targets">允许目标主机（host:port，逗号分隔）</label>
            <input id="svc-d-targets" class="mil-input mono" placeholder="api.github.com:443" />
          </div>
          <div class="m-form-row">
            <label class="ms-field-label" for="svc-d-creds">凭据绑定（环境变量=句柄，每行一项）</label>
            <textarea id="svc-d-creds" class="mil-input mono" rows="2" placeholder="GITHUB_TOKEN=github_pat"></textarea>
          </div>
          <div class="m-cfg-grid">
            <div class="m-form-row">
              <label class="ms-field-label" for="svc-d-access">调用权限</label>
              <select id="svc-d-access" class="mil-select">
                <option value="everyone">普通只读</option>
                <option value="admins">仅核验管理员</option>
              </select>
            </div>
            <div class="m-form-row">
              <label class="ms-field-label" for="svc-d-mem">内存限制（MiB）</label>
              <input id="svc-d-mem" class="mil-input mono" type="number" min="64" max="2048" value="256" />
            </div>
          </div>
          <label class="m-check-pill">
            <input type="checkbox" id="svc-d-readonly" checked />
            <span>限定为只读工具</span>
          </label>
          <div class="m-drawer-actions">
            <button type="button" class="mil-key mil-key--danger" id="svc-d-del">移除</button>
            <button type="button" class="mil-key mil-key--hot" id="svc-d-save">保存服务条目</button>
          </div>
        </div>
      </aside>
    </div>

    <!-- 移动端底部弹层 -->
    <div class="m-mob-scrim m-mob-sheet-scrim" id="settings-mob-scrim" hidden>
      <div class="m-mob-sheet" id="settings-mob-sheet" role="dialog" aria-modal="true" aria-labelledby="mob-sheet-title">
        <div class="m-mob-handle"></div>
        <div class="m-mob-sheet-head">
          <strong id="mob-sheet-title">编辑配置</strong>
          <button type="button" class="mob-circle-btn" id="mob-sheet-close" data-mob-sheet-close aria-label="关闭弹层"><span data-m-ctrl="close" data-m-size="16" aria-hidden="true"></span></button>
        </div>
        <div id="mob-sheet-body" class="m-mob-sheet-body"></div>
      </div>
    </div>
  </div>
