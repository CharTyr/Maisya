<!-- 设置层级切换：默认先看「一般设置」，开发与运维参数收入「高级设置」 -->
<div class="mil-row" style="justify-content:space-between;align-items:center;gap:12px">
  <div class="mil-seg" id="settings-mode-bar" role="tablist" aria-label="设置层级切换">
    <button type="button" class="mil-key" data-settings-mode="general" aria-pressed="true">一般设置</button>
    <button type="button" class="mil-key" data-settings-mode="advanced" aria-pressed="false">高级设置</button>
  </div>
  <span class="mil-hint">宿主管控管理员：<strong id="admins" class="mono">读取中…</strong></span>
</div>

<!-- 一、一般设置（默认直达：外观、开关、群聊、主动分寸与常用定时） -->
<div id="settings-general-view" style="display:flex;flex-direction:column;gap:24px">
  <section class="mil-panel mil-panel--flat">
    <div class="mil-head">
      <div class="mil-head-l"><span class="mil-silk"><span class="mil-silk-en">TALK &amp; PULSE · </span>外观、启用与日常陪伴</span></div>
      <div class="mil-head-r">
        <button class="mil-key mil-key--hot" id="save-settings" type="button">保存设置</button>
        <span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <div id="general-fields" class="set-list"></div>
  </section>

  <section class="mil-panel">
    <div class="mil-head">
      <div class="mil-head-l">
        <span class="mil-silk"><span class="mil-silk-en">SCHEDULER · </span>常用定时安排</span>
        <span class="mil-tag" id="sched-summary-pill">单次 · 60 秒后由 scout 执行</span>
        <button type="button" class="mil-help" data-help="选择一个周期预设后写下需求即可加入计划队列；点选「资讯简报」会自动填入 digest 周期模板（需先在能力页启用 digest）" aria-label="查看定时安排说明" aria-expanded="false">?</button>
      </div>
      <div class="mil-head-r">
        <div class="mil-row">
          <button type="button" class="mil-key mil-key--sm" data-sched-preset="once">单次 60s</button>
          <button type="button" class="mil-key mil-key--sm" data-sched-preset="hourly">每小时巡检</button>
          <button type="button" class="mil-key mil-key--sm" data-sched-preset="daily">每日简报</button>
          <button type="button" class="mil-key mil-key--sm" data-sched-preset="digest">资讯简报（预设）</button>
        </div>
        <span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <div class="mil-grid-2" style="margin-bottom:12px">
      <div class="mil-field">
        <label class="mil-label" for="intent-chat-select">发往哪段会话</label>
        <div class="mil-row" style="gap:6px;flex-wrap:wrap">
          <select id="intent-chat-select" class="mil-select" style="flex:1 1 170px;min-width:0" aria-label="从常用会话选择"></select>
          <input id="intent-chat" class="mil-input mono" style="flex:1 1 180px;min-width:0" list="intent-chat-list" placeholder="如 qq:group:12345678 / self">
        </div>
        <datalist id="intent-chat-list"></datalist>
      </div>
      <div class="mil-field">
        <label class="mil-label" for="intent-profile-select">交给哪个角色执行</label>
        <select id="intent-profile-select" class="mil-select" aria-label="选择执行角色"></select>
      </div>
    </div>
    <div class="mil-field" style="margin-bottom:12px">
      <label class="mil-label" for="intent-prompt">让它定时做什么</label>
      <textarea id="intent-prompt" class="mil-textarea" rows="2" style="min-height:74px" placeholder="例如：每天早上汇总 AI 与设计领域最值得关注的 3 件事"></textarea>
    </div>
    <details id="sched-advanced-details" style="margin-bottom:14px">
      <summary class="mil-label" style="cursor:pointer">更多执行与间隔选项（可选）</summary>
      <div class="mil-grid-2" style="margin-top:12px">
        <div class="mil-field">
          <label class="mil-label" for="intent-profile">自定义角色标识</label>
          <input id="intent-profile" class="mil-input mono" value="scout" placeholder="scout">
        </div>
        <div class="mil-field">
          <label class="mil-label" for="intent-workspace">持久工作区</label>
          <input id="intent-workspace" class="mil-input mono" placeholder="例如 digest">
        </div>
        <div class="mil-field"><label class="mil-label" for="intent-in">首次延迟 (秒)</label><input id="intent-in" class="mil-input mono" type="number" min="1" value="60"></div>
        <div class="mil-field"><label class="mil-label" for="intent-every">重复间隔 (秒，0 为仅执行一次)</label><input id="intent-every" class="mil-input mono" type="number" min="0" value="0"></div>
      </div>
    </details>
    <div class="mil-row" style="justify-content:flex-end">
      <button id="schedule-intent" class="mil-key mil-key--hot" type="button">加入计划队列</button>
    </div>
  </section>

  <section class="mil-panel">
    <div class="mil-head">
      <div class="mil-head-l"><span class="mil-silk"><span class="mil-silk-en">HEALTH · </span>运行状态速览</span></div>
      <div class="mil-head-r">
        <button id="check" class="mil-key mil-key--sm" type="button">刷新检查</button>
        <span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <div id="health" class="ms-health-grid" role="region" aria-label="运行状态速览">正在检查…</div>
  </section>
</div>

<!-- 二、高级设置（开发、运维与容器配额：线程上限、Docker 沙箱、凭据保险箱、MCP/Webhook JSON） -->
<div id="settings-advanced-view" style="display:flex;flex-direction:column;gap:24px" hidden>
  <section class="mil-panel mil-panel--flat">
    <div class="mil-head">
      <div class="mil-head-l"><span class="mil-silk"><span class="mil-silk-en">RUNTIME · </span>高级运行参数与 Docker 沙箱</span></div>
      <div class="mil-head-r">
        <button class="mil-key mil-key--hot" id="save-settings-adv" type="button">保存以上设置</button>
        <span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <div id="advanced-runtime-fields" class="set-list" style="margin-bottom:14px"></div>
    <details class="mil-screen" open>
      <summary class="mil-label" style="cursor:pointer">
        Docker 沙箱隔离环境与资源配额
        <button type="button" class="mil-help" style="margin-left:6px" data-help="只读探索与 HTML 渲染出图无需开启 Docker；仅运行代码或二进制脚本工具才需启用沙箱" aria-label="查看 Docker 沙箱说明" aria-expanded="false">?</button>
      </summary>
      <div id="sandbox-fields" class="set-list" style="margin-top:10px"></div>
    </details>
  </section>

  <div class="mil-grid-2">
    <section class="mil-panel">
      <div class="mil-head">
        <div class="mil-head-l">
          <span class="mil-silk"><span class="mil-silk-en">VAULT · </span>凭据保险箱</span>
          <span class="mil-tag">只进不出</span>
          <button type="button" class="mil-help" data-help="密码保存后加密落盘且永不回显；各服务与模板只引用句柄名，不直接暴露明文密钥" aria-label="查看保险箱说明" aria-expanded="false">?</button>
        </div>
        <div class="mil-head-r"><span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
      </div>
      <div class="mil-screen" style="margin-bottom:14px">
        <div class="mil-label" style="margin-bottom:8px">已登记句柄</div>
        <div id="handles" class="mil-row"></div>
      </div>
      <div class="mil-grid-2" style="margin-bottom:14px">
        <div class="mil-field"><label class="mil-label" for="vault-handle">句柄名</label><input id="vault-handle" class="mil-input mono" autocomplete="off" placeholder="例如 drawing"></div>
        <div class="mil-field"><label class="mil-label" for="vault-value">新凭据值</label><input id="vault-value" class="mil-input mono" type="password" autocomplete="new-password" placeholder="保存后永不回显"></div>
      </div>
      <div class="mil-row">
        <button id="save-vault" class="mil-key mil-key--hot" type="button">保存或替换凭据</button>
        <button id="delete-vault" class="mil-key mil-key--danger" type="button">删除该句柄</button>
      </div>
    </section>

    <section class="mil-panel">
      <div class="mil-head">
        <div class="mil-head-l"><span class="mil-silk"><span class="mil-silk-en">INTENTS · </span>待唤醒意图与自动笔记学习</span></div>
        <div class="mil-head-r"><span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div id="intent-list" class="mil-screen" style="max-height:190px;overflow-y:auto"></div>
        <div id="learning" class="ms-receipt-list"></div>
      </div>
    </section>
  </div>

  <div class="mil-grid-2">
    <section class="mil-panel">
      <div class="mil-head">
        <div class="mil-head-l">
          <span class="mil-silk"><span class="mil-silk-en">SERVICES · </span>MCP 与接口登记 (JSON)</span>
          <button type="button" class="mil-help" data-help="登记可信 MCP 服务、固定执行模板、只读跨插件 API 白名单及 web_provider 别名映射；凭据处只填保险箱句柄" aria-label="查看服务登记说明" aria-expanded="false">?</button>
        </div>
        <div class="mil-head-r">
          <button id="format-services" class="mil-key mil-key--sm" type="button">格式化</button>
          <button id="save-services" class="mil-key mil-key--sm mil-key--hot" type="button">保存服务登记</button>
          <span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
      <div id="service-cards" class="mil-screen" style="margin-bottom:12px"></div>
      <textarea id="service-config" class="mil-textarea mil-textarea--code" rows="12" aria-label="MCP、模板与接口登记" spellcheck="false"></textarea>
    </section>

    <section class="mil-panel">
      <div class="mil-head">
        <div class="mil-head-l">
          <span class="mil-silk"><span class="mil-silk-en">WEBHOOKS · </span>外部 Webhook 事件通道 (JSON)</span>
          <button type="button" class="mil-help" data-help='示例：{"news":{"target":"chat:qq:group:12345678","kind":"proactive","profile":"scout","workspace":"digest","secret_handle":"event_key"}}' aria-label="查看事件通道示例" aria-expanded="false">?</button>
        </div>
        <div class="mil-head-r">
          <button id="format-webhooks" class="mil-key mil-key--sm" type="button">格式化</button>
          <button id="save-webhooks" class="mil-key mil-key--sm mil-key--hot" type="button">保存事件通道</button>
          <span class="mil-vent" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
      <div id="webhook-cards" class="mil-screen" style="margin-bottom:12px"></div>
      <div id="wh-quick-builder" class="ms-builder-box">
        <div class="mil-row" style="justify-content:space-between;gap:6px">
          <span class="mil-label" style="margin:0">快捷添加或更新事件通道</span>
          <button type="button" class="mil-help" data-help="填好通道名与目标会话后点击填入，系统会自动写入下方 JSON 并可在校验后保存生效" aria-label="查看快捷添加说明" aria-expanded="false">?</button>
        </div>
        <div class="mil-grid-2">
          <div class="mil-field"><label class="mil-label" for="wh-b-name">通道代号</label><input id="wh-b-name" class="mil-input mono" placeholder="如 news"></div>
          <div class="mil-field"><label class="mil-label" for="wh-b-target">目标会话 (平台:类型:id)</label><input id="wh-b-target" class="mil-input mono" list="intent-chat-list" placeholder="如 qq:group:12345678"></div>
          <div class="mil-field"><label class="mil-label" for="wh-b-profile">触发角色</label><select id="wh-b-profile" class="mil-select"></select></div>
          <div class="mil-field"><label class="mil-label" for="wh-b-kind">动作模式</label><select id="wh-b-kind" class="mil-select"><option value="proactive">主动通知 / 简报</option><option value="task">后台任务执行</option></select></div>
        </div>
        <div class="mil-row" style="justify-content:space-between;gap:8px;flex-wrap:wrap">
          <input id="wh-b-secret" class="mil-input mono" style="flex:1 1 160px;min-width:0" placeholder="可选凭据句柄，如 event_key">
          <button id="wh-b-add" type="button" class="mil-key mil-key--sm">填入下方配置</button>
        </div>
      </div>
      <textarea id="webhook-config" class="mil-textarea mil-textarea--code" rows="10" aria-label="外部事件通道" spellcheck="false"></textarea>
    </section>
  </div>
</div>
