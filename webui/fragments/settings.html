<div class="m-set-shell set-v3-shell" data-tab="settings">
  <div class="mil-feedback" id="set-feedback" role="status" aria-live="polite"></div>

  <div class="set-blocks">
    <!-- 1. 会话开关 -->
    <section class="mil-panel set-block" id="set-block-chats">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="chats"></span>
          <div class="mil-row" style="gap:6px;align-items:center">
            <div class="mil-silk">会话开关</div>
            <button type="button" class="mil-help" data-help="管理员私聊默认可用；普通群聊与私聊按需添加到下方列表即可，也可以直接在私聊跟 MaiBot 说帮你开启某个群。" aria-label="会话开关说明">?</button>
          </div>
        </div>
        <span class="mil-tag mil-tag--ok">管理员私聊自动放行</span>
      </div>

      <div class="ms-entry-row">
        <div class="ms-entry-meta">
          <strong class="ms-entry-title">启用 Maisya 插件总开关</strong>
          <span class="mil-hint" id="set-plugin-enabled-txt">未启用</span>
        </div>
        <label class="mil-switch">
          <input type="checkbox" id="set-plugin-enabled" aria-label="启用 Maisya 插件总开关" />
          <span class="mil-switch-track"></span>
        </label>
      </div>

      <div class="mil-row" style="justify-content:space-between;align-items:center;margin-top:4px">
        <span class="mil-label" id="set-chat-count-label">已开启会话（0 个）</span>
        <button type="button" class="mil-key mil-key--sm" id="set-open-chat-picker">+ 添加聊天流</button>
      </div>

      <div class="ms-stream-picker" id="set-chat-picker" hidden>
        <search>
          <input type="search" class="mil-input" id="set-chat-cand-search" placeholder="搜索群名、私聊名称或 ID..." aria-label="搜索候选聊天流" autocorrect="off" autocapitalize="none" spellcheck="false" />
        </search>
        <div class="ms-stream-cand-list" id="set-chat-cand-list"></div>
      </div>

      <div class="ms-entry-list" id="set-chat-list"></div>

      <div class="mil-field" style="margin-top:6px">
        <span class="mil-label">手动添加聊天流</span>
        <div class="ms-struct-builder" id="set-chat-builder">
          <select class="mil-select" id="set-chat-plat" aria-label="选择平台">
            <option value="qq">QQ</option>
            <option value="weixin">微信</option>
            <option value="discord">Discord</option>
            <option value="feishu">飞书</option>
            <option value="telegram">Telegram</option>
            <option value="onebot">OneBot</option>
          </select>
          <select class="mil-select" id="set-chat-type" aria-label="选择类型">
            <option value="group">群聊</option>
            <option value="private">私聊</option>
          </select>
          <input type="text" class="mil-input mono" id="set-chat-id" placeholder="输入群号或用户 ID，例如 100246809" aria-label="聊天流群号或用户 ID" autocorrect="off" autocapitalize="none" spellcheck="false" />
          <button type="button" class="mil-key mil-key--sm mil-key--hot" id="set-chat-add">添加会话</button>
        </div>
      </div>
    </section>

    <!-- 2. 权限与管理员 -->
    <section class="mil-panel set-block" id="set-block-auth">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="vault"></span>
          <div class="mil-row" style="gap:6px;align-items:center">
            <div class="mil-silk">权限与管理员</div>
            <button type="button" class="mil-help" data-help="管理宿主与插件管理员名单、高危动作授权策略及已记住授权记录。" aria-label="权限说明">?</button>
          </div>
        </div>
        <button type="button" class="mil-key mil-key--sm" id="set-reopen-onb">重新打开引导</button>
      </div>

      <div class="mil-field">
        <label class="mil-label" for="set-perm-mode">默认授权策略</label>
        <select class="mil-select" id="set-perm-mode">
          <option value="ask_risky">仅高危操作确认</option>
          <option value="autonomous">受托自主执行</option>
          <option value="always_ask">每次操作都确认</option>
        </select>
      </div>

      <div class="set-admins-split">
        <div class="set-subcard">
          <div class="mil-label">宿主授权管理员（只读）</div>
          <div class="set-admin-badges" id="set-host-admins"></div>
        </div>
        <div class="set-subcard">
          <div class="mil-label">插件内管理员（至少保留一位）</div>
          <div class="mil-feedback mil-feedback--err" id="set-admin-err" role="alert"></div>
          <div class="set-admin-badges" id="set-plugin-admins"></div>
          <div class="mil-field" id="set-recent-dms-wrap" hidden>
            <span class="mil-label">最近私聊快捷添加</span>
            <div class="onb-chip-row" id="set-recent-dms"></div>
          </div>
          <div class="ms-struct-builder" id="set-admin-builder">
            <select class="mil-select" id="set-adm-plat" aria-label="管理员平台">
              <option value="qq">QQ</option>
              <option value="weixin">微信</option>
              <option value="discord">Discord</option>
              <option value="feishu">飞书</option>
              <option value="telegram">Telegram</option>
              <option value="onebot">OneBot</option>
            </select>
            <select class="mil-select" id="set-adm-type" aria-label="账号类型">
              <option value="private">私聊账号</option>
            </select>
            <input type="text" class="mil-input mono" id="set-adm-id" placeholder="输入用户 ID，例如 10001" aria-label="管理员用户 ID" autocorrect="off" autocapitalize="none" spellcheck="false" />
            <button type="button" class="mil-key mil-key--sm" id="set-admin-add">加入管理员</button>
          </div>
        </div>
      </div>

      <div class="set-grants-wrap">
        <div class="mil-label">已记住的授权记录</div>
        <div class="ms-entry-list" id="set-grants-list"></div>
      </div>
    </section>

    <!-- 3. 密码保险箱（别名 + 密码极简保存，查看仅显示别名与保存日期） -->
    <section class="mil-panel set-block" id="set-block-vault">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="vault"></span>
          <div class="mil-row" style="gap:6px;align-items:center">
            <div class="mil-silk">密码保险箱</div>
            <button type="button" class="mil-help" data-help="只需保存「别名 + 密码」。当任务需要用到该密码时，直接跟 MaiBot 提到对应的别名即可自动安全注入；点击已保存条目只显示别名和保存日期，不显示密码。" aria-label="密码保险箱说明">?</button>
          </div>
        </div>
        <span class="mil-tag">只存不显</span>
      </div>

      <div class="ms-entry-list" id="set-vault-list"></div>

      <div class="set-subcard" id="set-vault-detail" hidden role="region" aria-label="已保存密码详情"></div>

      <form id="set-vault-form" class="set-vault-form" aria-label="保存新密码">
        <div class="mil-grid-2">
          <div class="mil-field">
            <label class="mil-label" for="set-vault-handle">密码别名</label>
            <input type="text" class="mil-input mono" id="set-vault-handle" name="handle" placeholder="例如 github_pat" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="mil-field">
            <label class="mil-label" for="set-vault-secret">密码内容</label>
            <div class="mil-row" style="gap:6px;flex-wrap:nowrap">
              <input type="password" class="mil-input mono" id="set-vault-secret" name="secret" placeholder="输入密码或令牌（保存后清空）" autocomplete="new-password" style="flex:1 1 0;min-width:0" />
              <button type="button" class="mil-key mil-key--sm" id="set-vault-eye" aria-pressed="false" aria-label="切换显示输入中的密码">显示</button>
            </div>
          </div>
        </div>
        <button type="submit" class="mil-key mil-key--sm mil-key--hot" id="set-vault-save" style="width:fit-content">保存密码</button>
      </form>
    </section>

    <!-- 4. 单一心跳与基础运行 -->
    <section class="mil-panel set-block" id="set-block-runtime">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="heartbeat"></span>
          <div class="mil-row" style="gap:6px;align-items:center">
            <div class="mil-silk">心跳与运行</div>
            <button type="button" class="mil-help" data-help="直观控制闲暇心跳开关、节奏与免打扰时段；更细致的关注主题、简报时间或个性化微调，直接跟 MaiBot 对话沟通即可。" aria-label="心跳与运行设置说明">?</button>
          </div>
        </div>
        <button type="button" class="mil-key mil-key--sm mil-key--hot" id="set-save-runtime">保存运行设置</button>
      </div>

      <div class="set-subcard">
        <div class="mil-row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div class="ms-entry-meta">
            <strong class="ms-entry-title">自主闲暇心跳</strong>
            <span class="mil-hint" id="set-hb-effective-txt">关闭</span>
          </div>
          <div class="mil-row" style="gap:8px;align-items:center;flex-wrap:wrap">
            <div class="mil-seg" id="set-hb-mode-seg" role="group" aria-label="闲暇心跳档位">
              <button type="button" class="mil-key mil-key--sm" data-hb-mode="off" aria-pressed="true">关</button>
              <button type="button" class="mil-key mil-key--sm" data-hb-mode="gentle" aria-pressed="false">克制</button>
              <button type="button" class="mil-key mil-key--sm" data-hb-mode="lively" aria-pressed="false">活泼</button>
            </div>
            <button type="button" class="mil-key mil-key--sm" id="set-goto-heartbeat">编辑心跳说明</button>
          </div>
        </div>
        <div class="mil-grid-2">
          <div class="mil-field">
            <div class="mil-row" style="gap:6px;align-items:center">
              <label class="mil-label" for="set-daily-limit">全局每日主动上限</label>
              <button type="button" class="mil-help" data-help="所有会话每天主动发起搭话的全局总上限（0~50），填 0 表示平时不主动搭话，仅按计划任务响应。" aria-label="全局每日主动上限说明">?</button>
            </div>
            <input type="number" class="mil-input num" id="set-daily-limit" min="0" max="50" step="1" value="3" />
          </div>
          <div class="mil-field">
            <div class="mil-row" style="gap:6px;align-items:center">
              <label class="mil-label" for="set-per-chat-limit">单会话每日主动上限</label>
              <button type="button" class="mil-help" data-help="单个群聊或私聊每天最多收到的主动搭话次数（0~10，同一好友跨标识合并计算）。" aria-label="单会话每日主动上限说明">?</button>
            </div>
            <input type="number" class="mil-input num" id="set-per-chat-limit" min="0" max="10" step="1" value="1" />
          </div>
        </div>
        <div class="mil-field">
          <div class="mil-row" style="gap:6px;align-items:center">
            <label class="mil-label" for="set-sleep-start">免打扰时段</label>
            <button type="button" class="mil-help" data-help="填写起止时间（如 23:30 至 08:00），该时段内暂停无事主动搭话。" aria-label="免打扰时段说明">?</button>
          </div>
          <div class="mil-row" id="sleep-range-wrap" style="flex-wrap:nowrap;align-items:center;gap:6px">
            <input type="text" class="mil-input mono" id="set-sleep-start" placeholder="23:30" maxlength="5" aria-label="免打扰开始时间" style="flex:1 1 0;min-width:0" autocorrect="off" autocapitalize="none" spellcheck="false" />
            <span>~</span>
            <input type="text" class="mil-input mono" id="set-sleep-end" placeholder="08:00" maxlength="5" aria-label="免打扰结束时间" style="flex:1 1 0;min-width:0" autocorrect="off" autocapitalize="none" spellcheck="false" />
          </div>
        </div>
        <details class="mil-field" id="set-hb-adv">
          <summary class="mil-label" style="cursor:pointer">高级覆盖（0 = 跟随档位）</summary>
          <div class="mil-grid-2" style="margin-top:8px">
            <div class="mil-field">
              <div class="mil-row" style="gap:6px;align-items:center">
                <label class="mil-label" for="set-hb-interval">高级：间隔覆盖（分钟）</label>
                <button type="button" class="mil-help" data-help="0 = 跟随档位（克制 180 分钟 / 活泼 90 分钟）；也可填入 30~1440 分钟覆盖基准间隔。" aria-label="心跳间隔覆盖说明">?</button>
              </div>
              <input type="number" class="mil-input num" id="set-hb-interval" min="0" max="1440" step="5" value="0" />
            </div>
            <div class="mil-field">
              <div class="mil-row" style="gap:6px;align-items:center">
                <label class="mil-label" for="set-longing">高级：久违问候安静阈值（小时）</label>
                <button type="button" class="mil-help" data-help="0 = 跟随档位（克制 72 小时 / 活泼 24 小时）；设为 12-720 时，熟人会话安静超过设定小时数后才可能温柔打招呼。" aria-label="久违问候阈值说明">?</button>
              </div>
              <input type="number" class="mil-input num" id="set-longing" min="0" max="720" step="1" value="0" />
            </div>
          </div>
        </details>
      </div>

      <div class="mil-grid-2">
        <div class="mil-field">
          <label class="mil-label" for="set-model-trigger">默认任务模型</label>
          <div class="ms-model-box" id="set-model-box">
            <input type="hidden" id="set-default-model" value="" />
            <button type="button" class="mil-key ms-model-trigger" id="set-model-trigger" aria-expanded="false" aria-controls="set-model-drop">
              <span class="mil-row" style="gap:6px;min-width:0">
                <span class="mono" id="set-model-label">选择模型</span>
                <span class="mil-hint" id="set-model-provider"></span>
                <span class="ms-vis-badge" id="set-model-visual" hidden>视觉</span>
              </span>
              <span class="mil-inline-ic" id="set-model-chev"></span>
            </button>
            <div class="ms-model-dropdown" id="set-model-drop" hidden>
              <div class="ms-model-search-wrap">
                <span class="mil-inline-ic" id="set-model-search-ic"></span>
                <input type="search" id="set-model-search" placeholder="搜索模型名称或厂商..." aria-label="搜索模型名称或厂商" autocorrect="off" autocapitalize="none" spellcheck="false" />
              </div>
              <div class="ms-model-groups" role="listbox" id="set-model-list"></div>
            </div>
          </div>
        </div>

        <div class="mil-field">
          <span class="mil-label">轻量 Docker 沙箱</span>
          <label class="mil-switch">
            <input type="checkbox" id="set-sandbox-enabled" />
            <span class="mil-switch-track"></span>
            <span class="mil-switch-txt" id="set-sandbox-txt">未启用</span>
          </label>
          <div class="mil-hint" id="set-sandbox-hint" hidden></div>
        </div>
      </div>

      <div class="mil-field">
        <span class="mil-label">界面主题</span>
        <div class="mil-seg" id="set-theme-seg" role="group" aria-label="界面主题切换">
          <button type="button" class="mil-key mil-key--sm" data-theme-choice="millennium" aria-pressed="true">千禧机械</button>
          <button type="button" class="mil-key mil-key--sm" data-theme-choice="modern" aria-pressed="false">现代极简</button>
          <button type="button" class="mil-key mil-key--sm" data-theme-choice="auto" aria-pressed="false">自动跟随</button>
        </div>
      </div>
    </section>

    <!-- 5. 一键系统体检 -->
    <section class="mil-panel set-block" id="set-block-doctor">
      <div class="mil-head">
        <div class="mil-head-l">
          <span data-icon-slot="cpu"></span>
          <div class="mil-row" style="gap:6px;align-items:center">
            <div class="mil-silk">系统体检</div>
            <button type="button" class="mil-help" data-help="一次性核查基础白名单、模型可用性与超时统计、公网检索、离线出图渲染、容器沙箱与能力档案绑定，绝不暴露任何密钥。" aria-label="系统体检说明">?</button>
          </div>
        </div>
        <button type="button" class="mil-key mil-key--sm mil-key--hot" id="set-btn-doctor">运行体检</button>
      </div>
      <div class="mil-hint" id="set-doctor-summary">点击右侧「运行体检」实时核查 6 项核心运行状态。</div>
      <div class="ms-entry-list" id="set-doctor-results" hidden></div>
    </section>
  </div>
</div>
