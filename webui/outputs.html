n id=\"select-package\" class=\"mil-key mil-key--sm\" type=\"button\">选中包文本<\/button>\n              <button id=\"rcp-preview-btn\" class=\"mil-key mil-key--sm\" type=\"button\">预览包文本<\/button>\n              <input type=\"file\" id=\"package-file\" accept=\".zip,.tar.gz,.tgz,.tar,application/zip,application/gzip,application/x-tar\" aria-label=\"选择配方压缩包\" style=\"font-size:12.5px;max-width:100%\">\n            <\/div>\n          <\/div>\n\n          <!-- 非破坏性预览卡片（先不落盘，对照本机环境展示就绪/缺件与升级模式） -->\n          <div id=\"rcp-preview-card\" class=\"mil-screen\" style=\"display:flex;flex-direction:column;gap:10px;border-color:var(--mil-line)\" hidden>\n            <div class=\"mil-row\" style=\"justify-content:space-between\">\n              <span class=\"mil-silk\">配方预览与本机对齐检查<\/span>\n              <span class=\"mil-tag mono\" id=\"rcp-pv-source\">—<\/span>\n            <\/div>\n            <div id=\"rcp-pv-summary\"><\/div>\n            <div id=\"rcp-pv-alignment\" style=\"display:flex;flex-direction:column;gap:6px\"><\/div>\n            <div id=\"rcp-pv-warnings\" hidden><\/div>\n            <div id=\"rcp-pv-routines-wrap\" style=\"border-top:1px solid var(--mil-rule);padding-top:10px;display:flex;flex-direction:column;gap:8px\" hidden>\n              <div class=\"mil-row\" style=\"justify-content:space-between\">\n                <span class=\"mil-label\">随包推荐例行工作流<\/span>\n                <select id=\"rcp-routine-chat\" class=\"mil-select mono\" style=\"width:auto;min-width:150px\" aria-label=\"挂载例行任务的目标会话\"><\/select>\n              <\/div>\n              <div id=\"rcp-pv-routines\" style=\"display:flex;flex-direction:column;gap:6px\"><\/div>\n            <\/div>\n            <div style=\"border-top:1px solid var(--mil-rule);padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n              <span class=\"mil-label\">导入策略<\/span>\n              <div class=\"mil-row\">\n                <label class=\"mil-chk\"><input type=\"radio\" name=\"rcp-import-mode\" id=\"rcp-mode-copy\" value=\"copy\" checked><span>另存为新副本<\/span><\/label>\n                <label class=\"mil-chk\"><input type=\"radio\" name=\"rcp-import-mode\" id=\"rcp-mode-update\" value=\"update\"><span>平滑升级同名配方<\/span><\/label>\n                <label class=\"mil-chk\"><input type=\"checkbox\" id=\"rcp-install-skills\" checked><span>同步安装随包技能<\/span><\/label>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"mil-row\">\n            <input id=\"import-id\" class=\"mil-input mono\" style=\"flex:1 1 160px\" placeholder=\"目标角色编号，例如 imported-artist\">\n            <button id=\"rcp-confirm-import\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\" hidden>确认导入配方<\/button>\n            <button id=\"import\" class=\"mil-key mil-key--sm\" type=\"button\">直接导入包文本<\/button>\n          <\/div>\n        <\/div>\n      <\/details>\n    <\/section>\n\n    <!-- 视图 D：宿主环境探测 -->\n    <section class=\"mil-panel mil-panel--flat\" id=\"discovery-panel\" hidden>\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">DISCOVERY · <\/span>宿主环境探测<\/span><\/div>\n        <div class=\"mil-head-r\">\n          <button id=\"refresh-discovery\" class=\"mil-key mil-key--sm\" type=\"button\">刷新宿主信息<\/button>\n          <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n        <\/div>\n      <\/div>\n      <div id=\"discovery-cards\" class=\"mil-screen\" style=\"margin-bottom:12px\"><\/div>\n      <div id=\"discovery-info\" class=\"ms-discovery-grid\">正在读取宿主可用模型与插件…<\/div>\n    <\/section>\n  <\/div>\n<\/div>", "memory": "<div class=\"mil-split\">\n  <!-- 左栏：记忆层与会话切换 -->\n  <aside class=\"mil-panel mil-panel--soft\">\n    <div class=\"mil-head\">\n      <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">LAYERS · <\/span>手账与备忘<\/span><\/div>\n      <div class=\"mil-head-r\"><span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span><\/div>\n    <\/div>\n    <div class=\"mil-field\" style=\"margin-bottom:10px\">\n      <label class=\"mil-label\" for=\"chat\">选择会话<\/label>\n      <select id=\"chat\" class=\"mil-select mono\"><\/select>\n    <\/div>\n    <div id=\"chat-chips\" style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px\"><\/div>\n\n    <div class=\"mil-field\" style=\"margin-bottom:14px\">\n      <label class=\"mil-label\" for=\"kind\">手账分册<\/label>\n      <select id=\"kind\" class=\"mil-select sr-only\">\n        <option value=\"memory\">会话备忘<\/option>\n        <option value=\"journal\">近期手账<\/option>\n        <option value=\"heartbeat\">探索节奏<\/option>\n      <\/select>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <button type=\"button\" class=\"mil-key\" data-kind-tab=\"memory\" aria-pressed=\"true\" style=\"justify-content:flex-start\">会话备忘<\/button>\n        <button type=\"button\" class=\"mil-key\" data-kind-tab=\"journal\" aria-pressed=\"false\" style=\"justify-content:flex-start\">近期手账<\/button>\n        <button type=\"button\" class=\"mil-key\" data-kind-tab=\"heartbeat\" aria-pressed=\"false\" style=\"justify-content:flex-start\">探索节奏<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"mil-screen\">\n      <div class=\"mil-row\" style=\"justify-content:space-between;margin-bottom:8px\">\n        <span class=\"mil-label\">当前文档字数<\/span>\n        <span class=\"num\" style=\"font-size:12.5px\" id=\"mem-char-count\">0 / 16000<\/span>\n      <\/div>\n      <div class=\"mil-meter\"><i id=\"mem-meter-bar\"><\/i><\/div>\n      <div class=\"mil-row\" style=\"justify-content:space-between;margin-top:10px\">\n        <span class=\"mil-tag\">宿主记忆：A_Memorix<\/span>\n        <button type=\"button\" class=\"mil-help\" data-help=\"群友印象与长期聊天记忆由宿主 A_Memorix 自动沉淀；此处仅存放本会话长期置顶的办事约定、近七天后台经历手账与主动探索节奏\" aria-label=\"查看手账与宿主记忆边界说明\" aria-expanded=\"false\">?<\/button>\n      <\/div>\n    <\/div>\n  <\/aside>\n\n  <!-- 右栏：正文编辑 + 检索经历 + 意图队列与笔记回执 -->\n  <div style=\"display:flex;flex-direction:column;gap:20px;min-width:0\">\n    <section class=\"mil-panel mil-panel--flat\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\">\n          <span class=\"mil-silk\"><span class=\"mil-silk-en\">DOCUMENT · <\/span>手账正文<\/span>\n          <span class=\"mil-tag\" id=\"version\">v0<\/span>\n          <span class=\"mil-tag\" id=\"mem-layer-guide\">本会话办事约定<\/span>\n          <button type=\"button\" class=\"mil-help\" id=\"mem-layer-help\" data-help=\"会话备忘（MEMORY.md）按会话严格隔离，仅记录本会话长期置顶的办事约定；群友印象由宿主 A_Memorix 维护。\" aria-label=\"查看当前分册说明\" aria-expanded=\"false\">?<\/button>\n          <span class=\"mil-tag mil-tag--warn\" id=\"dirty-tag\" hidden>未保存<\/span>\n        <\/div>\n        <div class=\"mil-head-r\">\n          <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"insert-heartbeat-example\" hidden>+ 插入公开探索示例<\/button>\n          <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n        <\/div>\n      <\/div>\n      <div class=\"mil-field\" style=\"margin-bottom:14px\">\n        <label class=\"mil-label\" for=\"content\">内容<\/label>\n        <textarea id=\"content\" class=\"mil-textarea\" rows=\"12\" maxlength=\"16000\" spellcheck=\"false\" style=\"line-height:1.75;font-size:14.5px\"><\/textarea>\n      <\/div>\n      <div class=\"mil-row\" style=\"justify-content:space-between\">\n        <div class=\"mil-row\">\n          <button class=\"mil-key mil-key--hot\" id=\"save\" type=\"button\">保存修改<\/button>\n          <button class=\"mil-key\" id=\"reload\" type=\"button\">读取最新<\/button>\n        <\/div>\n        <div class=\"mil-row\">\n          <select id=\"history\" class=\"mil-select\" style=\"width:auto;min-width:150px\" aria-label=\"历史版本\"><\/select>\n          <button class=\"mil-key\" id=\"restore\" type=\"button\">回滚到所选版本<\/button>\n        <\/div>\n      <\/div>\n      <details id=\"draft-panel\" style=\"margin-top:12px\" hidden>\n        <summary class=\"mil-label\" style=\"cursor:pointer\">读取最新版本前保留的本地草稿<\/summary>\n        <textarea id=\"local-draft\" class=\"mil-textarea\" style=\"margin-top:8px\" rows=\"4\" readonly aria-label=\"保留的本地草稿\"><\/textarea>\n      <\/details>\n    <\/section>\n\n    <section class=\"mil-panel\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">RECALL · <\/span>活动与手账检索<\/span><\/div>\n        <div class=\"mil-head-r\">\n          <div class=\"mil-row\" style=\"gap:8px\">\n            <input id=\"search\" class=\"mil-input\" style=\"width:210px\" aria-label=\"检索关键词\" placeholder=\"地点、关键词或线程号\">\n            <button id=\"search-button\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\">检索<\/button>\n          <\/div>\n          <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n        <\/div>\n      <\/div>\n      <div class=\"mil-grid-2\">\n        <div style=\"min-width:0\">\n          <div class=\"mil-label\" style=\"margin-bottom:8px\">手账与备忘命中<\/div>\n          <div id=\"search-results\" class=\"mil-screen\" style=\"min-height:108px;max-height:260px;overflow-y:auto\"><\/div>\n        <\/div>\n        <div style=\"min-width:0\">\n          <div class=\"mil-label\" style=\"margin-bottom:8px\">自身活动经历<\/div>\n          <div id=\"experiences\" class=\"mil-screen\" style=\"min-height:108px;max-height:260px;overflow-y:auto\"><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"mil-panel\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\">\n          <span class=\"mil-silk\"><span class=\"mil-silk-en\">INTENTS · <\/span>待唤醒意图与自动笔记回执<\/span>\n          <button type=\"button\" class=\"mil-help\" data-help=\"展示当前排队中的定时/异步唤醒意图，以及后台线程自动沉淀手账与方法笔记的最近执行回执\" aria-label=\"查看意图与笔记回执说明\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"mil-head-r\">\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-nav=\"outputs\">查看持续工作区 →<\/button>\n          <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n        <\/div>\n      <\/div>\n      <div class=\"mil-grid-2\">\n        <div id=\"intent-list\" class=\"mil-screen\" style=\"max-height:220px;overflow-y:auto\"><\/div>\n        <div id=\"learning\" class=\"ms-receipt-list\" style=\"max-height:220px\"><\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>", "settings": "<!-- 设置层级切换：默认先看「一般设置」，开发与运维参数收入「高级设置」 -->\n<div class=\"mil-row\" style=\"justify-content:space-between;align-items:center;gap:12px\">\n  <div class=\"mil-seg\" id=\"settings-mode-bar\" role=\"tablist\" aria-label=\"设置层级切换\">\n    <button type=\"button\" class=\"mil-key\" data-settings-mode=\"general\" aria-pressed=\"true\">一般设置<\/button>\n    <button type=\"button\" class=\"mil-key\" data-settings-mode=\"advanced\" aria-pressed=\"false\">高级设置<\/button>\n  <\/div>\n  <span class=\"mil-hint\">宿主管控管理员：<strong id=\"admins\" class=\"mono\">读取中…<\/strong><\/span>\n<\/div>\n\n<!-- 一、一般设置（默认直达：外观、开关、群聊、主动分寸与常用定时） -->\n<div id=\"settings-general-view\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <section class=\"mil-panel mil-panel--flat\">\n    <div class=\"mil-head\">\n      <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">TALK &amp; PULSE · <\/span>外观、启用与日常陪伴<\/span><\/div>\n      <div class=\"mil-head-r\">\n        <button class=\"mil-key mil-key--hot\" id=\"save-settings\" type=\"button\">保存设置<\/button>\n        <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n      <\/div>\n    <\/div>\n    <div id=\"general-fields\" class=\"set-list\"><\/div>\n  <\/section>\n\n  <section class=\"mil-panel\">\n    <div class=\"mil-head\">\n      <div class=\"mil-head-l\">\n        <span class=\"mil-silk\"><span class=\"mil-silk-en\">SCHEDULER · <\/span>常用定时安排<\/span>\n        <span class=\"mil-tag\" id=\"sched-summary-pill\">单次 · 60 秒后由 scout 执行<\/span>\n        <button type=\"button\" class=\"mil-help\" data-help=\"选择一个周期预设后写下需求即可加入计划队列；点选「资讯简报」会自动填入 digest 周期模板（需先在能力页启用 digest）\" aria-label=\"查看定时安排说明\" aria-expanded=\"false\">?<\/button>\n      <\/div>\n      <div class=\"mil-head-r\">\n        <div class=\"mil-row\">\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sched-preset=\"once\">单次 60s<\/button>\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sched-preset=\"hourly\">每小时巡检<\/button>\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sched-preset=\"daily\">每日简报<\/button>\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sched-preset=\"digest\">资讯简报（预设）<\/button>\n        <\/div>\n        <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n      <\/div>\n    <\/div>\n    <div class=\"mil-grid-2\" style=\"margin-bottom:12px\">\n      <div class=\"mil-field\">\n        <label class=\"mil-label\" for=\"intent-chat-select\">发往哪段会话<\/label>\n        <div class=\"mil-row\" style=\"gap:6px;flex-wrap:wrap\">\n          <select id=\"intent-chat-select\" class=\"mil-select\" style=\"flex:1 1 170px;min-width:0\" aria-label=\"从常用会话选择\"><\/select>\n          <input id=\"intent-chat\" class=\"mil-input mono\" style=\"flex:1 1 180px;min-width:0\" list=\"intent-chat-list\" placeholder=\"如 qq:group:12345678 / self\">\n        <\/div>\n        <datalist id=\"intent-chat-list\"><\/datalist>\n      <\/div>\n      <div class=\"mil-field\">\n        <label class=\"mil-label\" for=\"intent-profile-select\">交给哪个角色执行<\/label>\n        <select id=\"intent-profile-select\" class=\"mil-select\" aria-label=\"选择执行角色\"><\/select>\n      <\/div>\n    <\/div>\n    <div class=\"mil-field\" style=\"margin-bottom:12px\">\n      <label class=\"mil-label\" for=\"intent-prompt\">让它定时做什么<\/label>\n      <textarea id=\"intent-prompt\" class=\"mil-textarea\" rows=\"2\" style=\"min-height:74px\" placeholder=\"例如：每天早上汇总 AI 与设计领域最值得关注的 3 件事\"><\/textarea>\n    <\/div>\n    <details id=\"sched-advanced-details\" style=\"margin-bottom:14px\">\n      <summary class=\"mil-label\" style=\"cursor:pointer\">更多执行与间隔选项（可选）<\/summary>\n      <div class=\"mil-grid-2\" style=\"margin-top:12px\">\n        <div class=\"mil-field\">\n          <label class=\"mil-label\" for=\"intent-profile\">自定义角色标识<\/label>\n          <input id=\"intent-profile\" class=\"mil-input mono\" value=\"scout\" placeholder=\"scout\">\n        <\/div>\n        <div class=\"mil-field\">\n          <label class=\"mil-label\" for=\"intent-workspace\">持久工作区<\/label>\n          <input id=\"intent-workspace\" class=\"mil-input mono\" placeholder=\"例如 digest\">\n        <\/div>\n        <div class=\"mil-field\"><label class=\"mil-label\" for=\"intent-in\">首次延迟 (秒)<\/label><input id=\"intent-in\" class=\"mil-input mono\" type=\"number\" min=\"1\" value=\"60\"><\/div>\n        <div class=\"mil-field\"><label class=\"mil-label\" for=\"intent-every\">重复间隔 (秒，0 为仅执行一次)<\/label><input id=\"intent-every\" class=\"mil-input mono\" type=\"number\" min=\"0\" value=\"0\"><\/div>\n      <\/div>\n    <\/details>\n    <div class=\"mil-row\" style=\"justify-content:flex-end\">\n      <button id=\"schedule-intent\" class=\"mil-key mil-key--hot\" type=\"button\">加入计划队列<\/button>\n    <\/div>\n  <\/section>\n\n  <section class=\"mil-panel\">\n    <div class=\"mil-head\">\n      <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">HEALTH · <\/span>运行状态速览<\/span><\/div>\n      <div class=\"mil-head-r\">\n        <button id=\"check\" class=\"mil-key mil-key--sm\" type=\"button\">刷新检查<\/button>\n        <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n      <\/div>\n    <\/div>\n    <div id=\"health\" class=\"ms-health-grid\" role=\"region\" aria-label=\"运行状态速览\">正在检查…<\/div>\n  <\/section>\n<\/div>\n\n<!-- 二、高级设置（开发、运维与容器配额：线程上限、Docker 沙箱、凭据保险箱、MCP/Webhook JSON） -->\n<div id=\"settings-advanced-view\" style=\"display:flex;flex-direction:column;gap:24px\" hidden>\n  <section class=\"mil-panel mil-panel--flat\">\n    <div class=\"mil-head\">\n      <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">RUNTIME · <\/span>高级运行参数与 Docker 沙箱<\/span><\/div>\n      <div class=\"mil-head-r\">\n        <button class=\"mil-key mil-key--hot\" id=\"save-settings-adv\" type=\"button\">保存以上设置<\/button>\n        <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n      <\/div>\n    <\/div>\n    <div id=\"advanced-runtime-fields\" class=\"set-list\" style=\"margin-bottom:14px\"><\/div>\n    <details class=\"mil-screen\" open>\n      <summary class=\"mil-label\" style=\"cursor:pointer\">\n        Docker 沙箱隔离环境与资源配额\n        <button type=\"button\" class=\"mil-help\" style=\"margin-left:6px\" data-help=\"只读探索与 HTML 渲染出图无需开启 Docker；仅运行代码或二进制脚本工具才需启用沙箱\" aria-label=\"查看 Docker 沙箱说明\" aria-expanded=\"false\">?<\/button>\n      <\/summary>\n      <div id=\"sandbox-fields\" class=\"set-list\" style=\"margin-top:10px\"><\/div>\n    <\/details>\n  <\/section>\n\n  <div class=\"mil-grid-2\">\n    <section class=\"mil-panel\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\">\n          <span class=\"mil-silk\"><span class=\"mil-silk-en\">VAULT · <\/span>凭据保险箱<\/span>\n          <span class=\"mil-tag\">只进不出<\/span>\n          <button type=\"button\" class=\"mil-help\" data-help=\"密码保存后加密落盘且永不回显；各服务与模板只引用句柄名，不直接暴露明文密钥\" aria-label=\"查看保险箱说明\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"mil-head-r\"><span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span><\/div>\n      <\/div>\n      <div class=\"mil-screen\" style=\"margin-bottom:14px\">\n        <div class=\"mil-label\" style=\"margin-bottom:8px\">已登记句柄<\/div>\n        <div id=\"handles\" class=\"mil-row\"><\/div>\n      <\/div>\n      <div class=\"mil-grid-2\" style=\"margin-bottom:14px\">\n        <div class=\"mil-field\"><label class=\"mil-label\" for=\"vault-handle\">句柄名<\/label><input id=\"vault-handle\" class=\"mil-input mono\" autocomplete=\"off\" placeholder=\"例如 drawing\"><\/div>\n        <div class=\"mil-field\"><label class=\"mil-label\" for=\"vault-value\">新凭据值<\/label><input id=\"vault-value\" class=\"mil-input mono\" type=\"password\" autocomplete=\"new-password\" placeholder=\"保存后永不回显\"><\/div>\n      <\/div>\n      <div class=\"mil-row\">\n        <button id=\"save-vault\" class=\"mil-key mil-key--hot\" type=\"button\">保存或替换凭据<\/button>\n        <button id=\"delete-vault\" class=\"mil-key mil-key--danger\" type=\"button\">删除该句柄<\/button>\n      <\/div>\n    <\/section>\n\n    <section class=\"mil-panel\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\"><span class=\"mil-silk\"><span class=\"mil-silk-en\">INTENTS · <\/span>待唤醒意图与自动笔记学习<\/span><\/div>\n        <div class=\"mil-head-r\"><span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span><\/div>\n      <\/div>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div id=\"intent-list\" class=\"mil-screen\" style=\"max-height:190px;overflow-y:auto\"><\/div>\n        <div id=\"learning\" class=\"ms-receipt-list\"><\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n\n  <div class=\"mil-grid-2\">\n    <section class=\"mil-panel\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\">\n          <span class=\"mil-silk\"><span class=\"mil-silk-en\">SERVICES · <\/span>MCP 与接口登记 (JSON)<\/span>\n          <button type=\"button\" class=\"mil-help\" data-help=\"登记可信 MCP 服务、固定执行模板、只读跨插件 API 白名单及 web_provider 别名映射；凭据处只填保险箱句柄\" aria-label=\"查看服务登记说明\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"mil-head-r\">\n          <button id=\"format-services\" class=\"mil-key mil-key--sm\" type=\"button\">格式化<\/button>\n          <button id=\"save-services\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\">保存服务登记<\/button>\n          <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n        <\/div>\n      <\/div>\n      <div id=\"service-cards\" class=\"mil-screen\" style=\"margin-bottom:12px\"><\/div>\n      <textarea id=\"service-config\" class=\"mil-textarea mil-textarea--code\" rows=\"12\" aria-label=\"MCP、模板与接口登记\" spellcheck=\"false\"><\/textarea>\n    <\/section>\n\n    <section class=\"mil-panel\">\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\">\n          <span class=\"mil-silk\"><span class=\"mil-silk-en\">WEBHOOKS · <\/span>外部 Webhook 事件通道 (JSON)<\/span>\n          <button type=\"button\" class=\"mil-help\" data-help='示例：{\"news\":{\"target\":\"chat:qq:group:12345678\",\"kind\":\"proactive\",\"profile\":\"scout\",\"workspace\":\"digest\",\"secret_handle\":\"event_key\"}}' aria-label=\"查看事件通道示例\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"mil-head-r\">\n          <button id=\"format-webhooks\" class=\"mil-key mil-key--sm\" type=\"button\">格式化<\/button>\n          <button id=\"save-webhooks\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\">保存事件通道<\/button>\n          <span class=\"mil-vent\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n        <\/div>\n      <\/div>\n      <div id=\"webhook-cards\" class=\"mil-screen\" style=\"margin-bottom:12px\"><\/div>\n      <div id=\"wh-quick-builder\" class=\"ms-builder-box\">\n        <div class=\"mil-row\" style=\"justify-content:space-between;gap:6px\">\n          <span class=\"mil-label\" style=\"margin:0\">快捷添加或更新事件通道<\/span>\n          <button type=\"button\" class=\"mil-help\" data-help=\"填好通道名与目标会话后点击填入，系统会自动写入下方 JSON 并可在校验后保存生效\" aria-label=\"查看快捷添加说明\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"mil-grid-2\">\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"wh-b-name\">通道代号<\/label><input id=\"wh-b-name\" class=\"mil-input mono\" placeholder=\"如 news\"><\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"wh-b-target\">目标会话 (平台:类型:id)<\/label><input id=\"wh-b-target\" class=\"mil-input mono\" list=\"intent-chat-list\" placeholder=\"如 qq:group:12345678\"><\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"wh-b-profile\">触发角色<\/label><select id=\"wh-b-profile\" class=\"mil-select\"><\/select><\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"wh-b-kind\">动作模式<\/label><select id=\"wh-b-kind\" class=\"mil-select\"><option value=\"proactive\">主动通知 / 简报<\/option><option value=\"task\">后台任务执行<\/option><\/select><\/div>\n        <\/div>\n        <div class=\"mil-row\" style=\"justify-content:space-between;gap:8px;flex-wrap:wrap\">\n          <input id=\"wh-b-secret\" class=\"mil-input mono\" style=\"flex:1 1 160px;min-width:0\" placeholder=\"可选凭据句柄，如 event_key\">\n          <button id=\"wh-b-add\" type=\"button\" class=\"mil-key mil-key--sm\">填入下方配置<\/button>\n        <\/div>\n      <\/div>\n      <textarea id=\"webhook-config\" class=\"mil-textarea mil-textarea--code\" rows=\"10\" aria-label=\"外部事件通道\" spellcheck=\"false\"><\/textarea>\n    <\/section>\n  <\/div>\n<\/div>"};
  const defaultPage = document.body.dataset.defaultPage || "now";
  let activePage = defaultPage;
  let mgmtAbort = null;
  let userNavigated = false;
  let bootStarted = false;

  function snapFishSeed(snap, roleId) {
    const cards = Array.isArray(snap?.profile_cards) ? snap.profile_cards : [];
    const hit = cards.find((c) => c && c.id === roleId);
    return String(hit?.fish_seed || "");
  }

  const CATS = {
    system: { name: "角色与技能", color: "var(--ctx-system)" },
    memory: { name: "手账备忘", color: "var(--ctx-memory)" },
    user: { name: "输入", color: "var(--ctx-user)" },
    assistant: { name: "推理结论", color: "var(--ctx-assistant)" },
    tool: { name: "工具调用", color: "var(--ctx-tool)" },
    free: { name: "剩余空间", color: "var(--ctx-free)" },
  };
  const STATE_LABEL = {
    active: ["运行中", "mil-tag--hot", "mil-led--run"],
    waiting: ["等待回复", "mil-tag--warn", "mil-led--run"],
    idle: ["待命", "mil-tag--ok", ""],
    closed: ["已结束", "", "mil-led--off"],
  };

  let state = {
    threadId: "",
    chatFilter: "",
    thFilter: "all",
    ctxView: "map",
    ctxCat: "all",
    cursor: 0,
    events: [],
    lastSnap: null,
  };
  const localDrafts = {};
  const rollNums = new WeakMap();
  let queryQueue = Promise.resolve();
  let actionQueue = Promise.resolve();
  let timer = null;
  let lastTriggerTarget = null;
  let lastSnapshotAt = 0;

  // 全局严格保证 query <= 1 并发、总请求 <= 2 并发（避免触及宿主 inflight 上限）
  let inflight = 0;
  const waiters = [];
  async function acquire() {
    if (inflight >= 2) await new Promise((res) => waiters.push(res));
    inflight++;
  }
  function release() {
    inflight--;
    if (waiters.length) waiters.shift()();
  }
  async function withSlot(fn) {
    await acquire();
    try { return await fn(); }
    finally { release(); }
  }
  const enqueueQuery = (fn) => {
    const p = queryQueue.then(() => withSlot(fn), () => withSlot(fn));
    queryQueue = p.catch(() => {});
    return p;
  };
  const enqueueAction = (fn) => {
    const p = actionQueue.then(() => withSlot(fn), () => withSlot(fn));
    actionQueue = p.catch(() => {});
    return p;
  };
  async function hostRpc(op, key, body) {
    return withSlot(async () => {
      const arg = op === "read"
        ? { section: key, payload: JSON.stringify(body || {}) }
        : { action: key, payload: JSON.stringify(body || {}) };
      const res = op === "read" ? await window.maibot.query("read", arg) : await window.maibot.action("write", arg);
      if (res?.ui_style) {
        savedUiStyle = res.ui_style;
        applyTheme();
      }
      return res;
    });
  }
  function hostSay(text, isErr = false) {
    const fb = $('[data-feedback-slot="mgmt"]');
    if (!fb) return;
    fb.textContent = text || "";
    fb.className = `mil-feedback${!text ? "" : isErr ? " mil-feedback--err" : " mil-feedback--ok"}`;
    const led = $("#mgmt-led");
    if (led) led.className = `mil-led${isErr ? " mil-led--bad" : ""}`;
  }
  function setNowFeedback(text, cls = "mil-feedback") {
    const fb = $('[data-feedback-slot="now"]');
    if (!fb) return;
    fb.textContent = text || "";
    fb.className = cls;
  }
  function setDirty(flag) {
    const tag = $("#dirty-tag");
    if (tag) tag.hidden = !flag;
  }
  function versionHistory(history, current) {
    const sel = $("#history");
    if (!sel) return;
    const list = (history || []).slice().reverse();
    sel.innerHTML = list.map((h) => `<option value="${esc(h.version)}">v${esc(h.version)} · ${esc(h.source || "manual")}</option>`).join("");
    if (current !== undefined) sel.value = String(current);
  }
  function helpBtn(text, label = "查看说明") {
    return text ? `<button type="button" class="mil-help" data-help="${esc(text)}" aria-label="${esc(label)}" aria-expanded="false">?</button>` : "";
  }

  let savedUiStyle = "millennium";
  let manualUiStyle = "";
  let lastCtx = null;
  function effectiveUiStyle(hostStyle) {
    const pref = manualUiStyle || savedUiStyle || "millennium";
    if (pref === "auto") return hostStyle === "millennium" ? "millennium" : "maiwork";
    return pref === "maiwork" ? "maiwork" : "millennium";
  }
  function applyTheme(ctx) {
    if (ctx) lastCtx = ctx;
    const c = ctx || lastCtx || window.maibot?.context || {};
    const theme = c.theme === "dark" ? "dark" : "light";
    document.documentElement.className = theme === "dark" ? "dark" : "";
    const styleName = c.dashboardStyle || "millennium";
    document.documentElement.setAttribute("data-dashboard-style", styleName);
    const eff = effectiveUiStyle(styleName);
    document.documentElement.setAttribute("data-ui-style", eff);
    const btn = $("#ui-style-toggle");
    if (btn) {
      btn.textContent = eff === "millennium" ? "千禧机械" : "清朗手账";
      btn.setAttribute("aria-pressed", String(eff === "millennium"));
    }
  }
  applyTheme();
  window.addEventListener("maibot:context", (ev) => applyTheme(ev.detail));
  $("#ui-style-toggle")?.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-ui-style") || "millennium";
    manualUiStyle = cur === "millennium" ? "maiwork" : "millennium";
    applyTheme();
    if (activePage === "now") drawFlowLines();
  });

  const calm = () => window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;

  function fmtTime(ts) {
    if (!ts) return "—";
    const d = new Date(Number(ts) * 1000);
    if (Number.isNaN(d.getTime())) return "—";
    return d.toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  function fmtK(n) {
    const v = Number(n || 0);
    return v >= 1000 ? `${(v / 1000).toFixed(1)}K` : String(v);
  }

  // Aisya roll() 数字平滑跳变（respects reduced-motion）
  function roll(el, target, format = (v) => String(Math.round(v))) {
    if (!el) return;
    const to = Number(target || 0);
    const from = rollNums.get(el) ?? to;
    rollNums.set(el, to);
    if (calm() || from === to) {
      el.textContent = format(to);
      return;
    }
    const t0 = performance.now();
    const dur = 240;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = format(from + (to - from) * eased);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ───────────── 流向图 SVG 连线与信号脉冲（移植 Aisya flight.js） ───────────── */

  let activeTrips = [];
  let flightRaf = 0;

  function drawFlowLines() {
    if (activePage !== "now") return;
    const box = $("#flow");
    const svg = box?.querySelector(":scope > .fl-svg");
    if (!box || !svg) return;
    if (window.innerWidth <= 960) {
      svg.innerHTML = "";
      return;
    }
    const br = box.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${br.width} ${br.height}`);
    const cols = [...box.querySelectorAll(".fl-col")];
    if (cols.length < 4) return;
    const paths = [];
    const anchor = (el, side) => {
      const r = el.getBoundingClientRect();
      return {
        x: (side === "R" ? r.right + 4 : r.left - 6) - br.left,
        y: r.top + r.height / 2 - br.top,
      };
    };
    const curve = (a, b, key, cls) => {
      const dx = Math.max(26, (b.x - a.x) * 0.5);
      const marker = cls.includes("live") ? "url(#fl-arr-run)" : cls.includes("on") ? "url(#fl-arr-on)" : "url(#fl-arr-idle)";
      paths.push(`<path data-k="${esc(key)}" class="${cls}" marker-end="${marker}" d="M${a.x.toFixed(1)},${a.y.toFixed(1)} C${(a.x + dx).toFixed(1)},${a.y.toFixed(1)} ${(b.x - dx).toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}"/>`);
    };
    const chats = [...box.querySelectorAll("#fl-chats .fl-node")];
    const gate = box.querySelector("#fl-gate .fl-node");
    const profs = [...box.querySelectorAll("#fl-profiles .fl-node")];
    const ths = [...box.querySelectorAll("#fl-threads .fl-node")];
    if (gate) {
      const gl = anchor(gate, "L");
      const gr = anchor(gate, "R");
      chats.forEach((c, i) => {
        const cls = [c.classList.contains("on") ? "on" : "", c.classList.contains("run") ? "live" : ""].filter(Boolean).join(" ");
        curve(anchor(c, "R"), gl, `cg-${i}`, cls);
      });
      profs.forEach((p, i) => {
        const cls = [p.classList.contains("on") ? "on" : "", p.classList.contains("run") ? "live" : ""].filter(Boolean).join(" ");
        curve(gr, anchor(p, "L"), `gp-${i}`, cls);
      });
    }
    if (profs.length && ths.length) {
      ths.forEach((t, ti) => {
        const pid = t.dataset.prof;
        const match = profs.find((p) => p.dataset.flowProfile === pid) || profs[0];
        if (match) {
          const cls = [t.classList.contains("on") ? "on" : "", t.classList.contains("run") ? "live" : ""].filter(Boolean).join(" ");
          curve(anchor(match, "R"), anchor(t, "L"), `pt-${ti}`, cls);
        }
      });
    }
    const defs = `<defs>
      <marker id="fl-arr-idle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="var(--mil-lo)" stroke="none"/></marker>
      <marker id="fl-arr-on" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="var(--mil-accent)" stroke="none"/></marker>
      <marker id="fl-arr-run" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="var(--mil-live)" stroke="none"/></marker>
    </defs>`;
    svg.innerHTML = defs + paths.join("");
  }

  function emitFlightPackets() {
    if (activePage !== "now" || calm() || document.hidden || window.innerWidth <= 960) return;
    const box = $("#flow");
    if (!box) return;
    const wires = [...box.querySelectorAll(".fl-svg path.on")];
    if (!wires.length) return;
    let sky = box.querySelector(":scope > .fl-sky");
    if (!sky) {
      sky = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      sky.setAttribute("class", "fl-sky");
      sky.setAttribute("aria-hidden", "true");
      box.append(sky);
    }
    const r = box.getBoundingClientRect();
    sky.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
    wires.slice(0, 3).forEach((w) => {
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("width", "7");
      rect.setAttribute("height", "7");
      rect.setAttribute("rx", "3.5");
      rect.setAttribute("class", "pkt");
      sky.append(rect);
      activeTrips.push({ el: rect, key: w.dataset.k, t0: performance.now(), ms: 720 });
    });
    if (!flightRaf) flightRaf = requestAnimationFrame(tickFlight);
  }

  function tickFlight(now) {
    flightRaf = 0;
    const box = $("#flow");
    activeTrips = activeTrips.filter((tr) => {
      const p = box?.querySelector(`.fl-svg path[data-k="${CSS.escape(tr.key)}"]`);
      const k = Math.min(1, (now - tr.t0) / tr.ms);
      if (!p || !tr.el.isConnected || k >= 1) {
        tr.el.remove();
        return false;
      }
      const pt = p.getPointAtLength(p.getTotalLength() * k);
      tr.el.setAttribute("x", (pt.x - 3.5).toFixed(1));
      tr.el.setAttribute("y", (pt.y - 3.5).toFixed(1));
      return true;
    });
    if (activeTrips.length) flightRaf = requestAnimationFrame(tickFlight);
  }

  function canonChatKey(snap, cid) {
    if (!cid) return "";
    if (cid === "self") return "self";
    const src = snap?.chat_sources?.[cid];
    if (src?.stream_spec) return src.stream_spec;
    return cid;
  }

  function sameChat(snap, a, b) {
    if (!a || !b) return false;
    if (a === b) return true;
    return canonChatKey(snap, a) === canonChatKey(snap, b);
  }

  function chatMeta(snap, cid) {
    const allSrcs = snap?.chat_sources || {};
    let src = allSrcs[cid] || {};
    if (!src.name && cid && cid !== "self") {
      const hit = Object.values(allSrcs).find((s) => s && (s.stream_spec === cid || s.chat_id === cid));
      if (hit) src = hit;
    }
    const spec = src.stream_spec || (cid !== "self" && /^[a-z0-9_-]+:(group|private):/i.test(cid) ? cid : "");
    const name = src.name || (cid === "self" ? "自身活动" : cid);
    const plat = src.platform || (cid === "self" ? "self" : "");
    const typeLabel = src.chat_type === "group" ? "群" : src.chat_type === "private" ? "私" : "";
    const rawAv = String(src.avatar || "");
    const safeAv = /^(https?:\/\/|data:image\/)/i.test(rawAv) && !/["'()\s]/.test(rawAv) ? rawAv : "";
    const mono = (name || cid || "?").trim().slice(0, 1).toUpperCase();
    return { name, spec, plat, typeLabel, safeAv, mono };
  }
  function avatarHtml(meta, small = false) {
    return `<span class="mil-avatar${small ? " mil-avatar--sm" : ""}" aria-hidden="true">${esc(meta.mono)}${meta.safeAv ? `<span class="mil-avatar-img" style="background-image:url('${esc(meta.safeAv)}')"></span>` : ""}</span>`;
  }

  function renderFlow(snap) {
    const threads = snap.threads || [];
    const pulse = snap.pulse || {};
    const cards = snap.profile_cards?.length
      ? snap.profile_cards
      : (snap.profiles || []).map((id) => ({ id, title: id, environment: "readonly", autonomous: true }));
    const dedupMap = new Map();
    const pushChat = (rawCid) => {
      if (!rawCid) return;
      const k = canonChatKey(snap, rawCid);
      const pref = rawCid === "self" ? "self" : (canonChatKey(snap, rawCid) || rawCid);
      if (!dedupMap.has(k) || (rawCid.includes(":") && !dedupMap.get(k).includes(":"))) {
        dedupMap.set(k, pref);
      }
    };
    (snap.enabled_chats || []).forEach(pushChat);
    threads.forEach((t) => { if (t.chat_id) pushChat(t.chat_id); });
    const chats = [...dedupMap.values()].slice(0, 8);
    $("#fl-cnt-chat").textContent = String(chats.length);
    $("#flow-all-chats").setAttribute("aria-pressed", String(!state.chatFilter));
    const filterHint = $("#flow-filter-hint");
    const filterMeta = state.chatFilter ? chatMeta(snap, state.chatFilter) : null;
    const filterLabel = filterMeta?.name || "";
    if (state.chatFilter) {
      filterHint.hidden = false;
      const specSuffix = filterMeta?.spec || state.chatFilter;
      filterHint.textContent = filterLabel === specSuffix
        ? `筛选：${specSuffix}`
        : `筛选：${filterLabel} · ${specSuffix}`;
    } else {
      filterHint.hidden = true;
      filterHint.textContent = "";
    }

    const selThread = threads.find((t) => t.thread_id === state.threadId) || snap.selected || null;
    const selChat = state.chatFilter || selThread?.chat_id || "";
    const selProf = selThread?.profile || "";

    $("#fl-chats").innerHTML = chats.length
      ? chats.map((cid) => {
          const activeHere = threads.some((t) => sameChat(snap, t.chat_id, cid) && (t.state === "active" || t.state === "waiting"));
          const on = sameChat(snap, selChat, cid);
          const m = chatMeta(snap, cid);
          const cnt = threads.filter((t) => sameChat(snap, t.chat_id, cid)).length;
          const sub = [m.plat ? m.plat.toUpperCase() : "", m.typeLabel, `${cnt} 条活动`].filter(Boolean).join(" · ");
          const dispCode = m.spec || cid;
          return `<button type="button" class="fl-node${on ? " on" : ""}${activeHere ? " run" : ""}" data-port-out="1" data-flow-chat="${esc(cid)}" title="${esc(m.name)} (${esc(dispCode)})">
            <span class="fl-node-top">
              <span class="mil-row" style="gap:7px;min-width:0;flex:1;flex-wrap:nowrap">${avatarHtml(m)}<span class="fl-node-name">${esc(m.name)}</span></span>
              <span class="mil-led ${activeHere ? "mil-led--run" : ""}"></span>
            </span>
            <span class="fl-node-sub">${esc(sub)}${m.name !== dispCode ? ` · <span class="mono">${esc(dispCode)}</span>` : ""}</span>
          </button>`;
        }).join("")
      : `<div class="fl-node fl-node--static" data-port-out="1"><span class="fl-node-name">暂无已启用会话</span><span class="fl-node-sub">前往设置添加群或私聊</span></div>`;

    const levelLabelMap = { quiet: "安静", care: "平衡", lively: "活跃" };
    const levelText = levelLabelMap[pulse.proactive_level] || "平衡";
    const dailyPct = pulse.daily_limit ? Math.min(100, Math.round(((pulse.daily_used || 0) / pulse.daily_limit) * 100)) : 0;
    const pendingIntents = snap.stats?.pending_intents ?? (snap.scheduled_intents || []).length;
    const routeTag = pulse.web_provider && pulse.web_provider !== "auto" ? pulse.web_provider : "自动路由";
    $("#fl-gate").innerHTML = `<div class="fl-node fl-node--static fl-node--gate" data-port-in="1" data-port-out="1">
      <span class="fl-node-top"><span class="fl-node-name">MaiBot Planner</span><span class="mil-tag ${pulse.enabled !== false && !pulse.in_sleep ? "mil-tag--ok" : ""}">${pulse.in_sleep ? "休眠" : pulse.enabled !== false ? "调度中" : "停用"}</span></span>
      <span class="fl-node-sub">主脑调度 · 原生开口与工具编排</span>
      <span class="fl-node-sub mono">maisya_agent · 联网 ${esc(routeTag)}</span>
      <div class="fl-subband">
        <span class="fl-node-sub">Pulse (${esc(levelText)}) 主动 ${pulse.daily_used || 0} / ${pulse.daily_limit ?? 1} · 待唤醒 ${pendingIntents}</span>
        <div class="mil-meter" style="margin-top:2px"><i style="width:${dailyPct}%"></i></div>
      </div>
    </div>`;

    const orderedCards = [...cards].sort((a, b) => Number(b.enabled !== false) - Number(a.enabled !== false));
    $("#fl-cnt-prof").textContent = String(cards.filter((p) => p.enabled !== false).length);
    $("#fl-profiles").innerHTML = orderedCards.slice(0, 6).map((p) => {
      const running = threads.some((t) => t.profile === p.id && (t.state === "active" || t.state === "waiting"));
      const selectedMatch = selProf === p.id;
      const isOff = p.enabled === false;
      const cls = isOff ? "mil-fish--off" : "";
      const fish = roleFishHtml(p.id, p.fish_seed || "", 26, running ? {} : { still: true }, cls);
      const chain = Array.isArray(p.model_list) && p.model_list.length ? p.model_list : (p.model_name ? [p.model_name] : []);
      const modelLabel = chain.length ? (chain.length > 1 ? `${chain[0]} +${chain.length - 1}` : chain[0]) : (p.task || "utils");
      return `<button type="button" class="fl-node${selectedMatch ? " on" : ""}${running ? " run" : ""}" style="${isOff ? "opacity:0.65" : ""}" data-port-in="1" data-port-out="1" data-flow-profile="${esc(p.id)}">
        <span class="fl-node-top"><span class="mil-row" style="gap:6px;min-width:0;flex:1;flex-wrap:nowrap">${fish}<span class="fl-node-name">${esc(p.title || p.id)}</span></span><span class="mil-tag ${isOff ? "mil-tag--off" : ""}">${esc(isOff ? "已停用" : (p.environment === "sandbox" ? "沙箱" : "只读"))}</span></span>
        <span class="fl-node-sub mono">${esc(p.id)} · ${esc(modelLabel)}${isOff ? " · 停用" : p.autonomous ? "" : " · 需授权"}</span>
      </button>`;
    }).join("");

    const shownThreads = threads.slice(0, 5);
    $("#fl-cnt-th").textContent = String(threads.length);
    $("#fl-threads").innerHTML = shownThreads.length
      ? shownThreads.map((t) => {
          const st = STATE_LABEL[t.state] || ["未知", "", ""];
          const on = t.thread_id === state.threadId;
          return `<button type="button" class="fl-node${on ? " on" : ""}${t.state === "active" || t.state === "waiting" ? " run" : ""}" data-port-in="1" data-flow-thread="${esc(t.thread_id)}" data-prof="${esc(t.profile)}">
            <span class="fl-node-top"><span class="fl-node-name">${esc(t.title)}</span><span class="mil-led ${st[2]}"></span></span>
            <span class="fl-node-sub">${esc(t.profile)} · ${t.delivered ? "已交付" : st[0]}</span>
          </button>`;
        }).join("")
      : `<div class="fl-node fl-node--static" data-port-in="1"><span class="fl-node-name">暂无线程</span><span class="fl-node-sub">下方可随时发起</span></div>`;

    requestAnimationFrame(() => {
      drawFlowLines();
      if (threads.some((t) => t.state === "active" || t.state === "waiting")) emitFlightPackets();
    });
  }

  /* ───────────── 2. 当前动态条与计数器 ───────────── */

  const EVENT_KIND_LABELS = {
    opened: "发起活动",
    started: "开始处理",
    step: "推理推进",
    tools: "调用工具",
    tool_call: "调用工具",
    tool_result: "工具返回",
    input: "任务输入",
    question: "等待确认",
    redirect: "转向调整",
    note: "补充引导",
    steered: "立即转向",
    completed: "执行完成",
    delivered: "结果交付",
    waiting: "等待回复",
    stopped: "已停止",
    failed: "执行异常",
    error: "执行异常",
    model_fallback: "模型回退",
  };
  const ORIGIN_LABELS = {
    user: "对话触发",
    console: "现场唤醒",
    schedule: "定时触发",
    routine: "周期例行",
    heartbeat: "自主探索",
    webhook: "外部推送",
    intent: "主动意图",
  };

  function formatChatInline(snap, cid) {
    if (!cid || cid === "self") return "自身活动";
    const m = chatMeta(snap, cid);
    const code = m.spec || cid;
    return m.name && m.name !== code ? `${m.name} · ${code}` : code;
  }

  function friendlyEventBrief(snap, e) {
    const raw = String(e?.text || "").trim();
    if (raw.startsWith("{") && raw.endsWith("}")) {
      try {
        const j = JSON.parse(raw);
        if (j && typeof j === "object") {
          const parts = [];
          if (j.origin) parts.push(ORIGIN_LABELS[j.origin] || String(j.origin));
          if (j.owner) {
            parts.push(j.owner === "self" ? "自身记录" : j.owner === "chat" ? "会话线程" : formatChatInline(snap, j.owner));
          }
          const summary = j.summary || j.message || j.reason || j.text;
          if (summary) parts.push(String(summary).replace(/\s+/g, " ").slice(0, 72));
          if (parts.length) return parts.join(" · ");
        }
      } catch {}
    }
    return raw.replace(/\s+/g, " ").slice(0, 90);
  }

  function renderStrip(snap) {
    const sel = snap.selected;
    const threads = snap.threads || [];
    const activeThreads = threads.filter((t) => t.state === "active" || t.state === "waiting");
    const hasErr = Boolean(sel?.result?.error) || (snap.stats?.error_count || 0) > 0;
    const pulse = snap.pulse || {};

    const topLed = $("#top-led");
    const topTxt = $("#top-state-text");
    if (activeThreads.length) {
      topLed.className = "mil-led mil-led--run";
      topTxt.textContent = `${activeThreads.length} 个线程处理中`;
    } else if (pulse.enabled === false) {
      topLed.className = "mil-led mil-led--off";
      topTxt.textContent = "插件未启用";
    } else {
      topLed.className = "mil-led";
      topTxt.textContent = "系统在线";
    }

    if (activeThreads.length) {
      $("#now-headline").textContent = `${activeThreads.length} 个线程正在推进`;
      $("#now-subline").textContent = `${activeThreads[0].title}（${activeThreads[0].profile} · ${formatChatInline(snap, activeThreads[0].chat_id)}）`;
    } else if (sel) {
      const st = STATE_LABEL[sel.state] || ["就绪", "", ""];
      $("#now-headline").textContent = sel.result?.error ? "线程出错" : `最近：${st[0]}`;
      $("#now-subline").textContent = `${threads.find((t) => t.thread_id === sel.thread_id)?.title || sel.thread_id} · ${sel.profile} · ${formatChatInline(snap, sel.chat_id)}`;
    } else {
      $("#now-headline").textContent = "待命";
      $("#now-subline").textContent = "等待群聊触发或由管理员直接发起工作流";
    }

    const badges = [];
    if (sel?.model) badges.push(`<span class="mil-tag">模型 ${esc(sel.model)}</span>`);
    if (sel?.workspace) badges.push(`<span class="mil-tag mil-tag--warn">工作区 ${esc(sel.workspace)}</span>`);
    if (sel?.revision) badges.push(`<span class="mil-tag">第 ${sel.revision} 轮</span>`);
    $("#now-badges").innerHTML = badges.join("");

    const evs = state.events.slice(-3);
    $("#now-steps").innerHTML = evs.length
      ? evs.map((e) => `<li><span class="mil-tag">${esc(EVENT_KIND_LABELS[e.kind] || e.kind)}</span> ${esc(friendlyEventBrief(snap, e))}</li>`).join("")
      : `<li>暂无最新步骤日志</li>`;

    $("#now-leds").innerHTML = `
      <span class="strip-led-item"><span class="mil-led ${pulse.enabled === false ? "mil-led--off" : ""}"></span>插件${pulse.enabled === false ? "未启用" : "已就绪"}</span>
      <span class="strip-led-item"><span class="mil-led ${pulse.in_sleep ? "mil-led--off" : "mil-led"}"></span>${pulse.in_sleep ? "睡眠静默中" : `心跳 ${pulse.heartbeat_interval_minutes || 60}m`}</span>
      <span class="strip-led-item"><span class="mil-led ${hasErr ? "mil-led--bad" : ""}"></span>${hasErr ? "含异常线程" : "链路正常"}</span>
    `;

    const stats = snap.stats || {};
    roll($("#kpi-active"), stats.active_count ?? activeThreads.length);
    roll($("#kpi-today"), stats.today_threads ?? threads.length);

    roll($("#kpi-intent"), stats.pending_intents ?? (snap.scheduled_intents || []).length);
  }

  /* ───────────── 3. 上下文窗口：正方化树图 & 400格晶圆（移植 Aisya ctxmap.js） ───────────── */

  function squarify(items, x, y, w, h) {
    if (!items.length || w <= 0 || h <= 0) return [];
    const total = items.reduce((s, d) => s + d.value, 0);
    if (total <= 0) return [];
    const scaled = items.map((d) => ({ ...d, area: (d.value / total) * w * h }));
    const out = [];
    const worst = (row, side) => {
      if (!row.length || side <= 0) return Infinity;
      const sum = row.reduce((s, d) => s + d.area, 0);
      const s2 = sum * sum;
      const side2 = side * side;
      let maxA = 0, minA = Infinity;
      for (const d of row) { if (d.area > maxA) maxA = d.area; if (d.area < minA) minA = d.area; }
      return Math.max((side2 * maxA) / s2, s2 / (side2 * minA));
    };
    const lay = (row, rx, ry, rw, rh) => {
      const sum = row.reduce((s, d) => s + d.area, 0);
      if (rw >= rh) {
        const cw = rh > 0 ? sum / rh : 0;
        let cy = ry;
        for (const d of row) {
          const ch = cw > 0 ? d.area / cw : 0;
          out.push({ item: d, x: rx, y: cy, w: cw, h: ch });
          cy += ch;
        }
        return { x: rx + cw, y: ry, w: Math.max(0, rw - cw), h: rh };
      }
      const ch = rw > 0 ? sum / rw : 0;
      let cx = rx;
      for (const d of row) {
        const cw = ch > 0 ? d.area / ch : 0;
        out.push({ item: d, x: cx, y: ry, w: cw, h: ch });
        cx += cw;
      }
      return { x: rx, y: ry + ch, w: rw, h: Math.max(0, rh - ch) };
    };
    let rem = [...scaled];
    let row = [];
    let box = { x, y, w, h };
    while (rem.length) {
      const next = rem[0];
      const side = Math.min(box.w, box.h);
      if (!row.length || worst([...row, next], side) <= worst(row, side)) {
        row.push(next);
        rem.shift();
      } else {
        box = lay(row, box.x, box.y, box.w, box.h);
        row = [];
      }
    }
    if (row.length) lay(row, box.x, box.y, box.w, box.h);
    return out;
  }

  let currentCtxItems = [];
  function showCtxTip(ev, text) {
    const tip = $("#cm-tip");
    tip.textContent = text;
    tip.hidden = false;
    tip.style.left = Math.min(window.innerWidth - 290, ev.clientX + 12) + "px";
    tip.style.top = Math.min(window.innerHeight - 70, ev.clientY + 12) + "px";
  }
  function hideCtxTip() {
    $("#cm-tip").hidden = true;
  }

  function openCtxModal(item) {
    if (!item || item.cat === "free") return;
    lastTriggerTarget = document.activeElement;
    const cat = CATS[item.cat] || { name: item.cat };
    $("#ctx-modal-cat").textContent = cat.name;
    $("#ctx-modal-title").textContent = item.label || "上下文片段";
    $("#ctx-modal-chars").textContent = `${item.chars || 0} 字符`;
    $("#ctx-modal-body").textContent = item.preview || "（暂无可展示预览）";
    $("#ctx-scrim").hidden = false;
    $("#ctx-modal-close").focus();
  }
  function closeCtxModal() {
    $("#ctx-scrim").hidden = true;
    if (lastTriggerTarget && typeof lastTriggerTarget.focus === "function") {
      lastTriggerTarget.focus();
    }
  }

  function renderSparkline(points, limit) {
    const svg = $("#ctx-spark");
    const lbl = $("#ctx-spark-label");
    if (!svg) return;
    if (!points || !points.length) {
      svg.innerHTML = `<text x="12" y="52" fill="var(--mil-scope-ink)" font-size="12">暂无历史轮次轨迹</text>`;
      lbl.textContent = "—";
      return;
    }
    const maxV = Math.max(limit || 48000, ...points.map((p) => p.chars || 0), 1);
    const W = 320, H = 96, pad = 10;
    const coords = points.map((p, idx) => {
      const x = points.length === 1 ? W / 2 : pad + (idx / (points.length - 1)) * (W - pad * 2);
      const y = H - pad - ((p.chars || 0) / maxV) * (H - pad * 2);
      return [x, y, p];
    });
    const lineD = coords.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const areaD = `${lineD} L${coords[coords.length - 1][0].toFixed(1)},${H - pad} L${coords[0][0].toFixed(1)},${H - pad} Z`;
    const dots = coords.map(([x, y]) => `<rect x="${(x - 2.5).toFixed(1)}" y="${(y - 2.5).toFixed(1)}" width="5" height="5" fill="#ffd84a" stroke="#181c18" stroke-width="1"/>`).join("");
    svg.innerHTML = `
      <line x1="0" y1="${H - pad}" x2="${W}" y2="${H - pad}" stroke="rgba(143,214,160,0.35)" stroke-width="1"/>
      <path d="${areaD}" fill="rgba(143,214,160,0.16)"/>
      <path d="${lineD}" fill="none" stroke="#8fd6a0" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
      ${dots}
    `;
    const latest = points[points.length - 1];
    lbl.textContent = `${points.length} 轮 · 当前 ${fmtK(latest.chars)}`;
  }

  function renderContext(snap) {
    const threads = snap.threads || [];
    $("#ctx-threads").innerHTML = threads.slice(0, 8).map((t) =>
      `<button type="button" class="mil-key mil-key--sm" data-ctx-thread="${esc(t.thread_id)}" aria-pressed="${String(t.thread_id === state.threadId)}">${esc(t.profile)} · ${esc(String(t.title || t.thread_id).slice(0, 14))}</button>`
    ).join("") || `<span class="mil-hint">暂无可选线程</span>`;

    const sel = snap.selected;
    const ctx = sel?.context;
    if (!sel || !ctx) {
      $("#ctx-readout").textContent = "0 / 48.0K 字符 (0%)";
      $("#ctx-health").textContent = "未选线程";
      $("#ctx-health").className = "mil-tag";
      $("#ctx-meter").className = "mil-meter";
      $("#ctx-meter-bar").style.width = "0%";
      $("#ctx-cats").innerHTML = "";
      $("#ctx-map").innerHTML = `<p class="mil-hint" style="padding:16px">选择一条线程后展示上下文构成。</p>`;
      $("#ctx-grid").innerHTML = "";
      $("#ctx-items").innerHTML = `<p class="mil-hint" style="padding:10px">暂无上下文条目。</p>`;
      renderSparkline([], 48000);
      return;
    }

    const used = Number(ctx.chars || 0);
    const limit = Math.max(Number(ctx.limit || 48000), used, 1);
    const pct = Math.min(100, Math.round((used / limit) * 100));
    $("#ctx-readout").textContent = `已用 ${fmtK(used)} / ${fmtK(limit)} 字符 (${pct}%) · ${ctx.messages || 0} 条消息`;
    $("#ctx-meter-bar").style.width = `${pct}%`;
    $("#ctx-meter").className = `mil-meter${pct >= 88 ? " mil-meter--hot" : pct >= 70 ? " mil-meter--warn" : ""}`;
    const health = $("#ctx-health");
    if (ctx.archived) {
      health.textContent = "已归档早期历史";
      health.className = "mil-tag mil-tag--warn";
    } else if (pct >= 85) {
      health.textContent = "接近归档线";
      health.className = "mil-tag mil-tag--hot";
    } else {
      health.textContent = "健康";
      health.className = "mil-tag mil-tag--ok";
    }

    const roles = ctx.roles || {};
    const catKeys = ["system", "memory", "user", "assistant", "tool"];
    const catTotals = Object.fromEntries(catKeys.map((k) => [k, Number(roles[k] || 0)]));
    $("#ctx-cats").innerHTML = [
      `<button type="button" class="mil-key mil-key--sm" data-ctx-cat="all" aria-pressed="${String(state.ctxCat === "all")}">全部 (${fmtK(used)})</button>`,
      ...catKeys.map((k) => {
        const meta = CATS[k];
        return `<button type="button" class="mil-key mil-key--sm" data-ctx-cat="${k}" aria-pressed="${String(state.ctxCat === k)}"><i class="ctx-swatch" style="background:${meta.color}"></i>${meta.name} ${fmtK(catTotals[k])}</button>`;
      }),
    ].join("");

    // 构造明细列表（如后端未提供 items 时用角色汇总补足）
    let items = Array.isArray(ctx.items) && ctx.items.length ? ctx.items.map((x) => ({ ...x, value: Math.max(1, Number(x.chars || 0)) })) : [];
    if (!items.length) {
      items = catKeys
        .filter((k) => catTotals[k] > 0)
        .map((k) => ({ id: `role-${k}`, cat: k, label: CATS[k].name, chars: catTotals[k], value: catTotals[k], preview: `${CATS[k].name}共占 ${catTotals[k]} 字符。` }));
    }
    currentCtxItems = items;

    const free = Math.max(0, limit - used);
    const mapInputs = [...items];
    if (free > 0 && state.ctxCat === "all") {
      mapInputs.push({ id: "free-space", cat: "free", label: "剩余可用空间", chars: free, value: free, preview: "" });
    }
    const stage = $("#ctx-map");
    const grid = $("#ctx-grid");
    stage.hidden = state.ctxView !== "map";
    grid.hidden = state.ctxView !== "grid";

    if (state.ctxView === "map") {
      const w = stage.clientWidth || 540;
      const h = stage.clientHeight || 220;
      const rects = squarify(mapInputs, 0, 0, w, h);
      stage.innerHTML = rects.map((r, idx) => {
        const dim = state.ctxCat !== "all" && r.item.cat !== state.ctxCat;
        const showTitle = r.w >= 54 && r.h >= 24;
        return `<button type="button" class="cm-tile${dim ? " dim" : ""}" data-cat="${esc(r.item.cat)}" data-item-idx="${idx}" style="left:${r.x.toFixed(1)}px;top:${r.y.toFixed(1)}px;width:${r.w.toFixed(1)}px;height:${r.h.toFixed(1)}px" title="${esc(r.item.label)}: ${r.item.chars} 字符">${showTitle ? `<b>${esc(r.item.label)}</b><span>${fmtK(r.item.chars)}</span>` : ""}</button>`;
      }).join("");
      stage._rectItems = rects.map((r) => r.item);
    } else {
      // 400 格晶圆分配
      const cells = [];
      const alloc = [];
      let totalCells = 0;
      mapInputs.forEach((it, idx) => {
        const count = it.cat === "free" ? 0 : Math.max(1, Math.round((it.value / limit) * 400));
        alloc.push({ it, idx, count });
        totalCells += count;
      });
      while (totalCells > 400) {
        const largest = alloc.reduce((a, b) => (b.count > a.count ? b : a));
        if (largest.count <= 1) break;
        largest.count--;
        totalCells--;
      }
      alloc.forEach(({ it, idx, count }) => {
        for (let i = 0; i < count; i++) cells.push({ cat: it.cat, label: it.label, chars: it.chars, idx });
      });
      while (cells.length < 400) cells.push({ cat: "free", label: "剩余空间", chars: free, idx: -1 });
      grid.innerHTML = cells.map((c) => {
        const dim = state.ctxCat !== "all" && c.cat !== state.ctxCat;
        return `<button type="button" class="cm-cell${dim ? " dim" : ""}" data-cat="${esc(c.cat)}" data-cell-idx="${c.idx}" aria-label="${esc(c.label)}"></button>`;
      }).join("");
      grid._mapInputs = mapInputs;
    }

    const filteredRows = items
      .filter((it) => state.ctxCat === "all" || it.cat === state.ctxCat)
      .sort((a, b) => b.chars - a.chars);
    const maxItemChars = Math.max(1, ...filteredRows.map((x) => x.chars));
    $("#ctx-items").innerHTML = filteredRows.length
      ? filteredRows.map((it) => {
          const origIdx = currentCtxItems.indexOf(it);
          const pctW = Math.max(3, Math.round((it.chars / maxItemChars) * 100));
          return `<button type="button" class="ci-row" data-ci-idx="${origIdx}">
            <span class="ctx-swatch" style="background:${(CATS[it.cat] || CATS.free).color}"></span>
            <span class="ci-row-name">${esc(it.label)}</span>
            <span class="num" style="font-size:11.5px">${it.chars}</span>
            <span class="ci-row-bar"><i style="width:${pctW}%"></i></span>
          </button>`;
        }).join("")
      : `<p class="mil-hint" style="padding:10px">该分类下暂无上下文段落。</p>`;

    renderSparkline(ctx.history_points || [], limit);
  }

  /* ───────────── 4. 处理记录列表与线程详情工作台 ───────────── */

  function renderThreads(snap) {
    const all = snap.threads || [];
    const list = all.filter((t) => {
      if (state.thFilter === "active") return t.state === "active" || t.state === "waiting";
      if (state.thFilter === "delivered") return Boolean(t.delivered);
      if (state.thFilter === "error") return Boolean(t.has_error);
      return true;
    });
    const host = $("#threads");
    if (!list.length) {
      const hasFilter = Boolean(state.chatFilter || state.thFilter !== "all");
      host.innerHTML = `<div style="padding:10px">
        <p class="mil-hint">${all.length || hasFilter ? "当前筛选下暂无线程。" : "还没有任何线程记录，可在下方发起第一个工作流。"}</p>
        ${hasFilter ? `<button type="button" class="mil-key mil-key--sm" id="clear-th-filters" style="margin-top:8px">清除筛选</button>` : ""}
      </div>`;
      return;
    }
    host.innerHTML = list.map((t) => {
      const st = STATE_LABEL[t.state] || ["未知", "", ""];
      const on = t.thread_id === state.threadId;
      const cm = chatMeta(snap, t.chat_id);
      const chatDisp = cm.name && cm.name !== (cm.spec || t.chat_id) ? `${cm.name} (${cm.spec || t.chat_id})` : (cm.spec || t.chat_id);
      return `<button type="button" class="thread-row${on ? " on" : ""}" data-thread="${esc(t.thread_id)}">
        <div class="mil-row" style="justify-content:space-between;gap:6px">
          <div class="mil-row" style="gap:6px;min-width:0">
            <span class="mil-led ${t.has_error ? "mil-led--bad" : st[2]}"></span>
            <span class="thread-title">${esc(t.title || t.thread_id)}</span>
          </div>
          <span class="mil-tag ${st[1]}">${st[0]}</span>
        </div>
        ${t.excerpt ? `<div class="thread-excerpt">${esc(t.excerpt)}</div>` : ""}
        <div class="mil-row" style="justify-content:space-between;font-size:11px">
          <span class="mil-row mono" style="gap:5px">${roleFishHtml(t.profile, snapFishSeed(snap, t.profile), 18, (t.state === "active" || t.state === "waiting") ? {} : { still: true })}<span>${esc(t.profile)} · ${esc(chatDisp)}${t.workspace ? ` · 空间:${esc(t.workspace)}` : ""}</span></span>
          <span class="num">${t.delivered ? "已交付 · " : ""}${fmtTime(t.updated)}</span>
        </div>
      </button>`;
    }).join("");
  }

  function renderInspector(snap) {
    const sel = snap.selected;
    const stopBtn = $("#stop");
    const insFish = $("#ins-role-fish");
    if (!sel) {
      if (insFish) { insFish.hidden = true; insFish.innerHTML = ""; insFish.className = "mil-fish mil-fish--well"; }
      $("#title").textContent = "等待选择线程";
      $("#meta").textContent = "点击上方流向图或左侧处理记录中的任意线程查看详情。";
      $("#ins-state-tag").textContent = "—";
      $("#ins-state-tag").className = "mil-tag";
      $("#ins-meta-tags").innerHTML = "";
      $("#result-box").hidden = true;
      $("#deliveries-row").innerHTML = "";
      $("#events").innerHTML = `<p class="mil-hint">选择一条线程后展示执行事件。</p>`;
      stopBtn.disabled = true;
      return;
    }

    const rowSummary = (snap.threads || []).find((t) => t.thread_id === sel.thread_id);
    const st = STATE_LABEL[sel.state] || [sel.state || "未知", "", ""];
    if (insFish) {
      const card = (snap.profile_cards || []).find((c) => c && c.id === sel.profile);
      const isOff = card?.enabled === false;
      const swimming = sel.state === "active" || sel.state === "waiting";
      insFish.hidden = false;
      insFish.className = `mil-fish mil-fish--well${isOff ? " mil-fish--off" : ""}`;
      insFish.innerHTML = fishSvg(roleFishSeed(sel.profile, snapFishSeed(snap, sel.profile)), {
        size: 38,
        still: !swimming || isOff,
        label: "",
      });
    }
    $("#title").textContent = rowSummary?.title || sel.thread_id;
    const selCm = chatMeta(snap, sel.chat_id);
    const selChatDisp = selCm.name && selCm.name !== (selCm.spec || sel.chat_id)
      ? `${selCm.name} · ${selCm.spec || sel.chat_id}`
      : (selCm.spec || sel.chat_id);

    const resBox = $("#result-box");

    } else {
      resBox.hidden = true;
    }

    const tags = [];

    });
    (snap.intents || []).forEach((i) => {
      tags.push(`<span class="mil-tag">回接 R${i.revision}: ${i.consumed ? "已回接" : "待回接"} (${esc(i.wake_status || "queued")})</span>`);
    });
    (snap.scheduled_intents || []).slice(0, 3).forEach((si) => {
      tags.push(`<span class="mil-tag mil-tag--warn">计划 [${esc(si.kind)}] ${esc(si.reason)}</span>`);
    });

  function renderEventsAppend(newEvents) {
    const box = $("#events");
    if (!newEvents?.length) {
      if (!state.events.length) box.innerHTML = `<p class="mil-hint">暂无步骤事件。</p>`;
      return;
    }
    if (box.querySelector(".mil-hint")) box.innerHTML = "";
    newEvents.forEach((ev) => {
      const det = document.createElement("details");
      det.className = "ev-det";
      det.setAttribute("data-event", String(ev.seq));
      const sum = document.createElement("summary");
      const kindTxt = EVENT_KIND_LABELS[ev.kind] || ev.kind;
      sum.innerHTML = `<span class="mil-tag">#${ev.seq} ${esc(kindTxt)}</span><span class="num">R${ev.revision} · ${fmtTime(ev.at)}</span>`;
      const pre = document.createElement("pre");
      pre.textContent = ev.text || "";
      det.append(sum, pre);
      if (ev.truncated) {
        const readBtn = document.createElement("button");
        readBtn.type = "button";
        readBtn.className = "mil-key mil-key--sm";
        readBtn.textContent = "读取完整步骤";
        let fullText = "";
        let nextOffset = 0;
        const loadMore = () => enqueueQuery(async () => {
          const r = await window.maibot.query("event", {
            thread_id: state.threadId,
            event_seq: ev.seq,
            offset: nextOffset,
          });
          if (!r?.success) {
            setNowFeedback(r?.error || "读取完整步骤失败", "mil-feedback mil-feedback--err");
            return;
          }
          fullText += r.text || "";
          pre.textContent = fullText;
          nextOffset = r.next_offset;
          if (nextOffset === null || nextOffset === undefined) {
            readBtn.remove();
          } else {
            readBtn.textContent = "继续读取";
          }
        });
        readBtn.onclick = loadMore;
        det.append(readBtn);
      }
      box.append(det);
    });
  }

  function switchThread(nextId) {
    const prevId = state.threadId;
    const msgEl = $("#message");
    if (prevId && msgEl) localDrafts[prevId] = msgEl.value;
    state.threadId = nextId || "";
    state.cursor = 0;
    state.events = [];
    const evEl = $("#events");
    if (evEl) evEl.innerHTML = `<p class="mil-hint">正在读取步骤…</p>`;
    if (msgEl) msgEl.value = localDrafts[state.threadId] || "";
    setNowFeedback("", "mil-feedback");
  }

  async function refresh(reset = false) {
    if (activePage !== "now") return;
    const reqThread = state.threadId;

  function initHelpPopovers() {
    const pop = $("#mil-help-pop");
    if (!pop) return () => {};
    let activeBtn = null;
    let pinnedBtn = null;
    const closePop = () => {
      if (activeBtn) activeBtn.setAttribute("aria-expanded", "false");
      activeBtn = null;
      pinnedBtn = null;
      pop.hidden = true;
    };
    const openPop = (btn) => {
      const text = btn?.dataset?.help || "";
      if (!text) return;
      if (activeBtn && activeBtn !== btn) activeBtn.setAttribute("aria-expanded", "false");
      activeBtn = btn;
      activeBtn.setAttribute("aria-expanded", "true");
      pop.textContent = text;
      pop.hidden = false;
      const r = btn.getBoundingClientRect();
      const pw = pop.offsetWidth || 260;
      const ph = pop.offsetHeight || 60;
      const left = Math.max(12, Math.min(window.innerWidth - pw - 12, r.left + r.width / 2 - pw / 2));
      const top = r.bottom + ph + 16 < window.innerHeight ? r.bottom + 8 : Math.max(12, r.top - ph - 8);
      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
    };
    document.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".mil-help");
      if (btn) {
        if (btn.closest("summary")) ev.preventDefault();
        ev.stopPropagation();
        if (pinnedBtn === btn && !pop.hidden) closePop();
        else { pinnedBtn = btn; openPop(btn); }
        return;
      }
      if (!pop.hidden && !ev.target.closest("#mil-help-pop")) closePop();
    });
    document.addEventListener("mouseenter", (ev) => {
      const btn = ev.target.closest?.(".mil-help");
      if (btn && !pinnedBtn && window.matchMedia?.("(hover: hover)").matches) openPop(btn);
    }, true);
    document.addEventListener("mouseleave", (ev) => {
      const btn = ev.target.closest?.(".mil-help");
      if (btn && activeBtn === btn && pinnedBtn !== btn && window.matchMedia?.("(hover: hover)").matches) closePop();
    }, true);
    document.addEventListener("focusin", (ev) => {
      const btn = ev.target.closest?.(".mil-help");
      if (btn && !pinnedBtn) openPop(btn);
    });
    document.addEventListener("focusout", (ev) => {
      const btn = ev.target.closest?.(".mil-help");
      if (btn && activeBtn === btn && pinnedBtn !== btn) closePop();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && !pop.hidden) closePop();
    });
    window.addEventListener("scroll", () => {
      if (pop.hidden) return;
      if (pinnedBtn?.isConnected) openPop(pinnedBtn);
      else closePop();
    }, { passive: true });
    window.addEventListener("resize", closePop);
    return closePop;
  }

      }));

    function parseSimpleToml(text) {
      const out = { tools: [], skills: [], allow_chats: [], allow_users: [] };
      String(text || "").split(/\r?\n/).forEach((line) => {
        const clean = line.trim();
        if (!clean || clean.startsWith("#")) return;
        const eq = clean.indexOf("=");
        if (eq < 1) return;
        const k = clean.slice(0, eq).trim();
        let v = clean.slice(eq + 1).trim();
        try {
          if (v.startsWith("[") && v.endsWith("]")) out[k] = JSON.parse(v);
          else if (v.startsWith("\"") && v.endsWith("\"")) out[k] = JSON.parse(v);
          else if (v === "true" || v === "false") out[k] = v === "true";
          else if (!Number.isNaN(Number(v))) out[k] = Number(v);
          else out[k] = v;
        } catch {
          // 复杂多行 TOML 保留在源码框中，不强行覆盖
        }
      });
      return out;
    }

    function getTomlModelChain(parsed) {
      const p = parsed || parseSimpleToml($("#content").value);
      const out = [];
      const push = (val) => {
        const s = String(val || "").trim();
        if (s && !out.includes(s)) out.push(s);
      };
      push(p.model_name || p.model || "");
      if (Array.isArray(p.fallback_models)) p.fallback_models.forEach(push);
      if (Array.isArray(p.model_list)) p.model_list.forEach(push);
      return out.slice(0, 16);
    }

    function hostModelEntries() {
      const seen = new Set();
      const rows = [];
      const add = (entry) => {
        if (!entry) return;
        const name = typeof entry === "string" ? entry.trim() : String(entry.name || "").trim();
        if (!name || seen.has(name)) return;
        seen.add(name);
        rows.push({
          name,
          provider: typeof entry === "object" ? String(entry.provider || "").trim() : "",
          identifier: typeof entry === "object" ? String(entry.identifier || "").trim() : "",
          source: typeof entry === "object" ? String(entry.source || "") : "",
          assigned_tasks: typeof entry === "object" && Array.isArray(entry.assigned_tasks) ? entry.assigned_tasks : [],
        });
      };
      (catalog.model_catalog || []).forEach(add);
      (catalog.available_models || []).forEach(add);
      return rows;
    }

    function applyModelChainToToml(chain) {
      const clean = [];
      (chain || []).forEach((item) => {

      writeTomlKey("model", null);
      writeTomlKey("model_list", null);
      renderModelChainEditor();
    }

      const name = String(rawName || "").trim();
      if (!name) return false;
      const cur = getTomlModelChain();

      if (hit?.name && hit.name !== spec && (!m || hit.name !== m[3])) return hit.name;
      return m ? `${m[1].toUpperCase()} ${m[2].toLowerCase() === "group" ? "群聊" : "私聊"} · ${m[3]}` : spec;

    function normalizeScopeChat(raw) {
      const s = String(raw || "").trim();
      if (!s) return "";

      const known = Array.isArray(catalog.known_chats) ? catalog.known_chats : [];
      const hit = known.find((k) => k.chat_id === s || k.stream_spec === s);
      return hit?.stream_spec || s;

    function writeTomlKey(key, formatted) {
      if (loadingConfig) return;
      const lines = $("#content").value.split(/\r?\n/);
      const re = new RegExp(`^\\s*${key}\\s*=`);
      const idx = lines.findIndex((l) => re.test(l));
      if (formatted === null) {
        if (idx >= 0) lines.splice(idx, 1);
      } else if (idx >= 0) {
        lines[idx] = `${key} = ${formatted}`;
      } else {
        lines.push(`${key} = ${formatted}`);
      }
      $("#content").value = lines.filter((l, i, arr) => i < arr.length - 1 || l !== "").join("\n") + "\n";
    }

    function unquoteYamlVal(raw) {
      const v = String(raw || "").trim();
      if (v.length >= 2 && v.startsWith("\"") && v.endsWith("\"")) {
        try { return JSON.parse(v); } catch { return v.slice(1, -1); }
      }
      if (v.length >= 2 && v.startsWith("'") && v.endsWith("'")) return v.slice(1, -1);
      return v;
    }

    function parseSkillFrontmatter(text) {
      const m = String(text || "").match(/^\s*---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
      const out = { name: "", description: "" };
      if (!m) return out;
      m[1].split(/\r?\n/).forEach((line) => {
        const pair = line.match(/^\s*([A-Za-z0-9_-]+)\s*:\s*(.*?)\s*$/);
        if (pair) {
          const k = pair[1].toLowerCase();
          if (k === "name" || k === "description") out[k] = unquoteYamlVal(pair[2]);
        }
      });
      return out;
    }

    function writeSkillFrontmatter(field, value) {
      if (loadingSkillVisual) return;
      const text = $("#content").value || "";
      const val = String(value ?? "");
      const formatted = field === "description"
        ? `description: ${JSON.stringify(val)}`
        : `name: ${val.trim() || selectedSkill || ""}`;
      const re = /^(\s*---\r?\n)([\s\S]*?)(\r?\n---(?:\r?\n|$))/;
      const m = text.match(re);
      if (m) {
        const lines = m[2].split(/\r?\n/);
        const lineRe = new RegExp(`^\\s*${field}\\s*:`, "i");
        const idx = lines.findIndex((l) => lineRe.test(l));
        if (idx >= 0) lines[idx] = formatted;
        else lines.push(formatted);
        $("#content").value = m[1] + lines.join("\n") + m[3] + text.slice(m[0].length);
      } else {
        const curName = ($("#sk-meta-name").value || selectedSkill || "custom-skill").trim();
        const curDesc = $("#sk-meta-desc").value || "";
        const head = `---\nname: ${curName}\ndescription: ${JSON.stringify(curDesc)}\n---\n\n`;
        $("#content").value = head + text;
      }
    }

    let assetLoadSeq = 0;
    let hostModelsProbed = false;
    async function loadAsset(preserveDraft = false) {
      const seq = ++assetLoadSeq;
      renderDocModeUI();
      if (viewMode === "skills-gallery" || viewMode === "discovery") return;
      const q = targetQuery();
      if (!q.target) {
        $("#content").value = "";
        $("#content").disabled = false;
        $("#save").disabled = false;
        $("#version").textContent = "未选择";
        return;
      }
      const prevDraft = $("#content").value;
      $("#content").disabled = true;
      $("#save").disabled = true;
      try {
        const r = await rpc("read", "asset", q);
        if (sig?.aborted || seq !== assetLoadSeq) return;
        if (!r?.success) return say(r?.error || "读取资产失败", true);
        if ($("#feedback")?.classList.contains("mil-feedback--err")) say("");
        if (preserveDraft && prevDraft !== (r.content || "")) {
          $("#local-draft").value = prevDraft;
          $("#draft-panel").hidden = false;
        }
        $("#content").value = r.content || "";
        expectedVersion = Number(r.version || 0);
        $("#version").textContent = `v${expectedVersion}`;
        setDirty(false);
        versionHistory(r.history, expectedVersion);
        if (viewMode === "roles" && $("#document").value === "config") {
          syncVisualFromToml();
          if (!hostModelsProbed && !(catalog.model_catalog || []).some((m) => m && m.source && m.source !== "profile")) {
            hostModelsProbed = true;
            await refreshDiscovery();
            if (!sig?.aborted && seq === assetLoadSeq && viewMode === "roles" && $("#document").value === "config") {
              renderModelChainEditor();
            }
          }
        }
        if (!sig?.aborted && viewMode === "skill-editor" && $("#document").value === "skill") syncSkillVisualFromMarkdown();
      } finally {
        if (!sig?.aborted && seq === assetLoadSeq) {
          $("#content").disabled = false;
          $("#save").disabled = false;
        }
      }
    }

    function renderCatalog() {
      const items = skillItemsList();
      const profiles = catalog.profiles || [];
      const needle = skillFilter.trim().toLowerCase();

      const scopePills = [
        { key: "all", label: `全部 (${items.length})`, role: null },
        { key: "custom", label: `自建与导入 (${items.filter((s) => !s.is_preset).length})`, role: null },

        return `<button type="button" class="mil-key mil-key--sm" data-skill-scope="${esc(sp.key)}" aria-pressed="${skillScope === sp.key}">${fish}<span>${esc(sp.label)}</span></button>`;

      const scopeFiltered = items.filter((s) => {

          const rid = skillScope.slice(5);
          return Array.isArray(s.used_by) && s.used_by.includes(rid);
        }
        return true;
      });
      const shownSkills = needle
        ? scopeFiltered.filter((s) => `${s.id} ${s.title || ""} ${s.name || ""} ${s.description || ""} ${(s.companion_files || []).join(" ")}`.toLowerCase().includes(needle))
