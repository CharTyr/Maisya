/* Maisya WebUI · 双主题设计系统
   1. 默认主题：MaiBot 千禧机械风 [data-ui-style="millennium"]（0px 直角 / 塑料机壳凹凸导角与纹理 / 百叶散热窗与丝印 / 下沉液晶屏与深色示波器 / 立体机械键帽 / 高可读系统无衬线正文）
   2. 可选主题：MaiWork 清朗手账风 [data-ui-style="maiwork"]（白底/深黑画布、发丝分割线、胶囊按键、毛玻璃导航条、清晰可读留白，为 :root 基础层） */

  --ctx-memory: #dcfce7;

  --mil-accent: #5b8cff;

  --mil-on: #f2f2f5;

  --mil-warn: #ff9f0a;

  --mil-danger: #ff453a;

  --mil-danger-ink: #ff6961;
  --mil-led: #30d158;
  --mil-led-run: #5b8cff;
  --mil-led-bad: #ff453a;
  --mil-meter: #5b8cff;

  --mil-raise: 0 2px 16px rgba(0, 0, 0, 0.32);

  --ctx-system: #1d3557;
  --ctx-memory: #164430;
  --ctx-user: #583f14;
  --ctx-assistant: #134e4a;
  --ctx-tool: #5c2f18;
  --ctx-free: #232328;
  --ctx-tile-ink: #f2f2f5;
  color-scheme: dark;
}

  --mil-radius: 0px;

  /* 英文丝印、数字与徽章保留像素/等宽机箱质感；中文正文保持高可读无衬线体 */
  --mil-font-display: var(--maibot-font-display, "Departure Mono", "JetBrains Mono", ui-monospace, monospace);
  --mil-font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mil-font-mono: var(--maibot-font-mono, "Departure Mono", "JetBrains Mono", ui-monospace, monospace);

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background-color: var(--mil-shell);
  color: var(--mil-ink);
  font-family: var(--mil-font-body);
  font-size: 14px;
  line-height: 1.56;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root[data-ui-style="millennium"],
:root[data-ui-style="millennium"] body {
  background-image: var(--mil-grain-shell);
  background-size: 5px 5px;
}

button, input, select, textarea {
  font: inherit;
}

[hidden] {
  display: none !important;
}

h1, h2, h3, h4, p {
  margin: 0;
}

pre, code, .mono, .num {
  font-family: var(--mil-font-mono);
  font-variant-numeric: tabular-nums;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--mil-lo);
  border-radius: 999px;
}
:root[data-ui-style="millennium"] ::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}
:root[data-ui-style="millennium"] ::-webkit-scrollbar-track {
  background: var(--mil-well);
  border-left: 1px solid var(--mil-line);
}
:root[data-ui-style="millennium"] ::-webkit-scrollbar-thumb {
  background: var(--mil-lo);
  border: 2px solid var(--mil-line);
  border-radius: 0;
}

/* ───────────── 页面外壳与顶栏 ───────────── */

.mil-shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 18px 28px 56px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
:root[data-ui-style="millennium"] .mil-shell {
  max-width: 1380px;
  padding: 16px 20px 44px;
  gap: 18px;
}

.mil-topbar {
  position: sticky;
  top: 12px;
  z-index: 30;
  background: var(--mil-glass);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--mil-line);
  border-radius: 999px;
  box-shadow: 0 6px 24px rgba(17, 17, 20, 0.04);
  padding: 8px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
:root[data-ui-style="millennium"] .mil-topbar {
  position: static;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background-color: var(--mil-panel);
  background-image: var(--mil-grain-panel);
  background-size: 5px 5px;
  border: 2px solid var(--mil-line);
  border-radius: 0;
  box-shadow: var(--mil-raise);
  padding: 11px 16px;
}

.mil-brand {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.ms-wordmark {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.mil-spectrum {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.mil-spectrum i {
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.mil-spectrum i:nth-child(1) { background: var(--mil-accent); }
.mil-spectrum i:nth-child(2) { background: var(--mil-ok); }
.mil-spectrum i:nth-child(3) { background: var(--mil-warn); }

:root[data-ui-style="millennium"] .mil-spectrum {
  display: inline-grid;
  grid-template-columns: repeat(3, 8px);
  align-items: stretch;
  gap: 0;
  height: 22px;
  border: 2px solid var(--mil-line);
}
:root[data-ui-style="millennium"] .mil-spectrum i {
  width: 100%;
  height: 100%;
  border-radius: 0;
}
:root[data-ui-style="millennium"] .mil-spectrum i:nth-child(1) { background: var(--mil-on); }
:root[data-ui-style="millennium"] .mil-spectrum i:nth-child(2) { background: var(--mil-warn); }
:root[data-ui-style="millennium"] .mil-spectrum i:nth-child(3) { background: var(--mil-hot); }

.mil-nameplate {
  font-family: var(--mil-font-display);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mil-ink);
  flex-shrink: 0;
}
:root[data-ui-style="millennium"] .mil-nameplate {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 3px 8px;
  background: #5a544a;
  color: #f3eee1;
}
:root.dark[data-ui-style="millennium"] .mil-nameplate {
  background: #ebe4d2;
  color: #25221f;
}

.mil-page-title {
  font-family: var(--mil-font-body);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.01em;
  line-height: 1.2;
  color: var(--mil-ink);
  white-space: nowrap;
  flex-shrink: 0;
}
:root[data-ui-style="millennium"] .mil-page-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.mil-nav {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 4px;
  background: var(--mil-well);
  border: 0;
  border-radius: 999px;
  overflow-x: auto;
  max-width: 100%;
}
.mil-nav .mil-key {
  min-height: 30px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--mil-muted);
  box-shadow: none;
  font-size: 13.5px;
  font-weight: 600;
}
.mil-nav .mil-key[aria-current="page"] {
  background: var(--mil-panel);
  color: var(--mil-ink);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

:root[data-ui-style="millennium"] .mil-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
  overflow-x: visible;
}
:root[data-ui-style="millennium"] .mil-nav .mil-key {
  min-height: 29px;
  padding: 3px 11px 7px;
  border: 2px solid var(--mil-line);
  border-radius: 0;
  background: var(--mil-key);
  color: var(--mil-ink);
  box-shadow: inset 0 -4px 0 var(--mil-key-side), inset 2px 2px 0 var(--mil-key-hi);
  font-size: 12.5px;
  font-weight: 700;
}
:root[data-ui-style="millennium"] .mil-nav .mil-key[aria-current="page"] {
  background: var(--mil-on);
  color: var(--mil-on-ink);
  padding-top: 5px;
  padding-bottom: 5px;
  transform: translateY(2px);
  box-shadow: inset 0 -1px 0 var(--mil-on-side), inset 1px 1px 0 rgba(255, 255, 255, 0.35);
}

.mil-top-right {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.mil-led-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  background: var(--mil-well);
  border: 0;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mil-ink-2);
}
:root[data-ui-style="millennium"] .mil-led-pill {
  padding: 4px 10px;
  background-color: var(--mil-screen);
  background-image: var(--mil-lcd-grid);
  background-size: 3px 3px;
  border: 2px solid var(--mil-line);
  border-radius: 0;
  box-shadow: inset 2px 2px 0 var(--mil-screen-shade);
  font-family: var(--mil-font-mono);
  font-size: 12px;
  font-weight: 700;
}

.mil-led {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--mil-led);
  box-shadow: 0 0 0 3px var(--mil-ok-soft);
  flex-shrink: 0;
}
.mil-led--run {
  background: var(--mil-led-run);
  box-shadow: 0 0 0 3px var(--mil-accent-soft);
  animation: mil-pulse 1.6s ease-in-out infinite;
}
.mil-led--bad {
  background: var(--mil-led-bad);
  box-shadow: 0 0 0 3px var(--mil-danger-soft);
}
.mil-led--off {
  background: var(--mil-muted);
  box-shadow: none;
}

:root[data-ui-style="millennium"] .mil-led {
  width: 10px;
  height: 10px;
  border-radius: 0;
  border: 2px solid var(--mil-line);
  box-shadow: 0 0 0 1px var(--mil-lo);
}
:root[data-ui-style="millennium"] .mil-led--run {
  animation: mil-pulse-step 1.1s steps(2, end) infinite;
}
:root[data-ui-style="millennium"] .mil-led--off {
  background: var(--mil-well);
}

@keyframes mil-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.88); }
}
@keyframes mil-pulse-step {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ───────────── 模块面板、丝印标头、百叶散热窗 ───────────── */

.mil-panel {
  background: transparent;
  border: 0;
  border-top: 1px solid var(--mil-line);
  border-radius: 0;
  box-shadow: none;
  padding: 22px 0 4px;

.cfg-model-main {

/* ───────────── 产物页（统一资料空间）专用样式 ───────────── */
.out-space {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
.out-rail {
  position: sticky;
  top: 76px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.out-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.out-nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--mil-ink);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background-color 140ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.out-nav-btn:hover {
  background: var(--mil-screen);
}
.out-nav-btn[aria-current="page"] {
  background: var(--mil-accent-soft);
  color: var(--mil-ink);
  font-weight: 700;
  border-color: var(--mil-accent-border);
}
:root[data-ui-style="millennium"] .out-nav-btn {
  border-radius: 0;
  border-width: 1.5px;
}
:root[data-ui-style="millennium"] .out-nav-btn[aria-current="page"] {
  background: var(--mil-on);
  color: var(--mil-on-ink);
  border-color: var(--mil-on-side);
  box-shadow: 0 2px 0 var(--mil-on-side);
}
.out-nav-l {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.out-nav-cnt {
  font-size: 11.5px;
  color: var(--mil-muted);
  font-variant-numeric: tabular-nums;
}
:root[data-ui-style="millennium"] .out-nav-btn[aria-current="page"] .out-nav-cnt {
  color: var(--mil-on-ink);
  opacity: 0.88;
}
.out-ico {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.out-ico--all { color: #475569; }
.out-ico--page { color: #0f766e; }
.out-ico--img { color: #c2410c; }
.out-ico--doc { color: #0369a1; }
.out-ico--con { color: #15803d; }
.out-ico--ws { color: #854d0e; }
html.dark .out-ico--all { color: #94a3b8; }
html.dark .out-ico--page { color: #5eead4; }
html.dark .out-ico--img { color: #fdba74; }
html.dark .out-ico--doc { color: #7dd3fc; }
html.dark .out-ico--con { color: #86efac; }
html.dark .out-ico--ws { color: #fde047; }

.out-rail-sec {
  padding-top: 12px;
  border-top: 1px solid var(--mil-rule);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.out-rail-cap {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--mil-muted);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.out-recent-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.out-recent-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--mil-ink-2);
  font-size: 12px;
  cursor: pointer;
  text-align: left;
  min-width: 0;
  transition: background-color 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.out-recent-item:hover {
  background: var(--mil-screen);
  color: var(--mil-ink);
}
:root[data-ui-style="millennium"] .out-recent-item {
  border-radius: 0;
}
.out-recent-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

.out-main {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}
.out-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.out-top-l {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.out-space-title {
  margin: 0;
  font-family: var(--mil-font-display);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.out-top-r {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.out-search-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.out-search-wrap .mil-input {
  width: 220px;
  max-width: 100%;
}
.out-filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--mil-rule);
}

.out-table-head {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr) 76px 96px;
  gap: 12px;
  padding: 10px 10px 8px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--mil-muted);
  border-bottom: 1px solid var(--mil-rule);
}
.out-table {
  display: flex;
  flex-direction: column;
  max-height: 430px;
  overflow-y: auto;
}
.out-row {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr) 76px 96px;
  gap: 12px;
  align-items: center;
  padding: 11px 10px;
  border: 0;
  border-bottom: 1px solid var(--mil-rule);
  background: transparent;
  color: var(--mil-ink);
  text-align: left;
  cursor: pointer;
  font-size: 13px;
  transition: background-color 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.out-row:last-child {
  border-bottom: 0;
}
.out-row:hover {
  background: var(--mil-screen);
}
.out-row[aria-current="true"] {
  background: var(--mil-accent-soft);
}
:root[data-ui-style="millennium"] .out-row[aria-current="true"] {
  background: var(--mil-on);
  color: var(--mil-on-ink);
}
.out-row-name {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.out-row-titles {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.out-row-titles strong {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.out-row-sub {
  font-size: 11.5px;
  color: var(--mil-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
:root[data-ui-style="millennium"] .out-row[aria-current="true"] .out-row-sub,
:root[data-ui-style="millennium"] .out-row[aria-current="true"] .out-row-meta {
  color: var(--mil-on-ink);
  opacity: 0.88;
}
.out-row-src {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: 12px;
  color: var(--mil-ink-2);
}
.out-row-meta {
  font-size: 12px;
  color: var(--mil-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.out-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  padding-top: 12px;
  max-height: 460px;
  overflow-y: auto;
}
.out-grid-card {
  border: 1px solid var(--mil-line);
  border-radius: 12px;
  padding: 12px;
  background: var(--mil-panel);
  color: var(--mil-ink);
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 120ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 120ms ease;
}
.out-grid-card:hover {
  background: var(--mil-screen);
}
.out-grid-card[aria-current="true"] {
  border-color: var(--mil-accent);
  background: var(--mil-accent-soft);
}
:root[data-ui-style="millennium"] .out-grid-card {
  border: 2px solid var(--mil-line);
  border-radius: 0;
  box-shadow: 0 3px 0 var(--mil-lo);
}
:root[data-ui-style="millennium"] .out-grid-card[aria-current="true"] {
  background: var(--mil-on);
  color: var(--mil-on-ink);
  border-color: var(--mil-on-side);
}

:root[data-ui-style="millennium"] .out-stage,
:root[data-ui-style="millennium"] .out-img-stage,
:root[data-ui-style="millennium"] .ab-dropzone {
  border-radius: 0;
  border: 2px solid var(--mil-line);
}

.out-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 12.5px;
}

.out-stage {
  min-height: 240px;
  max-height: 580px;
  overflow: auto;
  padding: 20px 22px;
  background: var(--mil-panel);
  border: 1px solid var(--mil-line);
  border-radius: 12px;
}

.out-img-stage {
  width: 100%;
  min-height: 300px;
  height: 380px;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  border: 1px solid var(--mil-rule);
  border-radius: 12px;
  background-color: var(--mil-screen);
}

.out-doc {
  font-size: 14.5px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.out-doc h1, .out-doc h2, .out-doc h3, .out-doc h4 {
  margin: 0 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--mil-rule);
  font-family: var(--mil-font-display);
  font-weight: 700;
}
.out-doc p, .out-doc ul, .out-doc ol, .out-doc blockquote, .out-doc pre {
  margin: 0 0 12px;
}
.out-doc ul, .out-doc ol {
  padding-left: 22px;
}
.out-doc blockquote {
  padding: 10px 14px;
  border-left: 3px solid var(--mil-accent);
  border-radius: 0 8px 8px 0;
  background: var(--mil-screen);
}
.out-doc table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 13px;
}
.out-doc th, .out-doc td {
  border: 1px solid var(--mil-line);
  padding: 6px 10px;
  text-align: left;
}
.out-doc th {
  background: var(--mil-screen);
}

.out-link-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--mil-rule);
  font-size: 12.5px;
}
.out-link-item:last-child {
  border-bottom: 0;
}

@media (max-width: 960px) {
  .out-space {
    grid-template-columns: minmax(0, 1fr);
  }
  .out-rail {
    position: static;
  }
}

@media (max-width: 720px) {
  .set-row-r {
    flex: 1 1 100%;
    justify-content: flex-start;
  }
  .out-search-wrap .mil-input {
    width: 100%;
    flex: 1;
  }
  .out-table-head {
    display: none;
  }
  .out-row {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 10px;
  }
  .out-row-src {
    grid-column: 1 / 2;
  }
  .out-row-size {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ab-card,
  .sk-item-card,
  .out-nav-btn,
  .out-recent-item,
  .out-row,
  .out-grid-card,
  .cfg-model-item {
    transition: none;
  }
}

/* ───────────── 现场页专用布局与交互样式 ───────────── */

/* 1. 处理流向图 (FLOW) */
.flow-box {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 0.92fr) minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 32px;
  align-items: stretch;
  padding: 20px;
  border: 0;
  border-radius: 20px;
  background-color: var(--mil-screen);
}
:root[data-ui-style="millennium"] .flow-box {
  border: 2px solid var(--mil-line);
  border-radius: 0;
  background-color: var(--mil-screen);
  background-image: radial-gradient(var(--mil-rule) 1px, transparent 1px);
  background-size: 12px 12px;
  box-shadow: inset 2px 2px 0 var(--mil-screen-shade);
  gap: 38px;
  padding: 16px;
}
:root[data-ui-style="millennium"] .fl-svg path.on {
  stroke: var(--mil-on-side);
  stroke-width: 2.8px;
}
:root[data-ui-style="millennium"] .fl-svg path.live {
  stroke: var(--mil-hot);
  stroke-width: 2.8px;
}
:root[data-ui-style="millennium"] .pkt {
  fill: var(--mil-on);
  stroke: var(--mil-line);
}
:root[data-ui-style="millennium"] .pkt.hot {
  fill: var(--mil-hot);
}
:root[data-ui-style="millennium"] .fl-col-h {
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: var(--mil-print);
  padding: 4px 8px;
  border: 1.5px solid var(--mil-lo);
  background: var(--mil-panel);
}

.fl-svg, .fl-sky {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  z-index: 1;
}
.fl-sky {
  z-index: 3;
}

.fl-svg path {
  fill: none;
  stroke: var(--mil-lo);
  stroke-width: 1.6px;
  stroke-dasharray: 4 4;
  opacity: 0.72;
}
.fl-svg path.on {
  stroke: var(--mil-accent);
  stroke-width: 2.2px;
  stroke-dasharray: none;
  opacity: 0.9;
}
.fl-svg path.live {
  stroke: var(--mil-live);
  stroke-width: 2.4px;
  stroke-dasharray: 6 5;
  opacity: 1;
  animation: fl-dash 0.8s linear infinite;
}
@keyframes fl-dash {
  to { stroke-dashoffset: -22; }
}

.pkt {
  fill: var(--mil-accent);
  stroke: var(--mil-panel);
  stroke-width: 1.5px;
}
.pkt.hot { fill: var(--mil-live); }
.pkt.warn { fill: var(--mil-warn); }
.pkt.held {
  animation: mil-pulse 1.1s ease-in-out infinite;
}

.fl-col {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.fl-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}

.fl-col-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-family: var(--mil-font-display);
  font-size: 12px;
  font-weight: 700;
  color: var(--mil-muted);
  padding: 2px 4px;
}
.fl-stage-arrow {
  color: var(--mil-lo);
  font-family: var(--mil-font-mono);
}

.fl-node {
  position: relative;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: var(--mil-panel);
  color: var(--mil-ink);
  box-shadow: 0 2px 8px rgba(17, 17, 20, 0.04);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 120ms ease;
}
:root[data-ui-style="millennium"] .fl-node {
  border: 2px solid var(--mil-line);
  border-radius: 0;
  box-shadow: 0 3px 0 var(--mil-lo);
}
.fl-node[data-port-in="1"]::before,
.fl-node[data-port-out="1"]::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-top: -4px;
  border-radius: 50%;
  border: 1.5px solid var(--mil-lo);
  background: var(--mil-panel);
  z-index: 4;
}
:root[data-ui-style="millennium"] .fl-node[data-port-in="1"]::before,
:root[data-ui-style="millennium"] .fl-node[data-port-out="1"]::after {
  width: 7px;
  height: 7px;
  margin-top: -3.5px;
  border-radius: 0;
  border-color: var(--mil-line);
  background: var(--mil-screen);
}
.fl-node[data-port-in="1"]::before { left: -5px; }
.fl-node[data-port-out="1"]::after { right: -5px; }
.fl-node.on[data-port-in="1"]::before,
.fl-node.on[data-port-out="1"]::after {
  background: var(--mil-accent);
  border-color: var(--mil-panel);
}
:root[data-ui-style="millennium"] .fl-node.on[data-port-in="1"]::before,
:root[data-ui-style="millennium"] .fl-node.on[data-port-out="1"]::after {
  background: var(--mil-on);
  border-color: var(--mil-on-side);
}
.fl-node.run[data-port-in="1"]::before,
.fl-node.run[data-port-out="1"]::after {
  background: var(--mil-live);
  border-color: var(--mil-panel);
}
:root[data-ui-style="millennium"] .fl-node.run[data-port-in="1"]::before,
:root[data-ui-style="millennium"] .fl-node.run[data-port-out="1"]::after {
  background: var(--mil-hot);
  border-color: var(--mil-hot-side);
}

.fl-node--static {
  cursor: default;
}

.fl-node.on {
  background: var(--mil-accent-soft);
  color: var(--mil-ink);
  border-color: var(--mil-accent);
  box-shadow: 0 0 0 1px var(--mil-accent-border);
}
:root[data-ui-style="millennium"] .fl-node.on {
  background: var(--mil-on);
  color: var(--mil-on-ink);
  border-color: var(--mil-on-side);
  box-shadow: 0 3px 0 var(--mil-on-side);
}

.fl-node.run {
  border-color: var(--mil-accent-border);
  box-shadow: inset 3px 0 0 var(--mil-accent), 0 2px 6px rgba(37, 99, 235, 0.08);
}
:root[data-ui-style="millennium"] .fl-node.run {
  border-color: var(--mil-hot-side);
  box-shadow: inset 4px 0 0 var(--mil-hot), 0 3px 0 var(--mil-lo);
}

.fl-node--gate {
  background: var(--mil-panel);
  box-shadow: inset 3px 0 0 var(--mil-ok), 0 1px 3px rgba(15, 23, 42, 0.04);
}
:root[data-ui-style="millennium"] .fl-node--gate {
  box-shadow: 0 3px 0 var(--mil-lo), inset 4px 0 0 var(--mil-on-side);
}
.fl-node--gate[data-port-in="1"]::before,
.fl-node--gate[data-port-out="1"]::after {
  background: var(--mil-ok);
  border-color: var(--mil-panel);
}
:root[data-ui-style="millennium"] .fl-node--gate[data-port-in="1"]::before,
:root[data-ui-style="millennium"] .fl-node--gate[data-port-out="1"]::after {
  background: var(--mil-on);
  border-color: var(--mil-on-side);
}

.fl-subband {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--mil-rule);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.fl-node-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.fl-node-name {

}
.cm-cell[data-cat="system"] { background: var(--ctx-system); }
.cm-cell[data-cat="memory"] { background: var(--ctx-memory); }
.cm-cell[data-cat="user"] { background: var(--ctx-user); }
.cm-cell[data-cat="assistant"] { background: var(--ctx-assistant); }
.cm-cell[data-cat="tool"] { background: var(--ctx-tool); }
.cm-cell[data-cat="free"] { cursor: default; }

.cm-tip {
  position: fixed;
  z-index: 980;

}
.cm-tip[hidden] { display: none; }

.ctx-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

  height: 9px;
  border-radius: 3px;
  border: 1px solid var(--mil-line);
}

:root[data-ui-style="millennium"] .cm-grid,
:root[data-ui-style="millennium"] .cm-cell,
:root[data-ui-style="millennium"] .cm-tip,

  flex-direction: column;
  gap: 8px;
  max-height: 360px;
  overflow-y: auto;
}

.ev-det {
  border: 0;
  border-radius: 14px;

.launch-grid {

<script>
(() => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => [...document.querySelectorAll(sel)];
  // Maisya WebUI · 角色小鱼头像（移植自 MaiWork · 程序化内联 SVG 与游动循环）
// 同一个种子永远画出同一条鱼：一整块圆润纯色 + 一对白色眼睛，透明底、零图片标签、无外网请求。

const FISH_COLORS = [
  "#5CC87A", "#F0A03C", "#EE6C33", "#8B5CF0", "#6E6E73", "#52B8A4",
  "#3F7CF2", "#1FA3F5", "#F2609A", "#F2B92B", "#9BC63B", "#FF8A70",
  "#5A5FD6", "#2FC4B2", "#B98150", "#B18CF5", "#E84B5A", "#4BA3C7",
];

const FISH_COLOR_NAMES = [
  "草绿", "橙", "橘红", "紫", "灰", "青绿",
  "蓝", "天蓝", "粉", "金黄", "黄绿", "珊瑚",
  "靛蓝", "碧绿", "棕", "淡紫", "红", "湖蓝",
];

function fishHashSeed(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}

function fishRng(seed) {
  let a = fishHashSeed(String(seed));
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const FISH_PI = Math.PI;
const FISH_TOP = 1.5 * FISH_PI;
const FISH_BOTTOM = 0.5 * FISH_PI;

const FISH_SPECIES_SPEC = {

    tail: { type: "round", L: u(11, 13), S: u(9, 11) }, fins: [],
    lure: { reach: u(0.75, 0.95), lift: u(0.9, 1.1) },
    eye: { t: -0.4, k: 0.52 } }) },
  boxfish: { name: "箱鲀", make: (u) => ({
    a: u(29, 33), b: u(22, 25), n: 4, taper: u(0, 0.08), tailW: 0.32,
    tail: { type: "round", L: u(11, 13), S: u(9, 11) }, fins: [],
    eye: { t: -0.5, k: 0.55 } }) },
};

const FISH_SPECIES = Object.fromEntries(Object.entries(FISH_SPECIES_SPEC).map(([k, v]) => [k, v.name]));

function fishTailPoints(t, xr) {
  const { L, S } = t;
  const P = (fx, fy) => [xr - L * fx, S * fy];
  switch (t.type) {
    case "fork": return [P(0.95, 1), P(0.5, 0.05), P(0.95, -1)];
    case "fan": return [P(0.65, 1), P(1, 0.5), P(0.82, 0), P(1, -0.5), P(0.65, -1)];
    case "round": return [P(0.55, 0.85), P(1, 0), P(0.55, -0.85)];
    case "spade": return [P(0.45, 0.6), P(1, 0), P(0.45, -0.6)];
    case "none": return [P(0.4, 0.75), P(0.7, 0.3), P(0.45, 0), P(0.7, -0.3), P(0.4, -0.75)];
    case "shark": return [P(0.7, 0.75), P(0.35, 0), P(1, -1.1)];
    case "ribbon": return [P(0.35, 1.25), P(0.95, 1.05), P(1.1, 0.25), P(0.9, -0.45), P(0.5, -1.05)];
    default: return [];
  }
}

function fishBuildGeometry(spec) {
  const { a, b, n = 2, taper = 0, tailW, fins = [], ripple } = spec;
  const e = 2 / n;
  const sp = (v) => Math.sign(v) * Math.abs(v) ** e;
  const P = (th, withFins = true) => {
    const c = Math.cos(th), s = Math.sin(th);
    let f = 1;
    if (withFins) for (const fin of fins) f += fin.h * Math.exp(-(((th - fin.at) / fin.w) ** 2));
    if (ripple) f += ripple.s * (0.5 + 0.5 * Math.cos(ripple.k * th)) ** 3;
    return [a * sp(c) * f, b * sp(s) * (1 + taper * c) * f];
  };
  const N = 26, pts = [];
  for (let i = 0; i <= N; i++) pts.push(P((FISH_PI - tailW) * (i / N)));
  const bot = P(FISH_PI - tailW), top = P(FISH_PI + tailW);
  pts.push(...fishTailPoints(spec.tail, Math.min(bot[0], top[0])));
  for (let i = 0; i < N; i++) pts.push(P(FISH_PI + tailW + (FISH_PI - tailW) * (i / N)));
  const eyeP = P(spec.eye.t, false);
  const eye = [eyeP[0] * spec.eye.k + a * 0.12, eyeP[1] * spec.eye.k];
  let lure = null;
  if (spec.lure) {
    const root = P(2 * FISH_PI - 0.95, false);
    lure = { root, tip: [a * spec.lure.reach + 4, -b * spec.lure.lift - 6] };
  }
  return { pts, eye, lure };
}

function fishSmoothPath(pts, digits = 1) {
  const n = pts.length, f = (v) => v.toFixed(digits);
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + "Z";
}

const fishF1 = (v) => v.toFixed(1);
const fishEyeSlash = (len, lean, w = 4.6) => {
  const dx = (Math.sin(lean) * len) / 2, dy = (Math.cos(lean) * len) / 2;
  return `<line x1="${fishF1(-dx)}" y1="${fishF1(-dy)}" x2="${fishF1(dx)}" y2="${fishF1(dy)}" fill="none" stroke-width="${w}"/>`;
};
const fishEyeArc = (w, h, sw = 3.6) => `<path d="M${fishF1(-w)} ${fishF1(h / 2)}Q0 ${fishF1(-h * 1.3)} ${fishF1(w)} ${fishF1(h / 2)}" fill="none" stroke-width="${sw}"/>`;
const FISH_DEG = FISH_PI / 180;
const FISH_EYES_SPEC = {
  slash:   { name: "斜眼", weight: 6, draw: (ev) => fishEyeSlash(ev(7.5, 9.5), -ev(12, 22) * FISH_DEG) },
  upright: { name: "直眼", weight: 2, draw: (ev) => fishEyeSlash(ev(7.5, 9.5), ev(-3, 3) * FISH_DEG) },
  lean:    { name: "反斜", weight: 1, draw: (ev) => fishEyeSlash(ev(7.5, 9), ev(12, 20) * FISH_DEG) },
  big:     { name: "大眼", weight: 1, draw: (ev) => fishEyeSlash(ev(10.5, 12), -ev(8, 16) * FISH_DEG, 5.6) },
  tiny:    { name: "小眼", weight: 1, draw: (ev) => fishEyeSlash(ev(4.5, 5.5), -ev(5, 15) * FISH_DEG, 4) },
  dots:    { name: "圆点", weight: 2, draw: (ev) => `<circle r="${fishF1(ev(3.1, 3.7))}" stroke="none"/>` },
  beads:   { name: "椭圆", weight: 1, draw: (ev) => `<ellipse rx="${fishF1(ev(2.4, 2.8))}" ry="${fishF1(ev(4, 4.8))}" stroke="none"/>` },
  happy:   { name: "笑眼", weight: 2, draw: (ev) => fishEyeArc(ev(3.2, 3.8), ev(3, 3.6)) },
  sleepy:  { name: "困",   weight: 1, draw: (ev) => `<path d="M-3 -0.6Q0 ${fishF1(ev(2.6, 3.2))} 3 -0.6" fill="none" stroke-width="3.2"/>` },
  flat:    { name: "眯眼", weight: 1, draw: (ev) => `<line x1="-2.4" y1="0" x2="2.4" y2="0" fill="none" stroke-width="3.6"/>` },
  wink:    { name: "眨眼", weight: 1, draw: (ev) => [fishEyeSlash(ev(7.5, 9), -ev(12, 20) * FISH_DEG), fishEyeArc(3.2, 3)] },
};
const FISH_EYES = Object.fromEntries(Object.entries(FISH_EYES_SPEC).map(([k, v]) => [k, v.name]));

function fishEyeTraits(seed, opts = {}) {
  const E = fishRng(`${seed}#eyes`);
  const total = Object.values(FISH_EYES_SPEC).reduce((n, e) => n + e.weight, 0);
  let x = E() * total, eyes = "slash";
  for (const [k, e] of Object.entries(FISH_EYES_SPEC)) { if ((x -= e.weight) < 0) { eyes = k; break; } }
  if (opts.eyes && FISH_EYES_SPEC[opts.eyes]) eyes = opts.eyes;
  return { eyes, E };
}

const FISH_CUSTOM_RE = /(^|:)c-([a-z]+)-(\d{1,2})-([a-z]+)-([A-Za-z0-9_]{0,10})$/;
const FISH_BASE_RE = /^[A-Za-z0-9_]{0,10}$/;
function parseFishCustom(seed) {
  const s = String(seed == null ? "" : seed);
  const m = s.match(FISH_CUSTOM_RE);
  if (!m || !FISH_SPECIES_SPEC[m[2]] || !FISH_EYES_SPEC[m[4]] || Number(m[3]) >= FISH_COLORS.length) return null;
  return { species: m[2], color: Number(m[3]), eyes: m[4], base: m[5], baseSeed: s.slice(0, m.index + m[1].length) + m[5] };
}
const customFishSeed = ({ species, color, eyes, base = "" }) => `c-${species}-${Number(color) || 0}-${eyes}-${base}`;
const newFishSeed = () => "f" + Math.random().toString(36).slice(2, 9);
const roleFishSeed = (roleId, seed = "") => `agent:${roleId || "scout"}:${seed || ""}`;

function fishTraits(seed, opts = {}) {
  const c = parseFishCustom(seed);
  const base = c ? c.baseSeed : seed;
  const R = fishRng(base);
  const keys = Object.keys(FISH_SPECIES_SPEC);
  let species;
  if (c) { R(); species = c.species; }
  else species = opts.species && FISH_SPECIES_SPEC[opts.species] ? opts.species : keys[Math.floor(R() * keys.length)];
  if (c && opts.species && FISH_SPECIES_SPEC[opts.species]) species = opts.species;
  let color = FISH_COLORS[Math.floor(R() * FISH_COLORS.length)];
  if (c) color = FISH_COLORS[c.color];
  const colorIdx = Math.max(0, FISH_COLORS.indexOf(color));
  const { eyes } = fishEyeTraits(base, c && !opts.eyes ? { ...opts, eyes: c.eyes } : opts);
  return {
    species,
    name: FISH_SPECIES_SPEC[species].name,
    color,
    colorName: FISH_COLOR_NAMES[colorIdx] || "",
    eyes,
    eyeName: FISH_EYES_SPEC[eyes].name,
    R,
    base,
    custom: !!c,
  };
}

const FISH_SWIM = {
  pebble:   { amp: 3.6, pow: 2.2, waves: 0.55, hz: 1.5 },
  classic:  { amp: 4.2, pow: 2.0, waves: 0.6,  hz: 1.3 },
  eel:      { amp: 4.2, pow: 1.0, waves: 1.15, hz: 1.0 },
  disc:     { amp: 3.0, pow: 2.6, waves: 0.5,  hz: 1.2 },
  drop:     { amp: 4.2, pow: 2.4, waves: 0.6,  hz: 1.4 },
  goldfish: { amp: 3.8, pow: 2.4, waves: 0.6,  hz: 1.0 },
  puffer:   { amp: 2.6, pow: 4.0, waves: 0.4,  hz: 2.2 },
  sunfish:  { amp: 2.4, pow: 3.5, waves: 0.4,  hz: 0.9 },
  shark:    { amp: 4.0, pow: 1.8, waves: 0.7,  hz: 1.0 },
  betta:    { amp: 4.6, pow: 2.2, waves: 0.8,  hz: 0.8 },
  angler:   { amp: 3.2, pow: 2.6, waves: 0.55, hz: 1.2 },
  boxfish:  { amp: 2.6, pow: 4.0, waves: 0.4,  hz: 2.0 },

function fishSwimPose(g, time) {
  const t = time + g.lag, st = g.style, TAU = 2 * FISH_PI;
  const W = TAU / g.surge, c = 0.55;
  const phase = TAU * st.hz * g.beat * (t + (c * Math.sin(W * t)) / W);
  const effort = 0.5 + 0.5 * Math.cos(W * t);
  const A = st.amp * (0.45 + 0.55 * effort);
  const env = (u) => 0.05 + 0.95 * u ** st.pow;
  const sway = (u) => env(u) * A * Math.sin(phase - st.waves * TAU * u);
  const pts = g.pts.map((p, i) => {
    const w = sway(g.ts[i]);
    return [p[0] + g.n[0] * w, p[1] + g.n[1] * w];
  });
  const hw = sway(g.eyeT);
  const b = (TAU * t) / g.bob;
  const y = 1.8 * Math.sin(b), pitch = 2.2 * Math.cos(b), x = 0.9 * (effort - 0.5);
  return {
    d: fishSmoothPath(pts, 2),
    head: `translate(${(g.n[0] * hw).toFixed(2)} ${(g.n[1] * hw).toFixed(2)})`,
    body: `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${pitch.toFixed(2)} ${g.cx} ${g.cy})`,
  };
}

const FISH_SWIM_GEOMS = new Map();
const FISH_SWIM_IDS = new Map();
function registerFishSwim(key, geom) {
  let id = FISH_SWIM_IDS.get(key);
  if (id == null) { id = FISH_SWIM_IDS.size + 1; FISH_SWIM_IDS.set(key, id); }
  FISH_SWIM_GEOMS.set(id, geom);

}
const fishSwimGeom = (id) => FISH_SWIM_GEOMS.get(Number(id));

let fishSwimOn = false;
let fishSwimFrame = 0;

function stopFishSwimLoop() {

  fishSwimFrame = 0;
  fishSwimOn = false;
  if (typeof document === "undefined") return;
  for (const el of document.querySelectorAll("svg.fish-swim[data-fish-id]")) {
    const g = fishSwimGeom(el.dataset.fishId);
    const body = el.querySelector(".fish-body");
    if (g && body) body.setAttribute("d", fishSmoothPath(g.pts));
    el.querySelector(".fish-bob")?.removeAttribute("transform");
    for (const head of el.querySelectorAll(".fish-head")) head.removeAttribute("transform");

}
if (typeof matchMedia === "function") {

}
function startFishSwimLoop() {
  if (fishSwimOn || typeof requestAnimationFrame !== "function" || typeof document === "undefined" || typeof document.querySelectorAll !== "function") return;
  if (_fishReduceMotion()) return;
  fishSwimOn = true;
  let items = [], lastScan = -1e9, empty = 0;
  const tick = (now) => {
    fishSwimFrame = 0;
    if (!fishSwimOn || _fishReduceMotion()) { stopFishSwimLoop(); return; }
    if (now - lastScan > 400 || items.some((x) => !x.body.isConnected)) {
      lastScan = now;
      items = [...document.querySelectorAll("svg.fish-swim[data-fish-id]")].map((el) => ({
        g: fishSwimGeom(el.dataset.fishId), body: el.querySelector(".fish-body"), bob: el.querySelector(".fish-bob"),
        heads: [...el.querySelectorAll(".fish-head")],
      })).filter((x) => x.g && x.body);
      empty = items.length ? 0 : empty + 1;
      if (empty > 5) { fishSwimOn = false; return; }
    }
    const sec = now / 1000;
    for (const x of items) {
      const p = fishSwimPose(x.g, sec);
      x.body.setAttribute("d", p.d);
      if (x.bob) x.bob.setAttribute("transform", p.body);
      for (const h of x.heads) h.setAttribute("transform", p.head);
    }
    fishSwimFrame = requestAnimationFrame(tick);
  };
  fishSwimFrame = requestAnimationFrame(tick);
}

function fishSvg(seed, opts = {}) {
  const { species, color, R, base, custom } = fishTraits(seed, opts);
  const c = custom ? parseFishCustom(seed) : null;
  const eyeOpts = c && !opts.eyes ? { ...opts, eyes: c.eyes } : opts;
  const u = (lo, hi) => lo + (hi - lo) * R();
  const ok = (p) => R() < p;
  const spec = FISH_SPECIES_SPEC[species].make(u, ok);
  let { pts, eye, lure } = fishBuildGeometry(spec);

  if (spec.wave) {
    const fq = (2 * FISH_PI) / (spec.a * 1.7);
    const wv = (p) => [p[0], p[1] + spec.wave.amp * Math.sin(p[0] * fq + spec.wave.ph)];
    pts = pts.map(wv); eye = wv(eye);
  }
  const rot = u(-8, 8) * (FISH_PI / 180), cr = Math.cos(rot), sr = Math.sin(rot);
  const rt = (p) => [p[0] * cr - p[1] * sr, p[0] * sr + p[1] * cr];
  pts = pts.map(rt); eye = rt(eye);
  if (lure) lure = { root: rt(lure.root), tip: rt(lure.tip) };

  const all = lure ? [...pts, [lure.tip[0] + 5, lure.tip[1] - 5], [lure.tip[0] - 5, lure.tip[1] + 5]] : pts;
  const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const sc = Math.min(84 / (maxx - minx), 76 / (maxy - miny));
  const tx = 50 - ((minx + maxx) / 2) * sc, ty = 50 - ((miny + maxy) / 2) * sc;
  const T = (p) => [p[0] * sc + tx, p[1] * sc + ty];
  pts = pts.map(T);

  const f = (v) => v.toFixed(1);
  const [ex, ey] = T(eye);
  const { eyes: eyeStyle, E } = fishEyeTraits(base, eyeOpts);
  const ev = (lo, hi) => lo + (hi - lo) * E();
  const gap = ev(9, 11.5) * (eyeStyle === "dots" || eyeStyle === "beads" ? 0.95 : 1);
  const one = FISH_EYES_SPEC[eyeStyle].draw(ev);
  const drawn = eyeStyle === "wink" ? [one[0], one[1]] : [one, one];
  const deg = (rot * 180) / FISH_PI;
  const place = (x, y, g) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(deg)})">${g}</g>`;
  const e2 = [ex - gap * cr, ey - gap * sr];
  const eyesSvg = place(ex, ey, drawn[0]) + place(e2[0], e2[1], drawn[1]);

  const size = opts.size || 64;
  let lureSvg = "";
  if (lure) {
    const r0 = T(lure.root), r1 = T(lure.tip);
    const mid = [(r0[0] + r1[0]) / 2 - 2, Math.min(r0[1], r1[1]) - 6];
    lureSvg = `<path d="M${f(r0[0])} ${f(r0[1])}Q${f(mid[0])} ${f(mid[1])} ${f(r1[0])} ${f(r1[1])}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/><circle cx="${f(r1[0])}" cy="${f(r1[1])}" r="4.2" fill="${color}"/>`;
  }
  const label = opts.title ? `<title>${String(opts.title).replace(/[<&>"]/g, "")}</title>` : "";

  const ax = [cr, sr], nrm = [-sr, cr];
  const along = (p) => p[0] * ax[0] + p[1] * ax[1];
  const ss = pts.map(along), sHead = Math.max(...ss), sTail = Math.min(...ss), span = sHead - sTail || 1;
  const M = fishRng(`${base}#swim`);
  const geom = {
    pts, ts: ss.map((s) => (sHead - s) / span), n: nrm, eyeT: (sHead - along([ex, ey])) / span,
    style: FISH_SWIM[species] || FISH_SWIM.classic, cx: 50, cy: 50,
    beat: 0.9 + M() * 0.35, bob: 2.8 + M() * 1.4, surge: 5.5 + M() * 3, lag: M() * 20,
  };
  const id = opts.still ? 0 : registerFishSwim(`${seed}|${opts.species || ""}|${opts.eyes || ""}`, geom);
  if (id) startFishSwimLoop();
  return `<svg class="fish${id ? " fish-swim" : ""}"${id ? ` data-fish-id="${id}"` : ""} viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="${opts.title ? "false" : "true"}">${label}`
    + `<g class="fish-bob">`
    + (lureSvg ? `<g class="fish-head">${lureSvg}</g>` : "")
    + `<path class="fish-body" d="${fishSmoothPath(pts)}" fill="${color}"/>`
    + `<g class="fish-head" fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">${eyesSvg}</g>`
    + `</g></svg>`;
}

function roleFishHtml(roleId, seed = "", size = 32, opts = {}, extraCls = "") {

}

iv style=\"display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--mil-rule)\">\n        <div class=\"mil-field\">\n          <div class=\"mil-row\" style=\"gap:6px\">\n            <label class=\"mil-label\" for=\"new-id\">克隆或新建角色编号<\/label>\n            <button type=\"button\" class=\"mil-help\" data-help=\"仅限英文小写字母、数字或下划线\" aria-label=\"查看角色编号格式说明\" aria-expanded=\"false\">?<\/button>\n          <\/div>\n          <input id=\"new-id\" class=\"mil-input mono\" placeholder=\"例如 painter\">\n        <\/div>\n        <div class=\"mil-row\">\n          <button id=\"toggle-profile-enabled\" class=\"mil-key mil-key--sm\" type=\"button\">停用所选<\/button>\n          <button id=\"clone\" class=\"mil-key mil-key--sm\" type=\"button\">克隆角色<\/button>\n          <button id=\"delete-profile\" class=\"mil-key mil-key--sm mil-key--danger\" type=\"button\">删除角色<\/button>\n        <\/div>\n        <button id=\"jump-recipe-panel\" class=\"mil-key mil-key--sm\" type=\"button\" style=\"justify-content:center\">配方模板分享 / 导入 →<\/button>\n      <\/div>\n    <\/section>\n  <\/aside>\n\n  <!-- 右侧主工作舞台 -->\n  <div class=\"ab-stage\">\n    <input id=\"skill-id\" type=\"hidden\">\n\n    <!-- 视图 A：宽敞技能库画廊（默认展示，点击卡片后进入工作台） -->\n    <section class=\"mil-panel mil-panel--flat\" id=\"skills-gallery-panel\">\n      <div class=\"sk-gallery-head\">\n        <div class=\"mil-row\" style=\"gap:8px;align-items:center\">\n          <h2 class=\"sk-gallery-title\">技能库<\/h2>\n          <button type=\"button\" class=\"mil-help\" data-help=\"管理各角色共享的方法规范与附属资源；点击卡片进入编辑，也可直接拖入 .zip / .skill / .tar.gz 压缩包导入\" aria-label=\"查看技能库说明\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"sk-gallery-tools\">\n          <input id=\"skill-filter\" class=\"mil-input\" style=\"width:210px;min-width:140px\" placeholder=\"搜索技能名称、编号或用途…\" aria-label=\"筛选技能\">\n          <button id=\"refresh-skills\" class=\"mil-key mil-key--sm\" type=\"button\">刷新<\/button>\n          <button id=\"open-import-skill\" class=\"mil-key mil-key--sm\" type=\"button\">导入技能包<\/button>\n          <button id=\"open-create-skill\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\">+ 新建技能<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- 折叠导入与新建抽屉 -->\n      <div id=\"skill-add-drawer\" class=\"mil-screen sk-add-drawer\" hidden>\n        <div class=\"mil-grid-2\">\n          <div class=\"ab-dropzone\" id=\"skill-dropzone\">\n            <div class=\"mil-row\" style=\"justify-content:space-between;margin-bottom:8px\">\n              <div class=\"mil-row\" style=\"gap:6px\">\n                <span class=\"mil-silk\"><span class=\"mil-silk-en\">ARCHIVE IMPORT · <\/span>压缩包或 Markdown 导入<\/span>\n                <button type=\"button\" class=\"mil-help\" data-help=\"支持 .zip / .skill / .tar.gz / .tgz / .tar 或单个 SKILL.md；自动保留 references/、scripts/、assets/ 并支持多目录批量导入\" aria-label=\"查看导入格式说明\" aria-expanded=\"false\">?<\/button>\n              <\/div>\n              <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"close-add-drawer\">收起<\/button>\n            <\/div>\n            <div class=\"mil-row\" style=\"margin-bottom:10px\">\n              <input id=\"import-skill-id\" class=\"mil-input mono\" style=\"flex:1 1 160px\" placeholder=\"覆盖技能编号（留空自动识别）\">\n            <\/div>\n            <div class=\"mil-row\">\n              <input type=\"file\" id=\"skill-file\" accept=\".zip,.skill,.tar.gz,.tgz,.tar,.tar.bz2,.tar.xz,.md,.txt,text/markdown,application/zip,application/gzip,application/x-tar\" aria-label=\"上传技能压缩包或 Markdown 文件\" style=\"font-size:12.5px;max-width:100%\">\n            <\/div>\n            <details style=\"margin-top:10px\">\n              <summary class=\"mil-label\" style=\"cursor:pointer\">粘贴 Base64 技能包文本导入<\/summary>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:8px\">\n                <textarea id=\"skill-pkg-text\" class=\"mil-textarea mil-textarea--code\" rows=\"3\" placeholder=\"粘贴 Base64 编码的技能压缩包或 Maisya 导出的技能包文本\"><\/textarea>\n                <div class=\"mil-row\">\n                  <button id=\"import-skill-b64\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\">导入包文本<\/button>\n                <\/div>\n              <\/div>\n            <\/details>\n          <\/div>\n\n          <div class=\"ab-dropzone\" style=\"border-style:solid;border-color:var(--mil-line)\">\n            <div class=\"mil-row\" style=\"gap:6px;margin-bottom:8px\">\n              <span class=\"mil-silk\"><span class=\"mil-silk-en\">NEW SKILL · <\/span>新建空白技能<\/span>\n              <button type=\"button\" class=\"mil-help\" data-help=\"创建后自动生成 YAML frontmatter 与标准章节模板并进入编辑\" aria-label=\"查看新建技能说明\" aria-expanded=\"false\">?<\/button>\n            <\/div>\n            <div class=\"mil-field\" style=\"margin-bottom:10px\">\n              <label class=\"mil-label\" for=\"new-skill-id\">新技能编号<\/label>\n              <input id=\"new-skill-id\" class=\"mil-input mono\" placeholder=\"例如 source-audit\">\n            <\/div>\n            <div class=\"mil-field\" style=\"margin-bottom:10px\">\n              <label class=\"mil-label\" for=\"new-skill-title\">显示名称或用途提示<\/label>\n              <input id=\"new-skill-title\" class=\"mil-input\" placeholder=\"例如 一手来源交叉核验\">\n            <\/div>\n            <div class=\"mil-row\">\n              <button id=\"create-skill\" class=\"mil-key mil-key--sm mil-key--hot\" type=\"button\">创建并编辑<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- 来源与角色筛选胶囊 -->\n      <div id=\"skill-scope-bar\" class=\"mil-row\" style=\"margin-bottom:14px;gap:8px\" role=\"group\" aria-label=\"按来源或角色筛选技能\"><\/div>\n\n      <!-- 2 列技能卡片画廊 -->\n      <div id=\"skills-roster\" class=\"sk-gallery-grid\"><\/div>\n      <div class=\"mil-row\" style=\"justify-content:space-between;margin-top:14px\">\n        <span class=\"mil-hint\" id=\"skills-summary-foot\">共 0 项技能<\/span>\n        <button id=\"clear-skill-filter\" class=\"mil-key mil-key--sm\" type=\"button\" hidden>清除筛选<\/button>\n      <\/div>\n    <\/section>\n\n    <!-- 视图 B：技能 / 角色编辑工作台（点击技能或角色后展开） -->\n    <section class=\"mil-panel mil-panel--flat\" id=\"editor-panel\" hidden>\n      <div class=\"mil-head\">\n        <div class=\"mil-head-l\">\n          <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"back-to-skills\">← 返回技能库<\/button>\n          <span class=\"mil-silk\" id=\"editor-silk\">SKILL · 技能工作台<\/span>\n          <span class=\"mil-tag mono\" id=\"active-target-tag\">—<\/span>\n          <span class=\"mil-tag\" id=\"version\">v0<\/span>\n          <span class=\"mil-tag mil-tag--warn\" id=\"dirty-tag\" hidden>未保存<\/span>\n        <\/div>\n        <div class=\"mil-head-r\">\n          <div class=\"mil-row\" id=\"skill-head-actions\">\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"export-skill\">导出技能包<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"copy-skill\">复制 SKILL.md<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"reset-skill\" hidden>重置预设<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm mil-key--danger\" id=\"delete-skill\">删除技能<\/button>\n          <\/div>\n          <div class=\"mil-seg\" id=\"role-doc-tabs\" role=\"tablist\" aria-label=\"角色文档类型\" hidden>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" data-doc-tab=\"profile\" aria-pressed=\"false\">角色说明<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" data-doc-tab=\"config\" aria-pressed=\"false\">模型与权限配置<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" data-doc-tab=\"notes\" aria-pressed=\"false\">方法笔记<\/button>\n          <\/div>\n          <select id=\"document\" class=\"mil-select sr-only\" aria-label=\"编辑文档类型\">\n            <option value=\"skill\" selected>技能定义<\/option>\n            <option value=\"profile\">角色说明<\/option>\n            <option value=\"config\">模型与权限配置<\/option>\n            <option value=\"notes\">方法笔记<\/option>\n          <\/select>\n        <\/div>\n      <\/div>\n\n      <!-- 角色小鱼头像栏与定制抽屉（仅角色工作台视图显示） -->\n      <div id=\"role-fish-bar\" class=\"mil-screen role-fish-bar\" hidden>\n        <div class=\"role-fish-head\">\n          <div class=\"mil-row\" id=\"role-fish-summary\" style=\"gap:12px;min-width:0;flex:1\"><\/div>\n          <div class=\"mil-row\" style=\"gap:6px\">\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"role-fish-reroll\" title=\"随机更换一条新的小鱼\">随机换鱼<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"role-fish-custom\" aria-expanded=\"false\">定制小鱼<\/button>\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"role-fish-reset\" hidden title=\"恢复此角色的默认固定小鱼\">默认小鱼<\/button>\n          <\/div>\n        <\/div>\n        <div id=\"role-fish-drawer\" class=\"fish-drawer\" hidden><\/div>\n      <\/div>\n\n      <!-- SKILL.md 可视化元信息、角色装配与附属文件 -->\n      <div id=\"skill-visual\" class=\"mil-screen\" style=\"margin-bottom:14px\">\n        <div class=\"mil-row\" style=\"justify-content:space-between;margin-bottom:12px\">\n          <div class=\"mil-row\" style=\"gap:6px\">\n            <span class=\"mil-silk\">技能元信息与角色装配<\/span>\n            <button type=\"button\" class=\"mil-help\" data-help=\"此处改动将实时同步到下方 SKILL.md 源码中\" aria-label=\"查看技能元信息说明\" aria-expanded=\"false\">?<\/button>\n          <\/div>\n          <div class=\"mil-row\" style=\"gap:6px\">\n            <input id=\"clone-skill-id\" class=\"mil-input mono\" style=\"width:165px\" placeholder=\"复制为新技能编号\">\n            <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"clone-skill\">复制为新技能<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"mil-grid-2\" style=\"margin-bottom:12px\">\n          <div class=\"mil-field\">\n            <label class=\"mil-label\" for=\"sk-meta-name\">技能标识<\/label>\n            <input id=\"sk-meta-name\" class=\"mil-input mono\" placeholder=\"如 news-digest\">\n          <\/div>\n          <div class=\"mil-field\">\n            <label class=\"mil-label\" for=\"sk-meta-desc\">用途简述<\/label>\n            <input id=\"sk-meta-desc\" class=\"mil-input\" placeholder=\"一句话说明何时启用\">\n          <\/div>\n        <\/div>\n        <div class=\"mil-field\" style=\"margin-bottom:12px\">\n          <span class=\"mil-label\">装配到角色<\/span>\n          <div class=\"mil-row\" id=\"sk-role-bindings\"><\/div>\n        <\/div>\n        <div id=\"sk-companions-box\" style=\"margin-bottom:12px;padding-top:12px;border-top:1px solid var(--mil-rule)\" hidden>\n          <div class=\"mil-row\" style=\"justify-content:space-between;margin-bottom:8px\">\n            <span class=\"mil-label\">技能附属文件 (<span class=\"mono\" id=\"sk-companion-mount\">in/skills/<\/span>)<\/span>\n            <span class=\"mil-tag num\" id=\"sk-companion-count\">0 个文件<\/span>\n          <\/div>\n          <div class=\"mil-row\" id=\"sk-companions-list\" style=\"margin-bottom:8px\"><\/div>\n          <pre id=\"sk-companion-preview\" class=\"mil-pre\" style=\"max-height:180px\" hidden><\/pre>\n        <\/div>\n        <div class=\"mil-row\" style=\"gap:8px\">\n          <span class=\"mil-label\">结构模板片段<\/span>\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sk-snippet=\"scene\">+ 适用场景<\/button>\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sk-snippet=\"steps\">+ 执行步骤<\/button>\n          <button type=\"button\" class=\"mil-key mil-key--sm\" data-sk-snippet=\"guard\">+ 质量边界<\/button>\n        <\/div>\n        <details id=\"skill-copy-drawer\" style=\"margin-top:10px\" hidden>\n          <summary class=\"mil-label\" id=\"skill-copy-summary\" style=\"cursor:pointer\">导出内容 / 手动复制<\/summary>\n          <textarea id=\"skill-copy-box\" class=\"mil-textarea mil-textarea--code\" style=\"margin-top:8px\" rows=\"4\" readonly aria-label=\"技能导出或复制框\"><\/textarea>\n        <\/details>\n      <\/div>\n\n      <!-- profile.toml 可视化配置器 -->\n      <div id=\"cfg-visual\" class=\"mil-screen\" style=\"margin-bottom:14px\" hidden>\n        <div class=\"mil-row\" style=\"justify-content:space-between;margin-bottom:12px\">\n          <span class=\"mil-silk\">可视化角色配置<\/span>\n          <button type=\"button\" class=\"mil-help\" data-help=\"常见字段直接点选并实时同步下方 TOML；其余复杂数组在源码中完整保留\" aria-label=\"查看角色配置说明\" aria-expanded=\"false\">?<\/button>\n        <\/div>\n        <div class=\"mil-grid-2\" style=\"margin-bottom:12px\">\n          <div class=\"mil-field\" style=\"grid-column:1/-1\">\n            <label class=\"mil-chk\"><input type=\"checkbox\" id=\"cfg-enabled\"><span>启用此角色<\/span><\/label>\n          <\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"cfg-title\">显示标题<\/label><input id=\"cfg-title\" class=\"mil-input\"><\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"cfg-env\">运行环境<\/label><select id=\"cfg-env\" class=\"mil-select\"><option value=\"readonly\">轻量只读环境（无需容器）<\/option><option value=\"sandbox\">隔离沙箱环境（Docker）<\/option><\/select><\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"cfg-access\">调用权限<\/label><select id=\"cfg-access\" class=\"mil-select\"><option value=\"everyone\">所有人与自主探索可用<\/option><option value=\"admins\">仅管理员可用<\/option><option value=\"listed\">仅指定会话或成员可用（白名单）<\/option><\/select><\/div>\n          <div class=\"mil-field\"><label class=\"mil-label\" for=\"cfg-task\">默认模型类型<\/label><select id=\"cfg-task\" class=\"mil-select\"><option value=\"utils\">通用工具模型<\/option><option value=\"planner\">主规划模型<\/option><option value=\"replyer\">对话回复模型<\/option><option value=\"fast_model\">轻量快速模型<\/option><option value=\"vlm\">图文视觉模型<\/option><\/select><\/div>\n        <\/div>\n        <div id=\"cfg-allow-scope-wrap\" class=\"ms-builder-box\" style=\"margin-bottom:14px\" hidden>\n          <div id=\"cfg-allow-chats-box\" class=\"ms-entry-box\"><\/div>\n          <div id=\"cfg-allow-users-box\" class=\"ms-entry-box\" style=\"padding-top:8px;border-top:1px solid var(--mil-rule)\"><\/div>\n        <\/div>\n        <div class=\"cfg-model-panel\" style=\"margin-bottom:14px\">\n          <div class=\"mil-row\" style=\"justify-content:space-between;margin-bottom:8px\">\n            <div class=\"mil-row\" style=\"gap:6px\">\n              <span class=\"mil-label\" style=\"margin:0\">角色模型分配与回退顺序<\/span>\n              <button type=\"button\" class=\"mil-help\" data-help=\"可从宿主已添加的模型中按顺序分配一个或多个模型：优先调用 #1 主选，不可用或报错时自动依次回退到 #2、#3…；未分配具体模型时默认沿用上方宿主模型槽位 (task)\" aria-label=\"查看角色模型分配说明\" aria-expanded=\"false\">?<\/button>\n            <\/div>\n            <div class=\"mil-row\" style=\"gap:6px\">\n              <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"cfg-model-sync\" title=\"重新同步宿主模型列表中的全部已添加模型\">同步模型列表<\/button>\n              <button type=\"button\" class=\"mil-key mil-key--sm\" id=\"cfg-model-clear\">清空<\/button>\n            <\/div>\n          <\/div>\n          <div id=\"cfg-model-chain\" class=\"cfg-model-chain\" aria-label=\"已分配模型顺序列表\"><\/div>\n          <div class=\"cfg-model-controls\">\n            <select id=\"cfg-model-picker\" class=\"mil-select\" aria-label=\"选择宿主已添加模型\"><\/select>\n            <div class=\"cfg-model-manual\">\n              <input id=\"cfg-model-name\" class=\"mil-input mono\" placeholder=\"或输入宿主模型名，如 step-5-preview\" aria-label=\"手动输入模型名\">\n              <button type=\"button\" class=\"mil-key mil-key--sm mil-key--hot\" id=\"cfg-model-add\">+ 添加<\/button>\n            <\/div>\n          <\/div>\n          <div id=\"cfg-host-models-list\" class=\"cfg-host-models\" aria-label=\"宿主可用模型快捷点选\"><\/div>\n        <\/div>\n        <details id=\"cfg-advanced-fields\" style=\"margin-bottom:12px\">\n          <summary class=\"mil-label\" style=\"cursor:pointer\">高级运行与采样参数（可选）<\/summary>\n          <div class=\"mil-grid-2\" style=\"margin-top:10px\">\n            <div class=\"mil-field\"><label class=\"mil-label\
