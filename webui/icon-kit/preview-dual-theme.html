<!doctype html>
<!-- Maisya Dual-Theme Kubai Layered Animated Icons Showcase -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maisya 双主题分层动态图标总览</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #141517;
  color: #F2F0EC;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px;
}
.wrap { display: grid; gap: 18px; max-width: 920px; margin: 0 auto; }
.panel {
  border-radius: 16px;
  padding: 16px 18px;
  border: 1px solid #282B2F;
}
.panel--modern { background: #F6F4EF; color: #141413; border-color: #E2DDD3; }
.panel--mil-light {
  background: #DDD4BF; color: #2B2623; border: 2px solid #5A544A; border-radius: 0;
  box-shadow: inset 2px 2px 0 #F6F1E3, inset -2px -2px 0 #BDB39C, 0 4px 0 #9C927B;
}
.panel--mil-dark {
  background: #2F2C28; color: #EEE9DE; border: 2px solid #171513; border-radius: 0;
  box-shadow: inset 2px 2px 0 #524D46, inset -2px -2px 0 #24211D, 0 4px 0 #141210;
}
.hdr { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
.hdr h2 { margin: 0; font-size: 15px; font-weight: 700; }
.hdr span { font-size: 11.5px; opacity: 0.72; }
.grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; }
.cell {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px 8px; border-radius: 12px;
}
.panel--modern .cell { background: #FFFFFF; border: 1px solid #E2DDD3; }
.panel--mil-light .cell {
  background: #EBE4D2; border: 1.5px solid #5A544A; border-radius: 0;
  box-shadow: inset 1px 1px 0 #F6F1E3, inset -1px -1px 0 #BDB39C;
}
.panel--mil-dark .cell {
  background: #3A3631; border: 1.5px solid #171513; border-radius: 0;
  box-shadow: inset 1px 1px 0 #524D46, inset -1px -1px 0 #24211D;
}
.lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }
.key { font-size: 9.5px; opacity: 0.58; font-family: ui-monospace, "SF Mono", monospace; }

.m-ic-kubai { overflow: visible; display: inline-block; }
.m-ic-kubai .ol { fill: none; stroke-width: 2; }
.m-ic-kubai .ln { fill: none; stroke-width: 1.6; stroke-linecap: round; }

.panel--mil-light .m-ic-mil.m-ic-kubai {
  box-sizing: content-box; padding: 3px;
  background: #F3EEE1; border: 1.5px solid #5A544A; border-radius: 0;
  box-shadow: inset 1px 1px 0 #FDFBF5, inset -1px -1px 0 #CBBFA8, 0 2px 0 #9C927B;
}
.panel--mil-dark .m-ic-mil.m-ic-kubai {
  box-sizing: content-box; padding: 3px;
  background: #4D4841; border: 1.5px solid #171513; border-radius: 0;
  box-shadow: inset 1px 1px 0 #605A52, inset -1px -1px 0 #302C27, 0 2px 0 #141210;
}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel panel--modern">
    <div class="hdr">
      <h2>现代极简（Modern）· 浮动分层动态图标</h2>
      <span>16 枚 · 暖白编辑画布 · 主色外描边与柔和投影 · 460ms 悬停形变</span>
    </div>
    <div class="grid" id="g-modern"></div>
  </section>
  <section class="panel panel--mil-light">
    <div class="hdr">
      <h2>千禧机械 · 浅色（Millennium Light）· 机械键帽硬件图标</h2>
      <span>16 枚 · 复古塑料机壳 · #4F4940 机械丝印描边 + 0px 键帽底座</span>
    </div>
    <div class="grid" id="g-mil-l"></div>
  </section>
  <section class="panel panel--mil-dark">
    <div class="hdr">
      <h2>千禧机械 · 深色（Millennium Dark）· OLED 磷光键帽图标</h2>
      <span>16 枚 · 炭石墨机壳 · #25211D 暗色轮廓 + 荧光绿 / 珊瑚 / 琥珀色标</span>
    </div>
    <div class="grid" id="g-mil-d"></div>
  </section>
</div>
<script src="../icons.js"></script>
<script>
const ITEMS = [
  ['roles', '角色'], ['skills', '技能'], ['artifacts', '产物'], ['workspace', '工作区'],
  ['memory', '备忘'], ['journal', '手账'], ['heartbeat', '心跳'], ['routines', '预定'],
  ['vault', '保险箱'], ['mcp', '连接器'], ['webhook', '信号'], ['gear', '设置'],
  ['cpu', '模型'], ['sliders', '调控'], ['chats', '会话'], ['package', '能力包']
];
const ic = window.MaisyaIcons;
function fill(id, fn) {
  const el = document.getElementById(id);
  el.innerHTML = ITEMS.map(([k, zh]) =>
    `<div class="cell">${fn(k, 32)}<div class="lbl">${zh}</div><div class="key">${k}</div></div>`
  ).join('');
}
fill('g-modern', (k, s) => ic.soft3d(k, s));
fill('g-mil-l', (k, s) => ic.mil(k, s, false));
fill('g-mil-d', (k, s) => ic.mil(k, s, true));
</script>
</body>
</html>
