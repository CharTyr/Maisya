# Maisya 插件最简配置模板（高级预算项保持内置自适应默认值）

# 插件侧管理员列表（与宿主 plugin.permission 合并生效；纯数字自动按 qq 处理，严格保留 user_id 大小写）
# 示例: admins = ["qq:10001"]
admins = []

# 高风险操作确认策略: "ask_risky"（默认，关键更改前询问）| "autonomous" | "always_ask"
permission_mode = "ask_risky"

# 启用 Maisya 的会话白名单（核验后的管理员私聊默认直接可用）
# 示例: enabled_chats = ["qq:group:100246809", "qq:private:10001"]
enabled_chats = []

# 全局主模型覆盖（留空则跟随 MaiBot 宿主任务槽与档案设置）
default_model = ""

# 管理台主题: "millennium"（默认千禧机械）| "modern"（现代极简）| "auto"
ui_style = "millennium"

# 主动节律与免打扰设置
sleep_window = ""
proactive_level = "care"
# 心跳档位: "off"（默认关，仅保留事后惦记）| "gentle"（克制）| "lively"（活泼）
heartbeat_mode = "off"
# 每日主动总量（全局）与单会话每日上限
daily_proactive_limit = 3
per_chat_daily_proactive_limit = 1
# 后台自主执行日预算与连续失败退避熔断上限（仅限后台心跳/盯梢/周期任务，不限制用户触发的 return 回传）
daily_bg_runs_limit = 48
daily_bg_tokens_limit = 200000
bg_max_consecutive_failures = 3

[chat_proactive_levels]

[plugin]
# 插件总开关（也可在首次安装引导或 WebUI 设置页开启）
enabled = false
config_version = "0.1.0"

[sandbox]
# 可选 Docker 隔离执行层（开启后主要用于非管理员轮次隔离）
enabled = false
# 留空等同默认镜像 maisya-sandbox:latest（旧版配置的 image = "" 会自动回落）
image = "maisya-sandbox:latest"
socket = "unix:///var/run/docker.sock"
# 留空使用默认容器运行时，也可填 "runc" / "runsc"
runtime = ""
network_mode = "none"
readonly_rootfs = true
privileged_sandbox_mode = false
